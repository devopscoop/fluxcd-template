# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-barman-plugin
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: cnpg-barman-plugin-values
    - kind: Secret
      name: cnpg-barman-plugin-secrets
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.7.1
      sourceRef:
        kind: HelmRepository
        name: cnpg-barman-plugin
