apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
spec:
  # The private Gateway: monitoring UIs stay off the internet-facing LB even
  # after eg-public goes public.
  parentRefs:
    - name: eg-private
      namespace: envoy-gateway-system
      # HTTPS only; plain HTTP on :80 is 301'd by httproute-redirect-private.yaml.
      sectionName: https
  hostnames:
    - alertmanager.project1-dev.devops.coop
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # The operator names the Service vmalertmanager-<VMAlertmanager CR
        # name>; the CR is named after fullnameOverride in values.yaml.
        - name: vmalertmanager-victoria-metrics
          port: 9093
