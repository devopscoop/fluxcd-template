apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmui
spec:
  # The private Gateway: monitoring UIs stay off the internet-facing LB even
  # after eg-public goes public.
  parentRefs:
    - name: eg-private
      namespace: envoy-gateway-system
  hostnames:
    - vmui.devops.coop
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # The operator names the Service vmsingle-<VMSingle CR name>; the CR is
        # named after fullnameOverride in values.yaml. The query UI lives under
        # /vmui on the same port that serves the query and write APIs.
        - name: vmsingle-victoria-metrics
          port: 8428
