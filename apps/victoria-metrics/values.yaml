# dyff between <(yq . <(helm show values victoria-metrics/victoria-metrics-k8s-stack --version 0.91.2)) <(yq eval '. * load("values.yaml")' <(helm show values victoria-metrics/victoria-metrics-k8s-stack --version 0.91.2))
# vim -O <(helm show values victoria-metrics/victoria-metrics-k8s-stack --version 0.91.2) values.yaml

# Without this the chart names every CR "victoria-metrics-victoria-metrics-k8s-stack"
# (release + chart name), and the operator derives Service names from CR names,
# giving DNS names like vmsingle-victoria-metrics-victoria-metrics-k8s-stack.
# Other apps hardcode these URLs (otel-collector remote-writes to vmsingle), so
# keep them short and stable: vmsingle-victoria-metrics, vmalertmanager-victoria-metrics, ...
fullnameOverride: victoria-metrics

# The VictoriaMetrics operator turns the VM* CRs below into running pods.
victoria-metrics-operator:
  operator:
    # This is the chart default, pinned because the either/or swap with
    # kube-prometheus-stack depends on it: the operator mirrors
    # prometheus-operator objects (ServiceMonitor, PodMonitor, PrometheusRule,
    # Probe, ScrapeConfig) into their VM equivalents, so charts written for
    # prometheus-operator plug into this stack unchanged. Note the chart does
    # NOT install the prometheus-operator CRDs themselves -- see README.md.
    disable_prometheus_converter: false
  # Initial guesses (resize with krr after 14d of usage); memory req=limit,
  # no CPU limit.
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

vmsingle:
  spec:
    # Keep 30 days of history, parity with the kube-prometheus-stack app (the
    # chart default is "1", meaning one calendar month).
    retentionPeriod: 30d
    # The cluster is IPv6-only, and every VictoriaMetrics binary listens and
    # dials tcp4-only unless this flag is set (lib/netutil hardcodes "tcp4"
    # otherwise) -- without it the pod can't accept service traffic or pass
    # probes, because the pod has no IPv4 address. Same flag on vmagent and
    # vmalert below. Alertmanager, Grafana, and the exporters are ordinary
    # dual-stack Go listeners and need nothing.
    extraArgs:
      enableTCP6: "true"
    # 20Gi holds 30d comfortably: VictoriaMetrics compresses to well under a
    # byte per sample (roughly 7x denser than Prometheus's TSDB), so this is
    # the counterpart of the 50Gi Prometheus volume in
    # apps/kube-prometheus-stack. There is no retentionSize equivalent to
    # tune: when the disk does fill, vmsingle switches to read-only instead of
    # crash-looping. No storageClassName, so the cluster's default
    # StorageClass is used.
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
    # Initial guesses (resize with krr after 14d of usage); memory req=limit,
    # no CPU limit.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 512Mi
    # vmsingle is a singleton: if a spot reclaim takes it down, ingestion and
    # rule evaluation stop with it. Pin it to on-demand capacity, per the
    # NodePool contract in apps/karpenter-custom-resources/nodepool.yaml.
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#     nodeSelector:
#       karpenter.sh/capacity-type: on-demand
# <<< eks

alertmanager:
  spec:
    # Public URL Alertmanager uses when generating links (e.g. the title link
    # in Slack notifications); without it they point at the internal service
    # URL http://vmalertmanager-victoria-metrics.victoria-metrics:9093.
    externalURL: https://alertmanager.devops.coop

    # Initial guesses (resize with krr after 14d of usage); memory req=limit,
    # no CPU limit.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi

    # Persist /alertmanager so silences and the notification log survive pod
    # restarts (the operator defaults to an emptyDir). The data is only a few
    # KB, but 1Gi is the practical floor: EBS won't provision smaller, and
    # most other provisioners round up to it anyway. No storageClassName, so
    # the cluster's default StorageClass is used.
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    # Alertmanager is a singleton: if a spot reclaim takes it down, nothing
    # pages -- including about the reclaim itself. Pin it to on-demand
    # capacity, per the NodePool contract in
    # apps/karpenter-custom-resources/nodepool.yaml. (Gossip clustering only
    # starts at replicaCount > 1, so single-replica Alertmanager also sidesteps
    # any memberlist-over-IPv6 concerns -- see apps/loki/values.yaml.)
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#     nodeSelector:
#       karpenter.sh/capacity-type: on-demand
# <<< eks

# Send every alert to Slack. The channel below is not secret, but the webhook
# URL is, so it lives in helm_secrets.yaml (alertmanager.config.global.slack_api_url),
# which Flux merges over this file -- see valuesFrom in release.yaml.
# >>> slack: deploy.sh uncomments this block when slack_alerts=true (variables.sh)
#   config:
#     route:
#       receiver: slack
#     receivers:
#       # The chart's default route sends unmatched alerts to the 'blackhole'
#       # receiver, and setting receivers here replaces the chart's whole list,
#       # so keep it.
#       - name: blackhole
#       - name: slack
#         slack_configs:
#           - channel: '#alerts' # TODO: replace with your Slack channel
#             send_resolved: true
#             # Alertmanager's default Slack message is only a terse title like
#             # "[FIRING:2] (ns/pod critical)". Keep that as the headline, but
#             # render each alert's summary, description, and runbook in the body.
#             title: '{{ template "slack.default.title" . }}'
#             text: |-
#               {{ range .Alerts }}*{{ .Labels.alertname }}* `{{ .Labels.severity }}`{{ if .Annotations.summary }} — {{ .Annotations.summary }}{{ end }}
#               {{ .Annotations.description }}{{ if .Annotations.runbook_url }} <{{ .Annotations.runbook_url }}|:book: runbook>{{ end }}
#               {{ end }}
