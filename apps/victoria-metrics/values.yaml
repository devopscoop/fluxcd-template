# Grafana sits behind a repo-managed HTTPRoute (grafana-httproute.yaml), not
# the subchart's ingress, so the chart can't discover its public URL and
# renders vmalert's -external.url as a bare "http://". vmalert embeds this URL
# in every alert's "source" link (it deep-links into Grafana Explore).
external:
  grafana:
    host: https://grafana.devops.coop

vmalert:
  spec:
    # See the IPv6-only note on vmsingle.
    extraArgs:
      enableTCP6: "true"
    # Initial guesses (resize with krr after 14d of usage); memory req=limit,
    # no CPU limit.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi

vmagent:
  spec:
    # See the IPv6-only note on vmsingle. enableTCP6 also covers dialing, which
    # vmagent needs to scrape targets that only have IPv6 addresses.
    extraArgs:
      enableTCP6: "true"
    # Initial guesses (resize with krr after 14d of usage); memory req=limit,
    # no CPU limit. vmagent memory grows with the number of scraped series, so
    # expect to bump this first.
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        memory: 256Mi

# The chart auto-provisions the VictoriaMetrics (prometheus-type) datasource
# pointing at the vmsingle service
# (http://vmsingle-victoria-metrics.victoria-metrics.svc.cluster.local:8428),
# plus an Alertmanager datasource, so neither needs wiring up here. The two
# entries below point at the sibling apps/victoria-logs and apps/tempo apps.
# They are `extra` datasources rather than external.vl/vt URLs on purpose:
# setting external.vl.read.url would insert the chart's internal vmauth proxy
# between vmalert and its datasource, one more moving part in the alerting
# path for no benefit until we alert on logs.
defaultDatasources:
  extra:
    - name: VictoriaLogs
      type: victoriametrics-logs-datasource
      uid: victorialogs
      access: proxy
      url: http://victoria-logs-server.victoria-logs.svc.cluster.local:9428
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.tempo.svc.cluster.local:3200

grafana:
  grafana.ini:
    server:
      # Public URL Grafana uses when generating absolute links (e.g. Explore
      # short links); without it they point at the default localhost:3000.
      # Same hostname as the kube-prometheus-stack Grafana: the two stacks are
      # either/or, so only one of them ever answers on it.
      root_url: https://grafana.devops.coop/
  # The VictoriaLogs datasource above and the "VictoriaMetrics (DS)"
  # datasource the chart provisions by default are Grafana plugins, not
  # built-in types. Grafana downloads them at startup, which needs egress to
  # grafana.com/api (the dashboard/rule sync-job needs similar egress to
  # raw.githubusercontent.com).
  plugins:
    - victoriametrics-logs-datasource
    - victoriametrics-metrics-datasource
  # Initial guesses (resize with krr after 14d of usage); memory req=limit,
  # no CPU limit.
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
    limits:
      memory: 192Mi
  # Dashboard/datasource provisioning sidecars share this block.
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi

# Initial guesses (resize with krr after 14d of usage); memory req=limit, no
# CPU limit.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

# On EKS the scheduler, controller-manager, and etcd run inside the AWS-managed
# control plane and expose no metrics endpoints, so none of these targets can
# ever be scraped. Disable them so their scrape objects and permanently-firing
# absence alerts go away. (Unlike kube-prometheus-stack, kube-proxy scraping is
# already off by default in this chart.) On k0s/talos these components run on
# your own nodes, so leave them enabled.
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
# kubeScheduler:
#   enabled: false
# kubeControllerManager:
#   enabled: false
# kubeEtcd:
#   enabled: false
