##       URL tag matches apps/rook-ceph-cluster's pin — bump it when bumping
##       the app; rook's copies track the ceph-mixin originals with Rook
##       tweaks. The per-OSD drill-down dashboard rook also carries (Ceph
##       OSD Single) is deliberately skipped — it's a break-glass view; add
##       it the same way if an OSD alert makes you miss it. Known gap: the
##       Ceph Cluster CPU panel filters node_cpu_seconds_total on
##       job="node", which matches nothing under this stack's node-exporter
##       job naming, so that panel stays empty (the other node_* panels
##       carry no job filter and show all nodes, not just storage nodes — a
##       known, harmless imprecision).
#       ceph-cluster:
#         url: https://raw.githubusercontent.com/rook/rook/v1.17.5/deploy/examples/monitoring/grafana/Ceph%20Cluster%20Dashboard.json
#         datasource:
#           - name: DS_PROMETHEUS
#             value: VictoriaMetrics
#       ceph-pools:
#         url: https://raw.githubusercontent.com/rook/rook/v1.17.5/deploy/examples/monitoring/grafana/Ceph%20Pools%20Dashboard.json
#         datasource:
#           - name: DS_PROMETHEUS
#             value: VictoriaMetrics
# <<< rook-ceph
# >>> uptime-kuma: ./toggle_blocks.sh --enable uptime-kuma when enabling apps/uptime-kuma
##       "Uptime Kuma - Metrics" (grafana.com 18278 — the only meaningful
##       Uptime Kuma dashboard published) — per-monitor status, response
##       time, and certificate expiry/validity as seen by its black-box
##       probes — fed by apps/uptime-kuma's in-app vmservicescrape.yaml
##       (in-app because the scrape's basicAuth secret must share its
##       namespace; the dashboard has no such constraint, so it downloads
##       here like every other one with an upstream).
#       uptime-kuma:
#         gnetId: 18278
#         revision: latest
#         datasource:
#           - name: DS_PROMETHEUS
#             value: VictoriaMetrics
# <<< uptime-kuma
  # Memory req=limit, no CPU limit. Doubled to 384Mi after OOMKills
  # (2026-08-25), then OOMKilled again on 2026-08-26 once the kubelet
  # relabelConfigs fix below un-dropped the label-heavy cadvisor series
  # (dashboards now pull far more series per query) — doubled to 768Mi.
  resources:
    requests:
      cpu: 10m
      memory: 768Mi
    limits:
      memory: 768Mi
  # Dashboard/datasource provisioning sidecars share this block.
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
    # Load grafana_dashboard=1 ConfigMaps from every namespace instead of
    # only this one, so a chart that packages its own dashboard can just
    # enable it wherever it deploys (apps/cnpg's monitoring.grafanaDashboard)
    # and the dashboard tracks that chart's pin with no vendored copy here.
    # The sidecar's ClusterRole already allows it. Trade-off: anything that
    # can create a labeled ConfigMap in some namespace can register a
    # dashboard. Mirrored in apps/kube-prometheus-stack — the two stacks are
    # either/or, so keep them interchangeable.
    dashboards:
      searchNamespace: ALL

# Initial guesses (resize with krr after 14d of usage); memory req=limit, no
# CPU limit.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

# The chart's default kubelet scrape labelmaps every Kubernetes node label
# onto every kubelet/cadvisor series. On nodes with label-heavy provisioners
# (Karpenter alone stamps ~20) that pushed series past vmsingle's
# -maxLabelsPerTimeseries default of 40, so vmsingle dropped them on ingestion
# (RowsRejectedOnIngestion + TooManyLogs alerts, and holes in dashboards for
# pods on those nodes) -- and even under the cap it bloats every container
# series with node metadata. Replace the default relabelConfigs with the same
# list minus the labelmap (lists don't merge). The operator still attaches the
# node name as the "node" and "instance" labels on its own; that's all the
# bundled dashboards use.
kubelet:
  vmScrape:
    spec:
      relabelConfigs:
        - sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - targetLabel: job
          replacement: kubelet

# On EKS the scheduler, controller-manager, and etcd run inside the AWS-managed
# control plane and expose no metrics endpoints, so none of these targets can
# ever be scraped. Disable them so their scrape objects go away. (Unlike
# kube-prometheus-stack, kube-proxy scraping is already off by default in this
# chart.) On k0s/talos these components run on your own nodes, so leave them
# enabled.
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
# kubeScheduler:
#   enabled: false
# kubeControllerManager:
#   enabled: false
# kubeEtcd:
#   enabled: false
# <<< eks

defaultRules:
  groups:
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#     # Unlike kube-prometheus-stack, this chart does NOT gate the matching rule
#     # groups on the kubeScheduler/kubeControllerManager flags above (it does
#     # for etcd, but not for the scheduler or controller-manager), so their
#     # absent(up{job=...}) alerts -- KubeSchedulerDown, KubeControllerManagerDown
#     # -- fire forever even with the scrapes disabled. Disable those groups
#     # explicitly too: the two alerting groups, plus the scheduler recording
#     # rules that can never have data (they'd otherwise trip vmalert's
#     # RecordingRulesNoData).
#     kube-scheduler.rules:
#       enabled: false
#     kubernetes-system-scheduler:
#       enabled: false
#     kubernetes-system-controller-manager:
#       enabled: false
# <<< eks
    # count:up0 records how many scrape targets are down (up == 0), so on a
    # healthy cluster it matches nothing and produces 0 samples, which trips
    # vmalert's RecordingRulesNoData alert after 30min. Nothing bundled reads
    # it (up == 0 answers the same question, and its always-populated twin
    # count:up1 stays enabled), so disable the rule rather than the alert --
    # RecordingRulesNoData stays useful for rules that should always have data.
    kube-prometheus-general.rules:
      rules:
        "count:up0":
          enabled: false
