# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: victoria-metrics-values
    - kind: Secret
      name: victoria-metrics-secrets
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.91.2
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
