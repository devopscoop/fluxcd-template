# Scrape the flux-operator itself (installed by deploy.sh's `flux-operator
# install`, not part of any app) — most importantly its Prometheus exporter:
# flux_resource_info, one always-refreshed series per Flux resource with
# ready/suspended/kind/name labels, plus flux_instance_info and
# flux_operator_info. These are what the VMRule below alerts on, and what the
# Flux Performance dashboard's resource panels read; the controllers
# themselves stopped exporting per-resource readiness
# (gotk_reconcile_condition) upstream. Served on :8080 /metrics, plain HTTP,
# alongside its controller-runtime metrics — the container port named
# "http-metrics" (verified in flux-operator v0.60.0 install.yaml; note
# `flux-operator install` self-updates the operator, so re-verify the port
# name if a future version renames it).
#
# A separate object from the flux-controllers scrape below because the
# operator pod carries only app.kubernetes.io/name=flux-operator — it is not
# part-of=flux. A pod scrape rather than mirroring upstream's ServiceMonitor
# because the flux-operator Service names the 8080 port just "http" (upstream
# dodges that with targetPort), while the container port name is specific.
#
# The pod's prometheus.io/scrape annotations do nothing in this stack —
# vmagent runs no annotation-based discovery — so an explicit scrape object
# is required.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: flux-operator
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  podMetricsEndpoints:
    - port: http-metrics
---
# Scrape the Flux controllers' own metrics — reconcile-duration histograms
# (gotk_reconcile_duration_seconds), controller-runtime reconcile/workqueue
# internals, client-go request rates — from the :8080 container port named
# "http-prom" that every controller the FluxInstance renders exposes, plain
# HTTP /metrics with no auth (verified in the flux-operator v0.60.0
# per-version manifests for distribution 2.9.1, matching
# flux/flux-system/flux-instance.yaml's pin). The rendered "allow-scraping"
# NetworkPolicy in flux-system admits ingress from every namespace on 8080
# only, so vmagent reaches these without any policy change.
#
# The selector is the app.kubernetes.io/part-of=flux label the operator
# stamps on every controller pod, rather than the hand-maintained per-name
# app label list fluxcd/flux2-monitoring-example's PodMonitor uses — that
# list omits source-watcher, which this FluxInstance runs. Same shape as
# upstream's own scrape object
# (flux-operator config/monitoring/flux-controllers.yaml). Do not select on
# app.kubernetes.io/instance: the flux CLI's install.yaml sets it but the
# operator rendering used here does not.
#
# Note the controllers no longer export gotk_reconcile_condition (dropped
# upstream; flux ≥2.1) — per-resource readiness comes from the flux-operator's
# flux_resource_info instead (the flux-operator scrape above), which is
# what the VMRule below alerts on. This scrape also arms the bundled TargetDown /
# KubeDeploymentReplicasMismatch alerts for the controllers themselves, so
# there is no bespoke "controller down" rule.
#
# gotk_reconcile_duration_seconds carries its own "namespace" label (the
# reconciled resource's); vmagent keeps the target's label on conflicts, so
# in the TSDB the pod namespace stays "namespace" (flux-system) and the
# resource's becomes "exported_namespace" — exactly what the vendored Flux
# dashboards in apps/victoria-metrics expect.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: flux-controllers
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  podMetricsEndpoints:
    - port: http-prom
---
# Alerting rules for the Flux control plane, evaluated by this stack's
# vmalert over the series collected by the two scrapes
# above. Remember the routing model
# (apps/victoria-metrics/README.md → "Alert routing"): every alert goes to
# both Slack and GoAlert paging, so severity is a label on the page, not a
# filter. Everything here is warning: a broken Flux stops *deploys*, not
# running workloads — the blast radius is "changes aren't landing", and the
# workload-level damage pages through the bundled kube rules on its own.
#
# The readiness rules are adapted from samber/awesome-prometheus-alerts'
# fluxcd set (the only public Flux ruleset; upstream flux-operator and
# fluxcd/flux2-monitoring-example ship dashboards but no rules), with one
# structural deviation: those rules key on gotk_resource_info, a
# kube-state-metrics custom-resource-state metric this repo doesn't
# configure — and the controllers' own gotk_reconcile_condition is gone as
# of Flux 2.1. The flux-operator's flux_resource_info exporter carries the
# same information (label "kind" instead of "customresource_kind"), so the
# rules are ported onto it, four kind-specific rules collapsed into one.
#
# flux_resource_info refreshes only when the operator's FluxReport
# reconciles — every 5m with the stock `flux-operator install` (the
# REPORTING_INTERVAL env var could lower it, but deploy.sh installs the
# operator unpatched and it self-updates). Every `for:` here is ≥15m to ride
# out that staleness plus normal retry/backoff churn.
#
# Deliberately no "controller down" rule: the pod scrape arms the bundled
# TargetDown / KubeDeploymentReplicasMismatch alerts for the controllers.
#
# Suspension is an operator's deliberate act (e.g.
# runbooks/restore-cnpg-database.md step 1), so the readiness rules skip
# suspended resources. FluxResourceSuspended covers the other half, a
# suspension nobody resumed: while a resource is suspended Flux neither
# reconciles it nor emits an event for it, so the cluster can drift from
# git with nothing recording the change.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: flux
spec:
  groups:
    - name: flux
      rules:
        - alert: FluxResourceNotReady
          annotations:
            summary: A Flux resource has been not-ready for 15 minutes.
            description: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{
              $labels.name }} has been reporting Ready=False for 15m — see
              `flux get all -n {{ $labels.exported_namespace }}` for the
              reason. Whatever that resource deploys is stuck at its last
              good revision.
          expr: |-
            flux_resource_info{ready="False", suspended="False"} == 1
          for: 15m
          labels:
            severity: warning
        - alert: FluxResourceSuspended
          annotations:
            summary: A Flux resource has been suspended for 2 hours.
            description: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{
              $labels.name }} has been suspended for 2h. Flux is not
              reconciling it, so what it deploys can drift from git silently
              and no deploy event is emitted for it. Resume with `flux resume
              {{ $labels.kind | toLower }} -n {{ $labels.exported_namespace }}
              {{ $labels.name }}`.
          expr: |-
            flux_resource_info{suspended="True"} == 1
          for: 2h
          labels:
            severity: warning
        - alert: FluxInstanceNotReady
          annotations:
            summary: The FluxInstance has been not-ready for 15 minutes.
            description: >-
              FluxInstance {{ $labels.exported_namespace }}/{{ $labels.name
              }} is reporting Ready={{ $labels.ready }} — the flux-operator
              can't reconcile the Flux distribution itself (failed
              upgrade/install of the controllers, or the cluster sync is
              misconfigured; see flux/flux-system/flux-instance.yaml). While
              this holds, GitOps for the whole cluster may be stopped.
          expr: |-
            flux_instance_info{ready!="True"} == 1
          for: 15m
          labels:
            severity: warning
        - alert: FluxControllerStuck
          annotations:
            summary: A Flux controller has been stuck on one item for 15m.
            description: >-
              The longest-running workqueue processor in pod {{ $labels.pod
              }} has been at it for {{ printf "%.0f" $value }}s. One
              reconcile is wedged (commonly a hung helm upgrade or an apply
              waiting on a webhook) and is starving the queue behind it —
              other resources' reconciles are piling up.
          expr: |-
            max by (pod) (
              workqueue_longest_running_processor_seconds{namespace="flux-system"}
            ) > 900
          for: 15m
          labels:
            severity: warning
        - alert: FluxAPIThrottled
          annotations:
            summary: Flux is being rate-limited by the Kubernetes API.
            description: >-
              Pod {{ $labels.pod }} has been receiving HTTP 429s from the
              API server for 15m. Reconciles are queueing behind the
              throttle; if this is chronic, raise the controller's
              client-side QPS/burst or the cluster.size in
              flux/flux-system/flux-instance.yaml.
          expr: |-
            sum by (pod) (
              rate(rest_client_requests_total{namespace="flux-system", code="429"}[5m])
            ) > 0
          for: 15m
          labels:
            severity: warning
