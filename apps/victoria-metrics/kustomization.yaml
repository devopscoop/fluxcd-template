# https://fluxcd.io/flux/guides/helmreleases/#refer-to-values-in-configmaps-generated-with-kustomize
# https://fluxcd.io/flux/guides/helmreleases/#refer-to-values-in-secret-generated-with-kustomize-and-sops

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Setting namespace here will ensure that all objects managed by this Kustomization will explicitly be deployed to this namespace. You don't need to put specify `namespace:` anywhere else if you do this.
namespace: victoria-metrics

resources:
  - namespace.yaml
  - helmrepo.yaml
  - release.yaml
  - grafana-httproute.yaml
  - vmui-httproute.yaml
  - alertmanager-httproute.yaml
  - envoy-proxy-global-dashboard.yaml
  - envoy-clusters-dashboard.yaml
  - envoy-gateway-global-dashboard.yaml
  # Vendored dashboards for the always-deployed core apps; each file's
  # header names its upstream source and pin. Dashboards for
  # platform-conditional and opt-in apps follow below in marker blocks,
  # mirroring the gating of their scrape/rule CRs in
  # apps/victoria-metrics-custom-resources (the rationale lives in that
  # kustomization's header).
  - flux-performance-dashboard.yaml
  - flux-control-plane-dashboard.yaml
  - cert-manager-dashboard.yaml
  - external-dns-dashboard.yaml
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#   - karpenter-capacity-dashboard.yaml
#   - karpenter-performance-dashboard.yaml
#   - aws-load-balancer-controller-dashboard.yaml
# <<< eks
# >>> metallb: deploy.sh uncomments this block when k8s_platform is not eks
#   - metallb-dashboard.yaml
# <<< metallb
# >>> longhorn: ./toggle_blocks.sh --enable longhorn when enabling apps/longhorn
#   - longhorn-dashboard.yaml
# <<< longhorn
# >>> rook-ceph: ./toggle_blocks.sh --enable rook-ceph when enabling apps/rook-ceph
#   - ceph-cluster-dashboard.yaml
#   - ceph-pools-dashboard.yaml
# <<< rook-ceph
# >>> coraza: ./toggle_blocks.sh --enable coraza when enabling apps/coraza
#   - coraza-dashboard.yaml
# <<< coraza
configMapGenerator:
  - name: victoria-metrics-values
    files:
      - values.yaml=values.yaml
secretGenerator:
  - name: victoria-metrics-secrets
    files:
      - values.yaml=helm_secrets.yaml
configurations:
  - kustomizeconfig.yaml
