# GoAlert's PostgreSQL, run by the CloudNativePG operator (apps/cnpg — the
# flux Kustomization for this app dependsOn it). GoAlert applies its own
# schema migrations at startup, so CNPG only has to provide an empty database
# and credentials.
#
# Three documents: the Cluster, the ObjectStore its barman backups land in,
# and the daily ScheduledBackup. One file so the database's whole story reads
# top to bottom — apps/templates/cnpg-database holds the reusable copy for
# creating new databases.
#
# CNPG auto-creates a `goalert-db-app` Secret (`<cluster>-app`) for the owner
# of the database below; its `uri` key is a ready-made libpq connection string
# pointing at the read-write Service (goalert-db-rw). deployment.yaml feeds
# that key straight into GOALERT_DB_URL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: goalert-db
spec:
  # One primary + two streaming replicas, CNPG's standard HA shape. Three
  # matters, not just two: CNPG always creates a PDB requiring the primary to
  # stay available, so a single-instance cluster blocks node drains outright
  # ("Cannot evict pod as it would violate the pod's disruption budget",
  # retrying forever). With replicas the operator instead switches the
  # primary over ahead of the drain, and at 3+ instances the replica PDB
  # (minAvailable: instances - 2) releases one replica at a time — a standby
  # exists to fail over to even mid-drain, which 2 instances can't guarantee.
  # Replication is async (CNPG default); GoAlert always connects through the
  # -rw Service, so switchovers are invisible to it. The dataset is tiny
  # (schedules, escalation policies, alert metadata), so the cost of HA is
  # just two more pods and PVCs.
  instances: 3
  # Pinned to PostgreSQL 17, deliberately: GoAlert v0.34 is tested against
  # PostgreSQL 13-17, while this repo's CNPG operator (1.28) defaults new
  # clusters to PostgreSQL 18, which GoAlert's test suite doesn't cover yet.
  # Bump the major here deliberately, alongside GoAlert upgrades.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-trixie
  bootstrap:
    initdb:
      database: goalert
      owner: goalert
      # No postInitSQL for the pgcrypto extension GoAlert needs: its
      # migrations run CREATE EXTENSION IF NOT EXISTS pgcrypto themselves,
      # and pgcrypto is a trusted extension since PostgreSQL 13, so the
      # (non-superuser) database owner above is allowed to create it.
    # Restoring from the barman object store
    # (runbooks/restore-cnpg-database.md): comment out initdb above,
    # uncomment recovery below, and see the serverName and
    # externalClusters toggles further down this file.
#     recovery:
#       source: goalert-db
#       ## Point-in-time only; omit recoveryTarget to recover to the
#       ## end of the archived WAL:
#       # recoveryTarget:
#       #   targetTime: "2026-09-02 16:20:00+00"
  storage:
    size: 1Gi
  # On EKS these volumes opt out of the DLM snapshot policy: barman owns this
  # database's backups (the ObjectStore below), so daily EBS snapshots would
  # be redundant spend — and a crash-consistent snapshot of one replica's
  # volume is a restore footgun next to barman's point-in-time recovery.
  # The DLM policy in aws-eks-template (cluster/dlm.tf) only snapshots
  # volumes tagged Backup=dlm (applied by the default gp3 class);
  # gp3-dangerous (apps/eks-storage-classes) tags them Backup=none instead.
  # Tags apply at provision time only, so volumes that predate the Backup
  # tag are already out of the policy — hand-tag them Backup=none anyway so
  # they read as deliberate, not unaccounted for.
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#     storageClass: gp3-dangerous
# <<< eks
  # Continuous WAL archiving + base backups through the Barman Cloud Plugin
  # (apps/cnpg-barman-plugin). The bucket, retention, and sidecar tuning live
  # in the ObjectStore below; the daily cadence in the ScheduledBackup at the
  # bottom of this file.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: goalert-db
        # Restore only: the restored cluster's new archive path —
        # CNPG refuses to archive into a WAL history it didn't
        # create. Bump the suffix on every restore (r2 -> r3 -> ...).
#         serverName: goalert-db-r2
  # Memory req=limit, no CPU limit. Doubled from the initial 256Mi guess
  # after the postgres container was OOMKilled 9 times in its first half hour
  # (KubePodCrashLooping); resize with krr after some real usage.
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      memory: 512Mi
  # IRSA: the instance pods run as the goalert-db ServiceAccount (CNPG names
  # it after the Cluster), and this annotation lets their barman-cloud
  # sidecars reach the backup bucket. Role and bucket come from
  # aws-eks-template cluster/cnpg-backups.tf (see the cnpg_db_role_arns
  # output).
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#   serviceAccountTemplate:
#     metadata:
#       annotations:
#         eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/goalert-db"
# <<< eks
  # Restore only — where the backup being restored FROM lives: the
  # OLD serverName (the Cluster name originally, or its -rN if
  # restoring a cluster that was itself restored before).
#   externalClusters:
#     - name: goalert-db ## must match bootstrap.recovery.source
#       plugin:
#         name: barman-cloud.cloudnative-pg.io
#         parameters:
#           barmanObjectName: goalert-db
#           serverName: goalert-db
---
# Where goalert-db's backups live. The Barman Cloud Plugin (apps/
# cnpg-barman-plugin — this app's flux Kustomization dependsOn it) reads this
# ObjectStore and runs a barman-cloud sidecar in each instance pod that ships
# WAL segments continuously and base backups on the ScheduledBackup's cadence
# (next document). Restore runbook: runbooks/restore-cnpg-database.md.
#
# Bucket and IAM role come from aws-eks-template (cluster/cnpg-backups.tf,
# keyed by app under local.cnpg_databases — adding a database there stamps
# out its bucket and role, with optional cross-region replication);
# authentication is IRSA (inheritFromIAMRole) via the serviceAccountTemplate
# annotation on the Cluster above, so no credentials Secret is needed. On a
# non-AWS platform, point destinationPath at an S3-compatible store and
# supply credentials via a Secret referenced from s3Credentials instead.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: goalert-db
spec:
  configuration:
    destinationPath: s3://devopscoop-project1-dev-goalert-db-backups/
    s3Credentials:
      inheritFromIAMRole: true
    wal:
      compression: gzip
    data:
      compression: gzip
  # Recovery-window retention: barman keeps enough base backups and WAL to
  # restore to any point in the last 30 days, and deletes obsolete objects
  # itself after each successful backup — which is why the bucket has no
  # object-expiration lifecycle rule of its own.
  retentionPolicy: "30d"
  instanceSidecarConfiguration:
    # Memory req=limit, no CPU limit, same as the postgres containers in the
    # Cluster above. The sidecar only streams compressed WAL and backup
    # data, and the dataset is tiny.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
---
# Daily base backup of goalert-db, on top of the continuous WAL archiving
# the Barman Cloud Plugin does regardless (the ObjectStore above) — together
# they give point-in-time recovery anywhere inside the retention window, not
# just nightly snapshots.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: goalert-db-daily
spec:
  cluster:
    name: goalert-db
  # CNPG's cron format has a leading seconds field: daily at 04:00 UTC.
  schedule: "0 0 4 * * *"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Take the first backup as soon as this resource lands instead of waiting
  # up to a day — it's what seeds the object store on a fresh bootstrap.
  immediate: true
  # Backup objects get an ownerReference to this ScheduledBackup, so deleting
  # it garbage-collects the Backup resources (the S3 data stays; barman's
  # retention policy owns that).
  backupOwnerReference: self
