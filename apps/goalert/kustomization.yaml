apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Setting namespace here will ensure that all objects managed by this Kustomization will explicitly be deployed to this namespace. You don't need to put specify `namespace:` anywhere else if you do this.
namespace: goalert

resources:
  - namespace.yaml
  - db-cluster.yaml
  # SOPS-encrypted in git; the plaintext staging copy is
  # data-encryption-key.secrets.yaml.decrypted (see README.md).
  - data-encryption-key.secrets.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
