# The PRIVATE Gateway, deliberately — the opposite call from uptime-kuma:
# a status page is only useful if it stays reachable when internal
# infrastructure is down, but GoAlert holds on-call schedules and contact
# methods, so it stays off the internet-facing LB by default. If on-call must
# reach it without VPN (to ack a page from a phone), move it to eg-public —
# GoAlert has its own authentication.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goalert
spec:
  parentRefs:
    - name: eg-private
      namespace: envoy-gateway-system
  hostnames:
    - goalert.devops.coop
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: goalert
          port: 8081
