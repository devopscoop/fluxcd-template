# The public Gateway, deliberately — the same reasoning as uptime-kuma's
# status page: a pager is only useful if on-call can reach it when they're
# paged, which means from a phone, off VPN, possibly while the private
# gateway's infrastructure is the thing that broke. GoAlert has its own
# authentication. This is the exception to gateway-public.yaml's
# "ops tooling stays on eg-private" guidance; if that tradeoff isn't right
# for a cluster, point parentRefs back at eg-private.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goalert
spec:
  parentRefs:
    - name: eg-public
      namespace: envoy-gateway-system
  hostnames:
    - goalert.devops.coop
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: goalert
          port: 8081
