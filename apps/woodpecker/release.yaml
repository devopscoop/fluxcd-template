# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: woodpecker
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: woodpecker-values
    - kind: Secret
      name: woodpecker-secrets
  chartRef:
    kind: OCIRepository
    name: woodpecker-ci-woodpecker
