# https://karpenter.sh/docs/concepts/nodepools/
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        # amd64 to match the existing blue node group's t3a.large instances
        # (aws-eks-template cluster/main.tf); add arm64 here if the workloads
        # are multi-arch.
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Spot with on-demand fallback: with both allowed, Karpenter launches
        # the cheaper spot capacity and falls back to on-demand when spot is
        # unavailable. Spot interruptions are already handled natively via the
        # SQS queue (apps/karpenter/values.yaml settings.interruptionQueue).
        # Spot requires the account-level AWSServiceRoleForEC2Spot
        # service-linked role, which aws-eks-template creates
        # (cluster/karpenter.tf). Workloads that can't tolerate a 2-minute
        # interruption notice should pin themselves to on-demand with a
        # karpenter.sh/capacity-type nodeSelector.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # Current-ish general-purpose/compute/memory instance families, per the
        # getting-started guide. Excludes t-family burstables (CPU-credit
        # starvation is why aws-eks-template enabled node auto repair) and
        # anything older than generation 3.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
        # Nitro only: IPv6 clusters require VPC CNI prefix delegation, which
        # Xen-based instances (c3/m3/r3, c4/m4/r4 — all allowed by the
        # generation filter above) don't support. Such nodes register but
        # never go Ready (ipamd crash-loops), and nothing reaps them: EC2
        # status checks stay ok, and Karpenter's NodeRepair feature gate is
        # off by default.
        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values: ["nitro"]
        # Minimum size "large": the VPC CNI derives a node's max-pods from
        # the instance's ENI and per-ENI IP limits, and the smallest sizes
        # land below what a cluster's baseline DaemonSets already need.
        # Measured on an EKS 1.35 cluster: c7a.medium -> 8 max-pods,
        # c6a.large -> 29, m6a.xlarge -> 110. Six kube-system DaemonSets
        # (aws-node, kube-proxy, ebs-csi-node, efs-csi-node,
        # eks-pod-identity-agent, eks-node-monitoring-agent) ship by default,
        # so a max-pods-8 node has room for just two workload pods — and once
        # it is full, every DaemonSet added later is stuck Pending on "Too
        # many pods" forever, since a DaemonSet pod has no other node it is
        # allowed to run on.
        #
        # The damage is not contained to that node. A DaemonSet that can never
        # reach full readiness fails the wait on its Helm release, which fails
        # that app's Flux Kustomization health check, which blocks every app
        # downstream of it via dependsOn.
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small", "medium"]

      # Replace nodes after 30 days so they pick up fresh AMIs and don't
      # accumulate drift (getting-started default).
      expireAfter: 720h

  # Cap on total resources this NodePool may provision — a runaway-workload
  # blast-radius limit, not a target. Getting-started default; tune per
  # cluster.
  limits:
    cpu: 1000

  disruption:
    # Consolidate whenever nodes are empty or underutilized (the point of
    # running Karpenter), after the node has been disruptable for 1m.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
