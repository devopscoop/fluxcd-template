apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Setting namespace here will ensure that all objects managed by this Kustomization will explicitly be deployed to this namespace. You don't need to put specify `namespace:` anywhere else if you do this.
namespace: cert-manager

resources:
  - cloudflare-apikey-secret.secrets.yaml
  - clusterissuer.yaml

  # Only for the dns01.acmeDNS solver (apps/acme-dns). Fill in
  # acme-dns-account.secrets.yaml.decrypted, run ./encrypt_secrets.sh, then
  # uncomment this -- in the SAME commit as enabling the solver, or this
  # Kustomization can wedge (apps/acme-dns/README.md, "The two-commit
  # deadlock").
  # - acme-dns-account.secrets.yaml
