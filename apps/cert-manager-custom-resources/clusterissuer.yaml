# https://cert-manager.io/docs/configuration/acme/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: hostmaster@devops.coop

    # Default profile is "classic", but cert-manager docs uses tlsserver, which reflects "the latest recommendations from the CA/Browser Forum Baseline Requirements, as well as general trends within the WebPKI community."
    # https://cert-manager.io/docs/configuration/acme/#acme-certificate-profiles
    # https://letsencrypt.org/docs/profiles/#tlsserver
    profile: tlsserver

    # Let's Encrypt's prod server
    # https://letsencrypt.org/getting-started/#selecting-and-operating-an-acme-client-yourself
    server: https://acme-v02.api.letsencrypt.org/directory

    # This is supposed to have a default of "tls.key", but apparently that doesn't work, because I get this error when I don't specify it:
    #
    # $ k get ks -n flux-system cert-manager-custom-resources
    # NAME                            AGE   READY   STATUS
    # cert-manager-custom-resources   64m   False   ClusterIssuer/cert-manager/letsencrypt dry-run failed (Invalid): ClusterIssuer.cert-manager.io "letsencrypt" is invalid: spec.acme.privateKeySecretRef: Required value...
    #
    # https://github.com/cert-manager/cert-manager/issues/7845
    privateKeySecretRef:
      name: tls.key

    # Pick ONE solver below and uncomment it. It must be a DNS-01 solver: both
    # Gateways in apps/eg-custom-resources ask this issuer for a wildcard
    # (*.project1-dev.devops.coop) so that adding a service needs no new
    # listener, and ACME will not validate a wildcard over HTTP-01 — the
    # http01 block is kept only for clusters that go back to per-hostname
    # listeners.
    solvers:

      # Envoy Gateway — per-hostname certificates ONLY; cannot issue the
      # wildcards the Gateways currently request.
      # https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/#using-the-acme-issuer-with-lets-encrypt-and-http-01
      # - http01:
      #     gatewayHTTPRoute:
      #       parentRefs:
      #       - kind: Gateway
      #         name: eg-public
      #         namespace: envoy-gateway-system

      # Cloudflare
      # - dns01:
      #     cloudflare:
      #       email: hostmaster@devops.coop
      #       apiTokenSecretRef:
      #         name: cloudflare-apikey-secret
      #         key: apikey

      # AWS Route53
      #
      # cert-manager authenticates via IRSA: set the role ARN on the
      # cert-manager ServiceAccount (see apps/cert-manager/values.yaml ->
      # serviceAccount.annotations).
      #
      # If you have CNAMEs in a zone that this cluster doesn't have write
      # access to (ex. api.devops.coop CNAME api.prod.devops.coop), you can use
      # `cnameStrategy: Follow`. Create ACME challenge records for each CNAME
      # that you use (ex. _acme-challenge.api.devops.coop CNAME
      # _acme-challenge.api.prod.devops.coop).
      #
      # - dns01:
      #     cnameStrategy: Follow
      #     route53:
      #       region: us-east-2
