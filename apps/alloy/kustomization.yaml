# https://fluxcd.io/flux/guides/helmreleases/#refer-to-values-in-configmaps-generated-with-kustomize
# https://fluxcd.io/flux/guides/helmreleases/#refer-to-values-in-secret-generated-with-kustomize-and-sops

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Setting namespace here will ensure that all objects managed by this Kustomization will explicitly be deployed to this namespace. You don't need to put specify `namespace:` anywhere else if you do this.
namespace: alloy

resources:
  - namespace.yaml
  - helmrepo.yaml
  - release.yaml
  # Self-monitoring for the KPS alternative stack (see the ServiceMonitor
  # note in values.yaml; the flux Kustomization dependsOn
  # kube-prometheus-stack for the PrometheusRule CRD). The mixin dashboards
  # download via grafana.dashboards in apps/kube-prometheus-stack/values.yaml.
  - prometheusrule.yaml
configMapGenerator:
  - name: alloy-values
    files:
      - values.yaml=values.yaml
secretGenerator:
  - name: alloy-secrets
    files:
      - values.yaml=helm_secrets.yaml
configurations:
  - kustomizeconfig.yaml
