# dyff between <(yq . <(helm show values grafana/alloy --version 1.8.2)) <(yq eval '. * load("values.yaml")' <(helm show values grafana/alloy --version 1.8.2))
# vim -O <(helm show values grafana/alloy --version 1.8.2) values.yaml

# Grafana Alloy is the official successor to Promtail. It runs as a DaemonSet
# (the chart's default controller type), tails each node's pod log files, and
# pushes them to Loki (apps/loki).
alloy:
  mounts:
    # Mount the node's /var/log so Alloy can read /var/log/pods/.../*.log.
    varlog: true
  configMap:
    content: |-
      // Discover this node's pods (Alloy's ServiceAccount gets the
      // necessary read RBAC from the chart's rbac.create=true default).
      discovery.kubernetes "pods" {
        role = "pod"

        // Watch only pods on the same node — the chart injects K8S_NODE_NAME
        // from spec.nodeName. Without this, every DaemonSet pod watches every
        // pod in the cluster, so API-server watch load grows quadratically
        // with cluster size. Tailing is node-local anyway (__path__ below).
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      // Turn pod metadata into labels and the on-disk log path.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        // Build /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      // Tail the discovered files.
      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      // Parse pod logs at ingest, so queries can filter on level via the
      // index instead of re-parsing every line at query time.
      loki.process "pod_logs" {
        // Unwrap the CRI envelope on every line: takes the real timestamp
        // from it, reassembles long lines the runtime split into P…P F
        // chunks (containerd splits at 16k), and stores the container's own
        // output, so a bare `| json` works at query time. This stage must
        // see EVERY entry of a stream, never a content-filtered subset: it
        // buffers P chunks (keyed by stream) until the F chunk arrives, so
        // an entry that bypasses it pairs the buffer with the wrong line.
        // Non-CRI-formatted lines pass through untouched.
        stage.cri {}

        // Only parse lines that are actually JSON — bare after the CRI
        // unwrap — so plain-text loggers generate no parse noise.
        stage.match {
          selector = "{namespace=~\".+\"} |~ \"^\\\\{\""

          stage.json {
            expressions = { level = "level" }
          }

          // Normalize case so each level has exactly one label value — some
          // apps log level="INFO" (e.g. the kiwigrid/k8s-sidecar containers
          // in kube-prometheus-stack and loki). Lines without a level field
          // still get no label: when the template renders "" (missing or
          // empty level — the if-guard keeps ToLower off a missing value),
          // stage.template deletes the key from the extracted map instead of
          // storing "", so stage.labels has nothing to promote.
          stage.template {
            source   = "level"
            template = "{{ if .Value }}{{ ToLower .Value }}{{ end }}"
          }

          // level is the field ops queries filter on, and it is bounded
          // (trace/debug/info/warn(ing)/error/fatal), so it is safe as an
          // index label: Loki skips chunks instead of scanning them, and
          // Grafana's Logs panel gets native level colouring. Lines without a
          // level field simply don't get the label — no empty-valued labels.
          stage.labels {
            values = { level = "level" }
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // Ship everything to Loki's gateway.
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
        }
      }
