# dyff between <(yq . <(helm show values grafana/alloy --version 1.8.2)) <(yq eval '. * load("values.yaml")' <(helm show values grafana/alloy --version 1.8.2))
# vim -O <(helm show values grafana/alloy --version 1.8.2) values.yaml

# Grafana Alloy is the official successor to Promtail. It runs as a DaemonSet
# (the chart's default controller type), tails each node's pod log files, and
# pushes them to Loki (apps/loki).
alloy:
  mounts:
    # Mount the node's /var/log so Alloy can read /var/log/pods/.../*.log.
    varlog: true
  # Set the node name the discovery selector below filters on, rather than
  # relying on whichever variable a given chart version happens to inject.
  # sys.env() returns "" for an undefined variable instead of failing, so a
  # missing value would silently produce "spec.nodeName=", match zero pods,
  # and collect no logs at all while the DaemonSet still reports Ready.
  extraEnv:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  configMap:
    content: |-
      // Discover this node's pods (Alloy's ServiceAccount gets the
      // necessary read RBAC from the chart's rbac.create=true default).
      discovery.kubernetes "pods" {
        role = "pod"

        // Watch only pods on the same node — K8S_NODE_NAME comes from
        // spec.nodeName via alloy.extraEnv above. Without this, every DaemonSet
        // pod watches every pod in the cluster, so API-server watch load grows
        // quadratically with cluster size. Tailing is node-local anyway
        // (__path__ below).
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      // Turn pod metadata into labels and the on-disk log path.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        // Build /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      // Tail the discovered files.
      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      // Parse JSON app logs at ingest, so queries can filter on level via the
      // index instead of re-parsing every line at query time.
      loki.process "pod_logs" {
        // Only touch lines that are actually JSON (CRI envelope followed by
        // "{") — plain-text loggers pass through unchanged, keeping their
        // stored format stable and generating no parse noise.
        stage.match {
          selector = "{namespace=~\".+\"} |~ \"^[^ ]+ std(out|err) [FP] \\\\{\""

          // Unwrap the CRI envelope: takes the real timestamp from it and
          // replaces the stored line with the container's own output, so a
          // bare `| json` works at query time.
          stage.cri {}

          stage.json {
            expressions = { level = "level" }
          }

          // level is the field ops queries filter on, and it is bounded
          // (trace/debug/info/warn(ing)/error/fatal), so it is safe as an
          // index label: Loki skips chunks instead of scanning them, and
          // Grafana's Logs panel gets native level colouring. Lines without a
          // level field simply don't get the label — no empty-valued labels.
          stage.labels {
            values = { level = "level" }
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // Ship everything to Loki's gateway.
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
        }
      }
