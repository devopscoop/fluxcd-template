# Default StorageClass: gp3 EBS volumes via the EBS CSI driver (aws-ebs-csi-driver
# add-on, installed by aws-eks-template). EKS-specific; deploy.sh only enables the
# eks-storage-classes app for the "eks" platform.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    # reclaimPolicy is immutable; let Flux delete+recreate when it changes.
    kustomize.toolkit.fluxcd.io/force: "enabled"
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
  # Opts every volume from this class into the daily DLM EBS snapshots — the
  # policy in aws-eks-template (cluster/dlm.tf) targets exactly this tag.
  # The key answers "how is this volume backed up": gp3-dangerous applies
  # Backup=none instead, and a volume with no Backup tag at all predates
  # this tagSpecification and needs retro-tagging (tags apply at provision
  # time only; the dlm.tf comment carries the audit query).
  tagSpecification_1: "Backup=dlm"
