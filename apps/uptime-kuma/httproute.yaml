# The public Gateway, deliberately: a status page is only useful if it is
# reachable when internal infrastructure is down and from outside the network.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma
spec:
  parentRefs:
    - name: eg-public
      namespace: envoy-gateway-system
      # Bind to the HTTPS listener only. Without sectionName this route also
      # attaches to the port-80 listener and beats the catch-all redirect in
      # httproute-redirect-public.yaml on hostname specificity, serving the
      # status page in cleartext.
      sectionName: https
  hostnames:
    - status.project1-dev.devops.coop
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: uptime-kuma
          port: 3001
