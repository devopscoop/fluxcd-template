# dyff between <(yq . <(helm show values uptime-kuma/uptime-kuma --version 4.2.0)) <(yq eval '. * load("values.yaml")' <(helm show values uptime-kuma/uptime-kuma --version 4.2.0))
# vim -O <(helm show values uptime-kuma/uptime-kuma --version 4.2.0) values.yaml
volume:
  size: 1Gi

# Ahead of the chart's appVersion (2.5.0, which runs Node 22.22.3): 2.5.7+
# runs Node 22.23.4, which fixes the Brotli decoder out-of-bounds write
# (CVE-2026-111497, ENG-3132) — HTTP monitors decompress Brotli responses
# from whatever they monitor. 2.5.8 also fixes GHSA-v2p3-6f5h-6hhf. Drop this
# once the chart's appVersion reaches it.
image:
  tag: "2.5.8"
podEnv:
  # Pre-answer the database step of the first-run wizard so a from-scratch
  # deploy comes up without manual choices (same backend the instance has
  # always used). Only the admin account creation remains on first run.
  - name: UPTIME_KUMA_DB_TYPE
    value: "embedded-mariadb"

# Sized from krr (2026-08-22, 14d dev usage); memory req=limit, no CPU limit.
resources:
  requests:
    cpu: 25m
    memory: 384Mi
  limits:
    memory: 384Mi

# Singleton on an RWO PVC (embedded mariadb): Recreate terminates the old pod
# before starting the new one, so a deploy can't deadlock on the volume or
# briefly run two instances against the same database. (Chart default is
# RollingUpdate.)
# On a cluster whose Deployment predates this setting, the upgrade fails with
# "rollingUpdate: Forbidden": the server-defaulted rollingUpdate fields have
# no field manager, so server-side apply can't remove them
# (kubernetes/kubernetes#118261), and removing them alone is a no-op because
# defaulting re-adds them. One-time fix — replace the whole strategy in a
# single write, then nudge this file so the stalled HelmRelease retries:
#   kubectl patch deployment uptime-kuma -n uptime-kuma --type=json \
#     -p='[{"op":"replace","path":"/spec/strategy","value":{"type":"Recreate"}}]'
strategy:
  type: Recreate
