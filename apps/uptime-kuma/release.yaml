# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: uptime-kuma-values
    - kind: Secret
      name: uptime-kuma-secrets
  chart:
    spec:
      chart: uptime-kuma
      version: 4.2.0
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
