alertmanager:
  route:
    main:
      enabled: true
      hostnames:
        - alertmanager.project1-dev.devops.coop
      parentRefs:
        - name: eg-private
          namespace: envoy-gateway-system
          # HTTPS only; plain HTTP on :80 is 301'd by httproute-redirect-private.yaml.
          sectionName: https
  alertmanagerSpec:
    # Public URL Alertmanager uses when generating links (e.g. the title link in
    # Slack notifications); without it they point at the internal service URL
    # http://kube-prometheus-stack-alertmanager.kube-prometheus-stack:9093.
    externalUrl: https://alertmanager.project1-dev.devops.coop

    # Sized from krr (2026-08-22, 14d dev usage); memory req=limit, no CPU limit.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi

    # Persist /alertmanager so silences and the notification log survive pod
    # restarts (the chart defaults to an emptyDir). The data is only a few KB,
    # but 1Gi is the practical floor: EBS won't provision smaller, and most
    # other provisioners round up to it anyway. No storageClassName, so the
    # cluster's default StorageClass is used.
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    # Alertmanager is a singleton: if a spot reclaim takes it down, nothing
    # pages -- including about the reclaim itself. Pin it to on-demand
    # capacity, per the NodePool contract in
    # apps/karpenter-custom-resources/nodepool.yaml.
# >>> karpenter: deploy.sh uncomments this block when k8s_platform=eks
#     nodeSelector:
#       karpenter.sh/capacity-type: on-demand
# <<< karpenter

# Send every alert to Slack. The channel below is not secret, but the webhook
# URL is, so it lives in helm_secrets.yaml (alertmanager.config.global.slack_api_url),
# which Flux merges over this file -- see valuesFrom in release.yaml.
# >>> slack: deploy.sh uncomments this block when slack_alerts=true (variables.sh)
#   config:
#     route:
#       receiver: slack
#     receivers:
#       # The chart's default route sends Watchdog alerts to the 'null' receiver,
#       # and setting receivers here replaces the chart's whole list, so keep it.
#       - name: 'null'
#       - name: slack
#         slack_configs:
#           - channel: '#alerts' # TODO: replace with your Slack channel
#             send_resolved: true
#             # Alertmanager's default Slack message is only a terse title like
#             # "[FIRING:2] (ns/pod critical)". Keep that as the headline, but
#             # render each alert's summary, description, and runbook in the body.
#             title: '{{ template "slack.default.title" . }}'
#             text: |-
#               {{ range .Alerts }}*{{ .Labels.alertname }}* `{{ .Labels.severity }}`{{ if .Annotations.summary }} — {{ .Annotations.summary }}{{ end }}
#               {{ .Annotations.description }}{{ if .Annotations.runbook_url }} <{{ .Annotations.runbook_url }}|:book: runbook>{{ end }}
#               {{ end }}
# <<< slack
prometheus:
  route:
    main:
      enabled: true
      hostnames:
        - prometheus.project1-dev.devops.coop
      parentRefs:
        - name: eg-private
          namespace: envoy-gateway-system
          # HTTPS only; plain HTTP on :80 is 301'd by httproute-redirect-private.yaml.
          sectionName: https
  prometheusSpec:
    # Public URL for the "Source" links on alerts (generatorURL); without it
    # they point at the internal service URL on port 9090.
    externalUrl: https://prometheus.project1-dev.devops.coop

    # Sized from krr (2026-08-22, 14d dev usage): peak ~1.1Gi. Extra headroom
    # because TSDB memory grows with series cardinality and query load; no CPU
    # limit.
    resources:
      requests:
        cpu: 75m
        memory: 1536Mi
      limits:
        memory: 1536Mi
    # Persist the TSDB so metrics history survives pod rescheduling and node
    # replacement (the chart defaults to an emptyDir, which dies with its
    # node). No storageClassName, so the cluster's default StorageClass is
    # used. Note EBS volumes are zonal: after a node loss the pod stays
    # Pending until a node exists in the volume's AZ again.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    # Aim for 30 days of history (the chart defaults to 10d) — but the volume
    # ships at the template's minimal 1Gi, which holds far less; volumes can
    # grow but never shrink, so size up per deployment. Sizing rule of thumb:
    # disk = ingested samples/s x retention seconds x ~2 bytes; a small
    # cluster ingests a few thousand samples/s, so 30d lands in the 15-35GB
    # range. retentionSize caps the TSDB below the volume size so Prometheus
    # prunes the oldest blocks instead of filling the disk and crash-looping;
    # grow storage and retentionSize together.
    retention: 30d
    retentionSize: 900MB
    # Prometheus is a singleton: pin it to on-demand capacity, per the
    # NodePool contract in apps/karpenter-custom-resources/nodepool.yaml, so a
    # spot reclaim can't interrupt scraping and alert evaluation.
# >>> karpenter: deploy.sh uncomments this block when k8s_platform=eks
#     nodeSelector:
#       karpenter.sh/capacity-type: on-demand
# <<< karpenter

grafana:
  # Grafana's dex OAuth client secret arrives as an env var from
  # grafana-oidc-client.secrets.yaml — same mechanism and rationale as in
  # apps/victoria-metrics/values.yaml.
# >>> dex: NOT auto-enabled by deploy.sh — run ./toggle_blocks.sh --enable dex after deploying apps/dex
#   envFromSecret: grafana-oidc-client-secret
# <<< dex
  grafana.ini:
    server:
      # Public URL Grafana uses when generating absolute links (e.g. Explore
      # short links); without it they point at the default localhost:3000.
      root_url: https://grafana.project1-dev.devops.coop/
    # SSO through the optional dex app (apps/dex) — identical block and
    # rationale as in apps/victoria-metrics/values.yaml (the two stacks are
    # either/or, so keep them interchangeable): login form stays as
    # break-glass, client_secret pairs with apps/dex/helm_secrets.yaml via
    # grafana-oidc-client.secrets.yaml, roles map from the groups claim with
    # a Viewer fallback. Replace the placeholder group addresses.
# >>> dex: NOT auto-enabled by deploy.sh — run ./toggle_blocks.sh --enable dex after deploying apps/dex
#     auth.generic_oauth:
#       enabled: true
#       name: Dex
#       client_id: grafana
#       scopes: openid profile email groups
#       auth_url: https://dex.project1-dev.devops.coop/auth
#       token_url: https://dex.project1-dev.devops.coop/token
#       api_url: https://dex.project1-dev.devops.coop/userinfo
#       allow_sign_up: true
#       role_attribute_path: contains(groups[*], 'grafana-admins@example.com') && 'Admin' || contains(groups[*], 'grafana-editors@example.com') && 'Editor' || 'Viewer'
# <<< dex

  # Provision the Loki store (apps/loki) as a datasource on this Grafana so logs
  # are queryable in Explore. Loki runs single-tenant, so no auth header needed.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.loki.svc.cluster.local
      jsonData:
        maxLines: 1000
  # Dashboards Grafana's download-dashboards init container pulls at every
  # pod start — same pattern and rationale as the grafana.dashboards list in
  # apps/victoria-metrics/values.yaml (upstream updates arrive on the next
  # restart instead of being vendored and re-synced by hand; needs egress to
  # raw.githubusercontent.com). The Alloy mixin dashboards ride here rather
  # than in apps/alloy because only the Grafana chart can download them —
  # and alloy only ever deploys alongside this stack (it's the KPS
  # alternative's log collector), so no extra gating is needed. Their
  # datasource variables carry no saved selection and bind to this stack's
  # default Prometheus (and Loki) datasources on load. The URL tag matches
  # apps/alloy's chart appVersion — bump it when bumping that app.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: downloaded
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/downloaded
  dashboards:
    downloaded:
      # "Alloy / Controller" — component health and evaluation activity for
      # the log collector, fed by the chart ServiceMonitor
      # apps/alloy/values.yaml enables, alerted on by its prometheusrule.yaml.
      alloy-controller:
        url: https://raw.githubusercontent.com/grafana/alloy/v1.16.1/operations/alloy-mixin/rendered/dashboards/alloy-controller.json
      # "Alloy / Loki Components" — loki.source/loki.process/loki.write
      # throughput and error rates: the is-the-log-pipeline-actually-
      # delivering view. Its loki_datasource variable resolves to the Loki
      # datasource provisioned above.
      alloy-loki:
        url: https://raw.githubusercontent.com/grafana/alloy/v1.16.1/operations/alloy-mixin/rendered/dashboards/alloy-loki.json
      # "Alloy / Resources" — CPU/memory/GC for the collector DaemonSet.
      alloy-resources:
        url: https://raw.githubusercontent.com/grafana/alloy/v1.16.1/operations/alloy-mixin/rendered/dashboards/alloy-resources.json
  # Sized from krr (2026-08-22, 14d dev usage); memory req=limit, no CPU limit.
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
    limits:
      memory: 192Mi
  # Dashboard/datasource provisioning sidecars share this block.
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
    # Load grafana_dashboard=1 ConfigMaps from every namespace instead of
    # only this one — see the note on the same setting in
    # apps/victoria-metrics/values.yaml; the two stacks are either/or, so
    # keep them interchangeable.
    dashboards:
      searchNamespace: ALL

# Sized from krr (2026-08-22, 14d dev usage); memory req=limit, no CPU limit.
prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi
  # Config-reloader sidecars on the Prometheus and Alertmanager pods.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

# On EKS the scheduler, controller-manager, and etcd run inside the AWS-managed
# control plane and expose no metrics endpoints, and kube-proxy binds its
# metrics to 127.0.0.1, so none of these targets can ever be scraped. Disable
# them so their ServiceMonitors and permanently-firing absence alerts
# (KubeSchedulerDown, KubeControllerManagerDown, KubeProxyDown, ...) go away.
# On k0s/talos these components run on your own nodes, so leave them enabled.
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
# kubeScheduler:
#   enabled: false
# kubeControllerManager:
#   enabled: false
# kubeEtcd:
#   enabled: false
# kubeProxy:
#   enabled: false
# <<< eks
