prometheus:
  route:
    main:
      enabled: true
      hostnames:
        - prometheus.devops.coop
      parentRefs:
        - name: eg-private
          namespace: envoy-gateway-system
  prometheusSpec:
    # Public URL for the "Source" links on alerts (generatorURL); without it
    # they point at the internal service URL on port 9090.
    externalUrl: https://prometheus.devops.coop
    # Prometheus is a singleton with no persistent storage yet (see the README
    # TODO), so losing its node wipes all metrics history. Pin it to on-demand
    # capacity so spot reclaims can't do that; node drains from Karpenter
    # consolidation still can, until persistence is enabled.
