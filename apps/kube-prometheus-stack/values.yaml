alertmanager:
  route:
    main:
      enabled: true
      hostnames:
        - alertmanager.project1-dev.devops.coop
      parentRefs:
        - name: eg-private
          namespace: envoy-gateway-system
          # HTTPS only; plain HTTP on :80 is 301'd by httproute-redirect-private.yaml.
          sectionName: https
  alertmanagerSpec:
    # Public URL Alertmanager uses when generating links (e.g. the title link in
    # Slack notifications); without it they point at the internal service URL
    # http://kube-prometheus-stack-alertmanager.kube-prometheus-stack:9093.
    externalUrl: https://alertmanager.project1-dev.devops.coop

    # Sized from krr (2026-08-22, 14d dev usage); memory req=limit, no CPU limit.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi

    # Persist /alertmanager so silences and the notification log survive pod
    # restarts (the chart defaults to an emptyDir). The data is only a few KB,
    # but 1Gi is the practical floor: EBS won't provision smaller, and most
    # other provisioners round up to it anyway. No storageClassName, so the
    # cluster's default StorageClass is used.
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    # Alertmanager is a singleton: if a spot reclaim takes it down, nothing
    # pages -- including about the reclaim itself. Pin it to on-demand
    # capacity, per the NodePool contract in
    # apps/karpenter-custom-resources/nodepool.yaml.
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#     nodeSelector:
#       karpenter.sh/capacity-type: on-demand
# <<< eks

