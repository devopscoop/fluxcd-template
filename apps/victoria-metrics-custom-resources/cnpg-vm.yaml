# Scrape every CloudNativePG database instance — the postgres exporter the
# instance manager serves on :9187 (the container port named "metrics"):
# connections, transactions, replication lag, WAL activity, backup freshness
# and the rest of the cnpg_* collectors that feed the CloudNativePG dashboard
# (chart-provisioned; see monitoring.grafanaDashboard in
# apps/cnpg/values.yaml). The operator stamps
# cnpg.io/podRole=instance on every instance pod of every Cluster, so one
# fleet-wide scrape covers goalert's database and any future one scaffolded
# from apps/templates/cnpg-database with no per-app config.
#
# Not CNPG's own monitoring hooks: a Cluster's
# .spec.monitoring.enablePodMonitor (and the operator chart's
# monitoring.podMonitorEnabled) create monitoring.coreos.com PodMonitors, and
# those CRDs are not installed here — see the CRD-ownership note in
# apps/victoria-metrics/README.md. Why this lives here rather than in
# apps/cnpg: same CRD-ordering reason as envoy-vm.yaml and kustomization.yaml.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cnpg-instances
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      relabelConfigs:
        # One fleet-wide scrape means one job label for every database, so
        # nothing separates goalert-db's series from a future app's. Lift
        # the operator's owning-cluster pod label onto every series as
        # "cnpg_cluster" so the VMRule below can group per Cluster — the
        # exporter itself stamps a "cluster" label on only two metrics
        # (cnpg_collector_up, cnpg_collector_postgres_version). Same
        # pattern as the gateway label in envoy-vm.yaml.
        - sourceLabels:
            - __meta_kubernetes_pod_label_cnpg_io_cluster
          targetLabel: cnpg_cluster
---
# Scrape the CloudNativePG operator itself — controller-runtime metrics
# (reconcile rates/durations, webhook requests, workqueue depth) on :8080,
# the container port named "metrics". The CloudNativePG dashboard's operator
# panels and its operatorNamespace variable
# (controller_runtime_webhook_requests_total) come from here; the per-database
# series come from the instance scrape above. Selector and port mirror the
# PodMonitor the chart's monitoring.podMonitorEnabled would create, which is
# unusable here for the CRD-ownership reason in the instance scrape above.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cnpg-operator
spec:
  namespaceSelector:
    matchNames:
      # The namespace apps/cnpg deploys the operator into (its
      # namespace.yaml), not the release name; "cnpg" here matched nothing
      # and the scrape pool sat empty (ScrapePoolHasNoTargets).
      - cnpg-system
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
      app.kubernetes.io/instance: cnpg
  podMetricsEndpoints:
    - port: metrics
---
# Alerting rules for every CloudNativePG database, evaluated by this
# stack's vmalert over the series collected by the two scrapes above (all
# instances, fleet-wide, plus the operator). Remember the
# routing model (apps/victoria-metrics/README.md → "Alert routing"): every
# alert pages GoAlert and Slack; severity is a label, not a filter.
#
# The upstream rules are adapted from the CNPG "cluster" chart
# (https://github.com/cloudnative-pg/charts/tree/cluster-v0.8.1/charts/cluster/prometheus_rules,
# re-check when bumping apps/cnpg), with deliberate deviations:
# - Fleet-wide instead of per-cluster: upstream templates one PrometheusRule
#   per database, keyed on its scrape job and a pod-name regex. Here one
#   scrape covers the fleet, so rules group by (namespace, cnpg_cluster) —
#   the label the instance scrape lifts from the cnpg.io/cluster pod
#   label — and one VMRule covers goalert-db plus every future database
#   scaffolded from apps/templates/cnpg-database with no per-app config.
# - Dropped the logical-replication rules (6 of upstream's 19): they read
#   cnpg_pg_stat_subscription_*, which needs a subscription instrumentation
#   toggle nothing in this repo enables — permanently-absent exprs.
# - Dropped the zone-spread rule: on EKS the instances are deliberately
#   pinned to a managed node group (the karpenter marker block in
#   db-cluster.yaml), so it would fire forever on a single-AZ group.
# - Dropped the disk-space rules: the bundled kubernetes-storage group
#   (KubePersistentVolumeFillingUp) already covers every PVC including the
#   -wal volumes. Upstream's WAL arm is also broken as shipped — its pod
#   regex ends in "$" before appending "-wal", which RE2 can never match.
# - Dropped instance-metrics-absent and cluster-offline: the bundled
#   TargetDown covers a dead exporter (same reasoning as the deliberately
#   missing controller-down rule in flux-vm.yaml); the fleet-wide
#   CNPGFleetMetricsAbsent below keeps the one absence that is
#   unconditionally wrong on this template (goalert-db is a core app, so
#   zero cnpg series cluster-wide means collection itself broke).
# - Rewrote the two physical-replication-lag rules onto
#   cnpg_pg_stat_replication_* (why, in their own comment below):
#   upstream reads cnpg_pg_replication_lag, which is a standby-side
#   write-staleness clock, not a lag gauge, and sawtooths to tens of
#   seconds on any database whose writes arrive in bursts.
# - Added the WAL-archiving and backup rules at the bottom — upstream ships
#   nothing for either, and they encode this repo's own incident history
#   (the 2026-09-05 WAL-burst and the barman sidecar OOM documented in
#   apps/goalert/db-cluster.yaml and apps/templates/cnpg-database).
#   The barman_cloud_cloudnative_pg_io_* metrics come from the Barman
#   Cloud Plugin sidecar via the instance exporter (the in-core
#   cnpg_collector_first_recoverability_point twins are deprecated and stay
#   zero on plugin-based clusters like these).
# - Added CNPGVacuumHeldBackByStandby, which upstream lacks too, over a
#   series only databases running hot_standby_feedback export (why, in its
#   own comment below).
# - Added the operator repo's sample PrometheusRule on top of the cluster
#   chart's
#   (https://github.com/cloudnative-pg/cloudnative-pg/blob/a45a30990d22196b0233da222d38f9888abaf12d/docs/src/samples/monitoring/prometheusrule.yaml,
#   re-check when bumping apps/cnpg). It contributes LongRunningTransaction
#   (CNPGLongRunningTransaction plus a critical twin), BackendsWaiting
#   (CNPGBackendsWaitingOnLocks), DatabaseDeadlockConflicts
#   (CNPGDatabaseDeadlocks), PGDatabaseXidAge (CNPGDatabaseXIDAgeHigh) and
#   LastFailedArchiveTime (CNPGWALArchiveFailing). Each rule's own comment
#   gives its threshold changes. Across all of them, rules group by
#   (namespace, cnpg_cluster) like the rest of this file, and upstream's
#   for: 1m becomes this file's 5m unless a rule's comment says otherwise.
#   Two of its rules are dropped as duplicates. PGReplication reads
#   cnpg_pg_replication_lag, which the lag rules above replace (see their
#   comment). ReplicaFailingReplication (a standby whose WAL receiver is
#   down) is a subset of CNPGClusterHAWarning, because the primary stops
#   counting that standby as streaming.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cnpg
spec:
  groups:
    - name: cnpg
      rules:
        # The two HA rules assume instances: 3, which db-cluster.yaml
        # documents as the repo floor (the replica PDB only releases a
        # replica at 3+). A deliberately 2-instance database would hold
        # HAWarning firing forever — resize it to 3 or override the rule.
        - alert: CNPGClusterHACritical
          annotations:
            summary: A CNPG cluster has no streaming standby left.
            description: >-
              Cluster {{ $labels.namespace }}/{{ $labels.cnpg_cluster }}
              has no healthy standby receiving WAL — the next instance
              failure loses data back to the last archived WAL segment, and
              there is nothing to fail over to. Check `kubectl cnpg status
              {{ $labels.cnpg_cluster }} -n {{ $labels.namespace }}`
              (runbooks/connect-cnpg-database.md).
          expr: |-
            max by (namespace, cnpg_cluster) (
              cnpg_pg_replication_streaming_replicas - cnpg_pg_replication_is_wal_receiver_up
            ) < 1
          for: 5m
          labels:
            severity: critical
        - alert: CNPGClusterHAWarning
          annotations:
            summary: A CNPG cluster is down to one streaming standby.
            description: >-
              Cluster {{ $labels.namespace }}/{{ $labels.cnpg_cluster }}
              has fewer than two streaming standbys for 5m — one more
              failure and CNPGClusterHACritical applies. Normal during a
              rolling update or single-pod rebuild; sustained, it means a
              replica can't start or can't catch up.
          expr: |-
            max by (namespace, cnpg_cluster) (
              cnpg_pg_replication_streaming_replicas - cnpg_pg_replication_is_wal_receiver_up
            ) < 2
          for: 5m
          labels:
            severity: warning
        - alert: CNPGClusterHighConnectionsCritical
          annotations:
            summary: A CNPG instance is nearly out of connections.
            description: >-
              Instance {{ $labels.pod }} is using
              {{ printf "%.0f" $value }}% of max_connections. At 100% the
              application gets "too many clients" errors — find the leak or
              raise max_connections via the Cluster's postgresql.parameters.
          expr: |-
            sum by (namespace, cnpg_cluster, pod) (cnpg_backends_total)
            /
            max by (namespace, cnpg_cluster, pod) (
              cnpg_pg_settings_setting{name="max_connections"}
            ) * 100 > 95
          for: 5m
          labels:
            severity: critical
        - alert: CNPGClusterHighConnectionsWarning
          annotations:
            summary: A CNPG instance is approaching its connection limit.
            description: >-
              Instance {{ $labels.pod }} is using
              {{ printf "%.0f" $value }}% of max_connections (threshold
              80%).
          expr: |-
            sum by (namespace, cnpg_cluster, pod) (cnpg_backends_total)
            /
            max by (namespace, cnpg_cluster, pod) (
              cnpg_pg_settings_setting{name="max_connections"}
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
        # Both lag rules read pg_stat_replication on the primary, not
        # cnpg_pg_replication_lag. That metric is
        # "now() - pg_last_xact_replay_timestamp()" evaluated on the
        # standby, so it measures how long ago the last *write* was
        # replayed: it climbs while the primary has nothing to send and
        # resets on the next commit. A database whose writes arrive in
        # bursts therefore sawtooths to tens of seconds with healthy
        # standbys, and every standby spikes in lockstep because the cause
        # is the primary going quiet. Measured on one such cluster: a 39s
        # reading while pg_stat_replication put the same standbys 0.2s and
        # 7KB behind.
        #
        # replay_lag is what the primary itself measured for the last WAL
        # record the standby confirmed replaying, so an idle cluster
        # reports the last real round-trip rather than a growing number.
        # It does hold that value while no WAL flows, so a burst that ends
        # on a high sample would keep firing; gate both rules on
        # replay_diff_bytes (the primary's WAL position minus the
        # standby's replay position), which drops to ~0 as soon as a
        # standby is caught up, exceeding one 16MiB WAL segment. A standby
        # that is gone rather than behind has no row in
        # pg_stat_replication at all and is CNPGClusterHACritical's
        # business, not these rules'.
        - alert: CNPGClusterPhysicalReplicationLagCritical
          annotations:
            summary: CNPG replication lag is over 15 seconds.
            description: >-
              Replication lag on cluster
              {{ $labels.namespace }}/{{ $labels.cnpg_cluster }} is
              {{ printf "%.0f" $value }}s. A failover now loses that much
              committed data; read replicas serve equally stale reads.
          expr: |-
            max by (namespace, cnpg_cluster) (
              cnpg_pg_stat_replication_replay_lag_seconds
              and on (namespace, cnpg_cluster, application_name)
              cnpg_pg_stat_replication_replay_diff_bytes > 16777216
            ) > 15
          for: 5m
          labels:
            severity: critical
        - alert: CNPGClusterPhysicalReplicationLagWarning
          annotations:
            summary: CNPG replication lag is over 1 second.
            description: >-
              Replication lag on cluster
              {{ $labels.namespace }}/{{ $labels.cnpg_cluster }} has been
              {{ printf "%.1f" $value }}s for 5m, with the standby more
              than a WAL segment behind — it isn't keeping up with the
              primary's WAL rate.
          expr: |-
            max by (namespace, cnpg_cluster) (
              cnpg_pg_stat_replication_replay_lag_seconds
              and on (namespace, cnpg_cluster, application_name)
              cnpg_pg_stat_replication_replay_diff_bytes > 16777216
            ) > 1
          for: 5m
          labels:
            severity: warning
        # hot_standby_feedback trades replica query cancellations for bloat
        # on the primary: each standby reports the oldest snapshot it still
        # needs, and the primary's vacuum keeps every row version that
        # snapshot could read. A long replica query (an export, a dashboard)
        # holds vacuum back on the primary for as long as it runs, and
        # nothing else shows it.
        #
        # The series is a custom query, not one of CNPG's defaults. A standby
        # streaming through a replication slot (CNPG's HA slots) reports its
        # xmin on the slot, and Postgres then leaves
        # pg_stat_replication.backend_xmin NULL, so the default
        # cnpg_pg_stat_replication_backend_xmin_age reads 0 however far back
        # vacuum is held (checked on PG 18, 2026-09-30). A database that turns
        # feedback on adds a query named hot_standby_feedback to its
        # Cluster's monitoring.customQueriesConfigMap, run with primary: true,
        # that exports COALESCE(age(xmin), 0) AS xmin_age per physical slot,
        # labeled slot_name. Nothing in this template turns feedback on, so
        # here the rule stays idle.
        #
        # XIDs rather than time, because the cost is the dead rows vacuum
        # can't remove, and those scale with what the primary writes
        # meanwhile: a quiet database can hold for hours harmlessly, a busy
        # one not for minutes. 100k is sized on the busiest database running
        # feedback, which burned 35-100 XID/s hour to hour in the week to
        # 2026-09-30 (44/s median), so it fires about 30-45 minutes into a
        # hold. That database's largest routine hold is its nightly base
        # backup, which runs on a standby as one statement of up to ~23
        # minutes (~63k XIDs); app queries on its replicas peak near 43k.
        - alert: CNPGVacuumHeldBackByStandby
          annotations:
            summary: A standby is holding back vacuum on the primary.
            description: >-
              Replication slot {{ $labels.slot_name }} on
              {{ $labels.namespace }}/{{ $labels.cnpg_cluster }} is holding
              the primary's vacuum horizon {{ printf "%.0f" $value }} XIDs
              back (threshold 100k) through hot_standby_feedback. A long
              query or transaction on that standby (CNPG names each HA slot
              after its instance, _cnpg_<instance> with dashes as
              underscores) is pinning it, and dead rows pile up on the
              primary until it ends. On the standby, `SELECT pid, usename,
              application_name,
              now() - xact_start AS xact_age, state, left(query, 80) FROM
              pg_stat_activity WHERE backend_xmin IS NOT NULL ORDER BY
              age(backend_xmin) DESC` names it, and
              pg_terminate_backend(pid) releases the horizon.
          expr: |-
            max by (namespace, cnpg_cluster, slot_name) (
              cnpg_hot_standby_feedback_xmin_age
            ) > 100000
          for: 5m
          labels:
            severity: warning
        # A transaction left open on the primary costs twice. Vacuum can't
        # remove any row version its snapshot might still need, so dead rows
        # pile up in every table of that database for as long as it runs.
        # It also keeps every lock it took until it ends, so a migration's
        # DDL queues behind it, and every later query on that table queues
        # behind the DDL.
        #
        # Primary only (cnpg_pg_replication_in_recovery == 0). On a standby,
        # CNPGVacuumHeldBackByStandby above covers the cost when
        # hot_standby_feedback is on. When it's off, replay cancels a
        # conflicting query after max_standby_streaming_delay, and a delay
        # beyond that shows up in the lag rules. Leaving standbys out also
        # skips the nightly base backup, which runs on a standby as one
        # statement of up to ~23 minutes (see that rule's comment). If a
        # backup ever runs on the primary instead, 30m still clears it.
        #
        # cnpg_backends_max_tx_duration_seconds comes from CNPG's default
        # backends query: the oldest xact_start per (datname, usename,
        # application_name, state). The rules aggregate state away, because
        # a transaction that alternates between active and idle in
        # transaction would otherwise move between series and restart the
        # alert's for: timer at every switch. Sessions with no open
        # transaction read 0. The query drops rows with no usename, so
        # autovacuum and other background workers never appear.
        #
        # The thresholds are an estimate, not measured. Upstream's 5m would
        # page on every long migration and pg_dump. 30m clears the backup
        # statement, and at the busiest database's ~44 XID/s it is close to
        # the hold CNPGVacuumHeldBackByStandby pages on from the standby
        # side (100k XIDs is ~38m there). 2h is the critical threshold: a
        # transaction that long builds large bloat on a busy database, and
        # legitimate long work belongs on a replica. Re-size both once the
        # series has some history.
        - alert: CNPGLongRunningTransaction
          annotations:
            summary: A transaction on a CNPG primary has been open over 30 minutes.
            description: >-
              A transaction by {{ $labels.usename }} (application_name
              "{{ $labels.application_name }}") in database
              {{ $labels.datname }} on primary {{ $labels.pod }}
              ({{ $labels.namespace }}/{{ $labels.cnpg_cluster }}) has been
              open {{ humanizeDuration $value }}. Until it ends, vacuum can't
              remove dead rows anywhere in that database, and its locks block
              any DDL waiting on them, along with every query queued behind
              that DDL. A long migration (CREATE INDEX CONCURRENTLY) can
              legitimately run this long; a pg_dump should run on a replica
              instead. To find it, open psql on the primary with
              `kubectl cnpg psql {{ $labels.cnpg_cluster }} -n
              {{ $labels.namespace }}` and run `SELECT pid, usename,
              application_name, client_addr, state, now() - xact_start AS
              xact_age, left(query, 80) FROM pg_stat_activity WHERE
              xact_start < now() - interval '30 minutes' ORDER BY
              xact_start`. pg_terminate_backend(pid) ends the session and
              rolls the transaction back.
          expr: |-
            max by (namespace, cnpg_cluster, pod, datname, usename, application_name) (
              cnpg_backends_max_tx_duration_seconds
            ) > 1800
            and on (namespace, pod)
            cnpg_pg_replication_in_recovery == 0
          for: 5m
          labels:
            severity: warning
        - alert: CNPGLongRunningTransactionCritical
          annotations:
            summary: A transaction on a CNPG primary has been open over 2 hours.
            description: >-
              A transaction by {{ $labels.usename }} (application_name
              "{{ $labels.application_name }}") in database
              {{ $labels.datname }} on primary {{ $labels.pod }}
              ({{ $labels.namespace }}/{{ $labels.cnpg_cluster }}) has been
              open {{ humanizeDuration $value }}. CNPGLongRunningTransaction
              fired for it at 30m. It has blocked vacuum that whole time, so
              bloat keeps growing until the transaction ends. Unless it's a
              migration someone is actively watching, find it with the query
              in CNPGLongRunningTransaction and end it with
              pg_terminate_backend(pid).
          expr: |-
            max by (namespace, cnpg_cluster, pod, datname, usename, application_name) (
              cnpg_backends_max_tx_duration_seconds
            ) > 7200
            and on (namespace, pod)
            cnpg_pg_replication_in_recovery == 0
          for: 5m
          labels:
            severity: critical
        # Upstream's BackendsWaiting treats this series as seconds ("waiting
        # for longer than 5 minutes", > 300). CNPG's backends_waiting query
        # actually counts blocked lock requests, one per (waiting lock,
        # conflicting lock) pair, so a session queued behind three holders
        # counts 3. As upstream wrote it, the rule needs 300 such pairs
        # before it fires. Here it fires on any nonzero count held for 5m.
        # That usually means one session has waited the whole time, so
        # whatever holds the lock has been in its transaction at least as
        # long: the migration-DDL-behind-a-transaction pile-up, which
        # CNPGLongRunningTransaction only catches at 30m. Brief row-lock
        # contention between short transactions rarely shows up on every
        # sample for 5m. A queue table polled with FOR UPDATE and no SKIP
        # LOCKED can, and that is worth knowing too. All instances: on a
        # standby, queries can queue behind replayed locks, but replay
        # cancels them after max_standby_streaming_delay, so a standby
        # rarely holds a count for 5m.
        - alert: CNPGBackendsWaitingOnLocks
          annotations:
            summary: Sessions on a CNPG instance have been blocked on locks for 5 minutes.
            description: >-
              Instance {{ $labels.pod }}
              ({{ $labels.namespace }}/{{ $labels.cnpg_cluster }}) has had
              blocked lock requests on every sample for 5m (now
              {{ printf "%.0f" $value }}). The queries queued behind the
              lock stall the requests waiting on them, and any DDL in the
              queue blocks every later query on its table. On that instance,
              `SELECT pid, usename, application_name, state, now() -
              xact_start AS xact_age, pg_blocking_pids(pid) AS blocked_by,
              left(query, 80) FROM pg_stat_activity WHERE
              cardinality(pg_blocking_pids(pid)) > 0` lists each waiter and
              the pids blocking it. Ending the oldest blocker with
              pg_terminate_backend(pid) usually clears the queue.
          expr: |-
            max by (namespace, cnpg_cluster, pod) (cnpg_backends_waiting_total) > 0
          for: 5m
          labels:
            severity: warning
        # Postgres resolves a deadlock by aborting one of the transactions,
        # so the app gets errors rather than a hang. Repeated deadlocks mean
        # two code paths lock the same rows in opposite orders. The threshold
        # is upstream's 10 per hour. Summed over the cluster's instances,
        # because after a failover the counter continues on a different pod.
        - alert: CNPGDatabaseDeadlocks
          annotations:
            summary: A CNPG database is hitting repeated deadlocks.
            description: >-
              Database {{ $labels.datname }} on
              {{ $labels.namespace }}/{{ $labels.cnpg_cluster }} had
              {{ printf "%.0f" $value }} deadlocks in the last hour. Each one
              aborted a transaction with "deadlock detected". Postgres logs
              that error along with both sides' queries, so search the
              instance logs for it to find the two code paths that lock the
              same rows in opposite orders.
          expr: |-
            sum by (namespace, cnpg_cluster, datname) (
              increase(cnpg_pg_stat_database_deadlocks[1h])
            ) > 10
          for: 5m
          labels:
            severity: warning
        # Transaction-ID wraparound protection. Autovacuum force-freezes any
        # table older than autovacuum_freeze_max_age (200M by default), and
        # Postgres stops accepting writes about 2.1B XIDs in. A database
        # older than upstream's 300M therefore means freezing is running
        # 100M behind. Either something is holding the horizon back (a long
        # transaction, a standby's feedback, an abandoned replication slot,
        # a forgotten prepared transaction) or autovacuum can't finish a big
        # table. The standbys replay the same pg_database rows, so the max
        # collapses the three instances into one alert per database.
        - alert: CNPGDatabaseXIDAgeHigh
          annotations:
            summary: A CNPG database's oldest unfrozen XID is over 300M transactions old.
            description: >-
              Database {{ $labels.datname }} on
              {{ $labels.namespace }}/{{ $labels.cnpg_cluster }} is
              {{ humanize $value }} transactions past its oldest unfrozen
              XID. Autovacuum force-freezes from 200M, and Postgres stops
              accepting writes near 2.1B. Look for what is pinning the
              vacuum horizon:
              CNPGLongRunningTransaction or CNPGVacuumHeldBackByStandby
              firing, `SELECT slot_name, active, xmin, catalog_xmin FROM
              pg_replication_slots`, and `SELECT * FROM pg_prepared_xacts`.
              Then, in that database, run `SELECT relname,
              age(relfrozenxid) FROM pg_class WHERE relkind IN ('r', 'm',
              't') ORDER BY 2 DESC LIMIT 10` to find the table autovacuum
              is stuck on.
          expr: |-
            max by (namespace, cnpg_cluster, datname) (cnpg_pg_database_xid_age) > 300000000
          for: 5m
          labels:
            severity: warning
        # kube_pod_info knows nodes but not CNPG clusters (kube-state-metrics
        # exports no pod labels here), so join it against a series the
        # instance exporter emits for exactly the pods we care about.
        - alert: CNPGClusterInstancesOnSameNode
          annotations:
            summary: Multiple CNPG instances share a node.
            description: >-
              {{ printf "%.0f" $value }} instances of cluster
              {{ $labels.namespace }}/{{ $labels.cnpg_cluster }} are on node
              {{ $labels.node }} — that node failing takes them all,
              defeating the replica count. CNPG spreads by
              anti-affinity when it can; sustained co-location means the
              cluster is short on schedulable nodes.
          expr: |-
            count by (namespace, cnpg_cluster, node) (
              max by (namespace, pod, cnpg_cluster) (cnpg_collector_up)
              * on (namespace, pod) group_left (node)
              max by (namespace, pod, node) (kube_pod_info)
            ) > 1
          for: 5m
          labels:
            severity: warning
        - alert: CNPGFleetMetricsAbsent
          annotations:
            summary: No CNPG instance metrics exist cluster-wide.
            description: >-
              Not a single cnpg_collector_up series is being collected. On
              this template that is unconditionally wrong — goalert-db is a
              core app — so either every database is down or the
              cnpg-instances scrape broke (see the instance scrape above; its
              selector rotting is exactly how the operator scrape once sat
              empty). Every other rule in this group is blind while this
              fires.
          expr: |-
            absent(cnpg_collector_up) == 1
          for: 10m
          labels:
            severity: critical
        # Archiving failing outright, as opposed to falling behind
        # (CNPGWALArchiveBacklog below): the last attempt failed more
        # recently than the last success. last_archived_time reads -1 on a
        # cluster that has never archived, so a bootstrap whose first
        # segment fails fires too. Only the primary archives here, which
        # upstream's in_recovery guard keeps explicit. This is critical rather
        # than upstream's warning because Postgres recycles no WAL until it
        # is archived: the WAL volume (1Gi in db-cluster.yaml) fills at the
        # database's full write rate, and PITR has a gap after the last
        # success. It waits 15m rather than 5m because the archiver retries
        # at least once a minute, so an S3 blip that clears within that
        # time never pages.
        - alert: CNPGWALArchiveFailing
          annotations:
            summary: CNPG WAL archiving is failing.
            description: >-
              The last WAL archive attempt on primary {{ $labels.pod }}
              ({{ $labels.namespace }}/{{ $labels.cnpg_cluster }}) failed,
              and no attempt has succeeded since, for over 15m. Unarchived
              WAL is never recycled, so the WAL volume is filling, and
              point-in-time recovery stops at the last success. Check the
              plugin-barman-cloud sidecar's logs. "Expected empty archive"
              means the cluster is archiving into a WAL history it didn't
              create; bump the plugin's serverName per
              runbooks/restore-cnpg-database.md.
          expr: |-
            (
              cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time
            ) > 1
            and on (namespace, pod)
            cnpg_pg_replication_in_recovery == 0
          for: 15m
          labels:
            severity: critical
        # ---- Incident-derived rules (no upstream equivalent) ----
        # WAL that isn't archived can't be recycled, so a growing
        # archive_status backlog is the leading indicator of the WAL volume
        # filling — the 2026-09-05 failure mode db-cluster.yaml documents
        # (nightly batch out-wrote the archiver; volume filled; PANIC;
        # failover). The PVC-level backstop is the bundled
        # KubePersistentVolumeFillingUp.
        - alert: CNPGWALArchiveBacklog
          annotations:
            summary: CNPG WAL archiving is falling behind.
            description: >-
              {{ printf "%.0f" $value }} WAL segments on instance
              {{ $labels.pod }} ({{ $labels.namespace }}/{{
              $labels.cnpg_cluster }}) are waiting to be archived to S3.
              The WAL volume fills while this backlog grows. Check the
              plugin-barman-cloud sidecar's logs and S3 reachability;
              maxParallel is tuned in the Cluster's WAL archiving config
              (db-cluster.yaml).
          expr: |-
            cnpg_collector_pg_wal_archive_status{value="ready"} > 30
          for: 15m
          labels:
            severity: warning
        # ScheduledBackup is nightly (04:00 UTC in db-cluster.yaml), so 26h
        # without a completed backup means one was missed, not jitter. The
        # "> 0" guard skips clusters that have never completed a backup, so
        # a fresh bootstrap doesn't page.
        - alert: CNPGBackupStale
          annotations:
            summary: A CNPG database's last backup is over 26 hours old.
            description: >-
              The newest completed base backup for
              {{ $labels.namespace }}/{{ $labels.cnpg_cluster }} is
              {{ humanizeDuration $value }} old — last night's
              ScheduledBackup failed or never ran. `kubectl get backups -n
              {{ $labels.namespace }}` shows the failure; a multi-GB
              database OOMKilling the barman sidecar mid-stream is the
              known culprit (see the sidecar resources note in
              db-cluster.yaml, and CNPGBarmanSidecarOOMKilled).
          expr: |-
            (
              time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
            ) > 26 * 3600
            and barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0
          for: 1h
          labels:
            severity: critical
        - alert: CNPGBackupFailed
          annotations:
            summary: A CNPG backup failed more recently than any succeeded.
            description: >-
              The most recent backup attempt for
              {{ $labels.namespace }}/{{ $labels.cnpg_cluster }} failed
              (and no success has landed since) — catching it now beats
              waiting 26h for CNPGBackupStale. The classic signature is
              the barman sidecar OOMKilled mid-stream, surfacing as "rpc
              error ... EOF" on the Backup object.
          expr: |-
            barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp
            > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
          for: 15m
          labels:
            severity: warning
        # retentionPolicy is 30d; if the oldest recoverable point is
        # suddenly younger than 2 days on a cluster that had backups 2 days
        # ago, the recovery window collapsed (retention misfire, or the
        # object-store history was lost). The offset guard keeps new
        # databases from paging during their first days of life.
        - alert: CNPGRecoveryWindowShrunk
          annotations:
            summary: A CNPG database's PITR window collapsed.
            description: >-
              Point-in-time recovery for
              {{ $labels.namespace }}/{{ $labels.cnpg_cluster }} now only
              reaches back only {{ humanizeDuration $value }},
              on a cluster whose retention should hold 30 — check the
              ObjectStore and the S3 bucket
              (runbooks/restore-cnpg-database.md documents the layout).
          expr: |-
            (
              time() - barman_cloud_cloudnative_pg_io_first_recoverability_point < 2 * 86400
            )
            and barman_cloud_cloudnative_pg_io_first_recoverability_point > 0
            and barman_cloud_cloudnative_pg_io_first_recoverability_point offset 2d > 0
          for: 1h
          labels:
            severity: warning
        - alert: CNPGBarmanSidecarOOMKilled
          annotations:
            summary: A barman-cloud sidecar was OOMKilled.
            description: >-
              The plugin-barman-cloud sidecar in pod
              {{ $labels.namespace }}/{{ $labels.pod }} restarted after an
              OOM kill in the last hour. Base backups of a grown dataset
              are the known trigger — raise the sidecar's memory in that
              Cluster's plugin resources (the 128Mi default suits small
              datasets; the first real fork database needed 512Mi, per
              db-cluster.yaml).
          expr: |-
            increase(kube_pod_container_status_restarts_total{container="plugin-barman-cloud"}[1h]) > 0
            and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{container="plugin-barman-cloud", reason="OOMKilled"} == 1
          for: 5m
          labels:
            severity: warning
