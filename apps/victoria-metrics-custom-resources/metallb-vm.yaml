# Scrape MetalLB — address-pool allocation gauges, config loaded/stale
# flags, and the speakers' layer-2 announcement counters — from the
# controller Deployment and speaker DaemonSet pods. Every metrics container
# port in chart 0.15.2 (apps/metallb's pin, verified by rendering) is named
# "monitoring": controller :7472, speaker :7472, and the speaker's
# frr-metrics sidecar :7473 — one endpoint entry picks up all three, which
# matches the two-endpoint ServiceMonitor the chart's
# prometheus.serviceMonitor.enabled would create (unusable here for the
# CRD-ownership reason in cnpg-vm.yaml; it is also the only thing
# that renders metrics Services, so a pod scrape is the only option under
# the default values). Plain HTTP /metrics, no auth.
#
# jobLabel makes job="metallb" for every target: the upstream rules in
# the VMRule below match job=~"metallb.*" (anchored), which the pod-scrape
# default of "victoria-metrics/metallb" would never satisfy.
#
# Non-EKS only, like the app (metallb replaces the AWS NLB on k0s/talos) —
# this file is referenced from kustomization.yaml inside a metallb marker
# block, which deploy.sh enables on non-EKS platforms alongside the app.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: metallb
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - metallb
  selector:
    matchLabels:
      app.kubernetes.io/name: metallb
      app.kubernetes.io/instance: metallb
  podMetricsEndpoints:
    - port: monitoring
---
# Alerting rules for MetalLB, evaluated by this stack's vmalert over the
# series collected by the scrape above. Adapted from the
# PrometheusRule the metallb chart's prometheus.prometheusRule.enabled
# would render (charts/metallb/templates/prometheusrules.yaml at v0.15.2,
# apps/metallb's pin — unusable directly for the CRD-ownership reason in
# cnpg-vm.yaml), with deliberate deviations:
# - MetalLBConfigNotLoaded raised warning -> critical: no config loaded
#   means no LoadBalancer gets an address at all.
# - Kept only the 95% tier of upstream's 75/85/95 pool-usage ladder, and
#   gave it the "for: 5m" upstream omits: the template's pool is four
#   addresses (apps/metallb-custom-resources/ipaddresspools.yaml), so 75%
#   is normal operation, and this repo pages on warnings.
# - Dropped MetalLBBGPSessionDown: this template advertises via
#   L2Advertisement only, so metallb_bgp_session_up never exists (same
#   dead-expr reasoning as the count:up0 note in
#   apps/victoria-metrics/values.yaml). Restore it if BGP is configured.
# - Added MetalLBServiceNoIngressIP (not upstream, from kube-state-metrics):
#   ipaddresspools.yaml documents that a LoadBalancer Service that can't
#   get an address just sits <pending> forever — a silent failure. Pool
#   exhaustion is one cause (covered above); a Service whose pool
#   annotation matches nothing is another, and only this rule sees it.
# Non-EKS only, gated by the same metallb marker block as the scrape.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: metallb
spec:
  groups:
    - name: metallb
      rules:
        - alert: MetalLBConfigNotLoaded
          annotations:
            summary: MetalLB has not loaded its config.
            description: >-
              {{ $labels.container }} on {{ $labels.pod }} reports no
              loaded configuration — it is allocating and announcing
              nothing. Check the IPAddressPool/L2Advertisement objects in
              apps/metallb-custom-resources and the controller logs.
          expr: |-
            metallb_k8s_client_config_loaded_bool{job=~"metallb.*"} == 0
          for: 5m
          labels:
            severity: critical
        - alert: MetalLBStaleConfig
          annotations:
            summary: A MetalLB pod is running on stale config.
            description: >-
              {{ $labels.container }} on {{ $labels.pod }} has been unable
              to apply the latest configuration for 5m and keeps running on
              the previous one — usually a newly-applied pool/advertisement
              that fails validation.
          expr: |-
            metallb_k8s_client_config_stale_bool{job=~"metallb.*"} == 1
          for: 5m
          labels:
            severity: warning
        - alert: MetalLBAddressPoolExhausted
          annotations:
            summary: A MetalLB address pool is exhausted.
            description: >-
              Pool {{ $labels.pool }} has no free addresses — the next
              LoadBalancer Service sits <pending> silently. Widen the pool
              in apps/metallb-custom-resources/ipaddresspools.yaml.
          expr: |-
            metallb_allocator_addresses_in_use_total{pool!~""}
            >= on (pool) metallb_allocator_addresses_total
          for: 5m
          labels:
            severity: critical
        # The aggregate ratio can hide "IPv6 exhausted, IPv4 free" in the
        # dual-stack pool; the vendored dashboard's per-family panels are
        # where to look when this fires.
        - alert: MetalLBAddressPoolUsage95Percent
          annotations:
            summary: A MetalLB address pool is over 95% used.
            description: >-
              Pool {{ $labels.pool }} is {{ printf "%.0f" $value }}% used —
              one or two more LoadBalancer Services and
              MetalLBAddressPoolExhausted applies.
          expr: |-
            (
              metallb_allocator_addresses_in_use_total{pool!~""}
              / on (pool) metallb_allocator_addresses_total
            ) * 100 > 95
          for: 5m
          labels:
            severity: warning
        - alert: MetalLBServiceNoIngressIP
          annotations:
            summary: A LoadBalancer Service has no address.
            description: >-
              Service {{ $labels.namespace }}/{{ $labels.service }} has
              been type LoadBalancer without an assigned address for 15m —
              the exact <pending>-forever failure
              apps/metallb-custom-resources/ipaddresspools.yaml warns is
              otherwise silent. Check pool capacity and any pool-selection
              annotations on the Service.
          expr: |-
            kube_service_spec_type{type="LoadBalancer"}
            unless on (namespace, service)
            kube_service_status_load_balancer_ingress
          for: 15m
          labels:
            severity: warning
