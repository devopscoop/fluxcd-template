# Scrape the OpenCost exporter's cost metrics (node_total_hourly_cost,
# pv_hourly_cost, container_*_allocation, opencost_build_info, ...) from
# apps/opencost's "opencost" Service, port "http" (:9003), standard /metrics
# path (verified in opencost-helm-chart 2.5.30, matching apps/opencost's
# pin). Lives here rather than in apps/opencost for the CRD-ordering reason
# in kustomization.yaml. The "OpenCost / Overview" dashboard in
# apps/victoria-metrics reads these series back out of vmsingle.
#
# EKS-only, like apps/opencost itself (deploy.sh registers the app only
# when k8s_platform=eks) — referenced from kustomization.yaml inside an
# opencost marker block, which deploy.sh enables alongside the app; the
# dashboard entry sits in the same marker in
# apps/victoria-metrics/values.yaml.
#
# The exporter also re-emits kube_node_labels with one label_* per Kubernetes
# node label. On Karpenter nodes that came to 44-48 labels per series, past
# vmsingle's -maxLabelsPerTimeseries default of 40, so vmsingle dropped every
# one (RowsRejectedOnIngestion) -- the same failure as the kubelet labelmap in
# apps/victoria-metrics/values.yaml. The metricRelabelConfigs below strip two
# groups of labels from that metric only (the if: leaves every cost series
# alone): Karpenter's karpenter.k8s.aws/instance-* hardware metadata (14-15
# labels, more on GPU instances; node_total_hourly_cost already carries
# instance_type), and the deprecated beta.kubernetes.io/* and
# failure-domain.beta.kubernetes.io/* labels, which duplicate the GA
# kubernetes.io/arch|os, node.kubernetes.io/instance-type and
# topology.kubernetes.io/region|zone labels that stay. That takes the worst
# series seen from 48 labels to 29. Karpenter's karpenter.sh/capacity-type
# and nodepool labels are kept.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: opencost
spec:
  namespaceSelector:
    matchNames:
      - opencost
  selector:
    matchLabels:
      app.kubernetes.io/name: opencost
  endpoints:
    - port: http
      # Keep the exporter's own namespace/instance (node) labels instead of
      # the scrape target's; the dashboard's per-namespace cost joins need them.
      honorLabels: true
      metricRelabelConfigs:
        - if: '{__name__="kube_node_labels"}'
          action: labeldrop
          regex: label_(karpenter_k8s_aws_instance_.+|beta_kubernetes_io_.+|failure_domain_beta_kubernetes_io_.+)
