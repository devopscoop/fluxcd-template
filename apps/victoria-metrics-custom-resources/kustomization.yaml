apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The operator.victoriametrics.com CRs that belong to the sibling
# apps/victoria-metrics stack but can't ship inside it: that app's
# HelmRelease is what installs the VictoriaMetrics operator and its CRDs, and
# flux dry-runs every object in a Kustomization before applying any of them,
# so a VMRule/VMPodScrape/VMServiceScrape sitting next to the HelmRelease
# fails the dry-run on a cluster where the CRDs don't exist yet -- taking the
# HelmRelease that would have installed them down with it. Splitting them out
# lets the flux Kustomization dependsOn victoria-metrics (which has
# wait: true, so the operator is installed and the CRDs registered before
# this app applies). Same pattern as cert-manager-custom-resources and
# eg-custom-resources.
#
# Dashboards stay in apps/victoria-metrics: they're grafana.dashboards
# download entries in that app's values.yaml (or, for the hand-built ones,
# plain ConfigMaps picked up by Grafana's sidecar), no CRD involved.
#
# One file per app: <app>-vm.yaml holds every scrape and rule object for
# that app, as YAML documents. deploy.sh deletes the files of apps the
# cluster doesn't run (see its removal step), and one file per app is what
# keeps that removal a single rm.
#
# Scrapes and rules for apps that are NOT always deployed sit in marker
# blocks below, enabled together with their app: a scrape whose selector
# matches nothing leaves an empty scrape pool and pages via the bundled
# ScrapePoolHasNoTargets (the failure documented in cnpg-vm.yaml), and
# absence-style rules would false-fire. deploy.sh enables the eks, karpenter
# and opencost blocks when k8s_platform=eks (and the metallb block
# otherwise) automatically; opt-in apps' blocks are enabled by hand when the
# app is (./toggle_blocks.sh --enable <marker>, marker named after the app
# -- restoring the app's <app>-vm.yaml from fluxcd-template first if
# deploy.sh's removal step already deleted it).
namespace: victoria-metrics

resources:
  - envoy-vm.yaml
  - cnpg-vm.yaml
  # The Flux control plane itself (flux-operator + the FluxInstance's
  # controllers) — always present by definition.
  - flux-vm.yaml
  - cert-manager-vm.yaml
  - external-dns-vm.yaml
# >>> opencost: deploy.sh uncomments this block when k8s_platform=eks
#   - opencost-vm.yaml
# <<< opencost
# >>> karpenter: deploy.sh uncomments this block when k8s_platform=eks
#   - karpenter-vm.yaml
# <<< karpenter
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#   - aws-load-balancer-controller-vm.yaml
#   - metrics-server-vm.yaml
# <<< eks
# >>> metallb: deploy.sh uncomments this block when k8s_platform is not eks
#   - metallb-vm.yaml
# <<< metallb
# >>> longhorn: ./toggle_blocks.sh --enable longhorn when enabling apps/longhorn
#   - longhorn-vm.yaml
# <<< longhorn
# >>> rook-ceph: ./toggle_blocks.sh --enable rook-ceph when enabling apps/rook-ceph
#   - rook-ceph-vm.yaml
# <<< rook-ceph
# >>> rabbitmq: ./toggle_blocks.sh --enable rabbitmq when enabling the rabbitmq operator apps
#   - rabbitmq-vm.yaml
## The rabbitmq-instances scrape is a second marker block inside
## rabbitmq-vm.yaml, commented until the first RabbitmqCluster ships -- see
## that file's header.
# <<< rabbitmq
# >>> coraza: ./toggle_blocks.sh --enable coraza when enabling apps/coraza
#   - coraza-vm.yaml
# <<< coraza
# >>> valkey: ./toggle_blocks.sh --enable valkey when enabling the valkey-operator app
#   - valkey-vm.yaml
## The valkey-instances scrape is a second marker block inside
## valkey-vm.yaml, commented until the first ValkeyCluster ships -- see that
## file's header.
# <<< valkey
