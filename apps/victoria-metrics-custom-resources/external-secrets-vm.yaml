# Scrape all three External Secrets Operator components -- the controller
# (ExternalSecret/SecretStore condition gauges, provider API call counters,
# controller-runtime reconcile metrics), the webhook, and the
# cert-controller -- each on its "metrics" port (:8080, plain HTTP), through
# the per-component metrics Services apps/external-secrets/values.yaml
# turns on. Mirrors the chart's serviceMonitor.enabled objects, which are
# unusable here for the CRD-ownership reason in cnpg-vm.yaml, minus their
# helm.sh/chart-bearing selector: the three Services share only
# app.kubernetes.io/instance, and the webhook Service's other port
# ("webhook", :443) yields no target because the endpoint names "metrics".
# The job label is each Service's name, which the vendored dashboard's
# service=~".*external-secrets.*" filters match.
#
# honorLabels: true, unlike cert-manager's scrape: the condition gauges
# carry the ExternalSecret's own namespace in "namespace", and both the
# rules below and the chart's dashboard (sum by (namespace, name)) want it
# there rather than displaced to exported_namespace. Nothing else ESO
# exports carries a label that would collide with a target label.
#
# Opt-in, like the app: gated by the external-secrets marker block in
# kustomization.yaml (./toggle_blocks.sh --enable external-secrets when
# enabling apps/external-secrets).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: external-secrets
spec:
  namespaceSelector:
    matchNames:
      - external-secrets
  selector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  endpoints:
    - port: metrics
      honorLabels: true
---
# Alerting rules for External Secrets Operator. Upstream ships no rule set;
# its docs (docs/api/metrics.md, "Service Level Indicators and Alerts")
# suggest SLIs on webhook errors, workqueue depth and reconcile
# latency/errors. These alert on the status conditions instead, which say
# directly what broke for whom:
# - A store that isn't Ready means no ExternalSecret using it can refresh.
#   Existing Secrets stay in place, so apps keep running on their last
#   values -- until a pod needs a rotated value or a new ExternalSecret
#   ships.
# - A single ExternalSecret that isn't Ready while its store is fine is a
#   per-app problem: usually a wrong key/property, or a path the
#   external-secrets policy in apps/openbao/policies doesn't cover.
# Dropped the SLI-style rules: the bundled KubeDeploymentReplicasMismatch
# and TargetDown already page for a dead controller or webhook, and a
# failing reconcile shows up as one of the conditions below.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: external-secrets
spec:
  groups:
    - name: external-secrets
      rules:
        - alert: ExternalSecretsClusterStoreNotReady
          annotations:
            summary: A ClusterSecretStore is not ready.
            description: >-
              ClusterSecretStore {{ $labels.name }} has been not Ready for
              10m, so no ExternalSecret using it can refresh. `kubectl
              describe clustersecretstore {{ $labels.name }}` says why; for
              the openbao store that is usually OpenBao itself being sealed
              or down (see the OpenBao alerts), or its CA/role having
              changed.
          expr: |-
            max by (name) (
              clustersecretstore_status_condition{condition="Ready", status="False"}
            ) == 1
          for: 10m
          labels:
            severity: critical
        - alert: ExternalSecretsStoreNotReady
          annotations:
            summary: A SecretStore is not ready.
            description: >-
              SecretStore {{ $labels.namespace }}/{{ $labels.name }} has been
              not Ready for 10m, so no ExternalSecret using it can refresh.
              `kubectl -n {{ $labels.namespace }} describe secretstore
              {{ $labels.name }}` says why.
          expr: |-
            max by (namespace, name) (
              secretstore_status_condition{condition="Ready", status="False"}
            ) == 1
          for: 10m
          labels:
            severity: warning
        - alert: ExternalSecretNotSynced
          annotations:
            summary: An ExternalSecret is failing to sync.
            description: >-
              ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has
              been not Ready for 15m, so its Secret is missing or stale.
              `kubectl -n {{ $labels.namespace }} describe externalsecret
              {{ $labels.name }}` shows the error; usually a wrong key or
              property, or a path the store's policy doesn't allow.
          expr: |-
            max by (namespace, name) (
              externalsecret_status_condition{condition="Ready", status="False"}
            ) == 1
          for: 15m
          labels:
            severity: warning
