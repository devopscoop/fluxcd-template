# Scrape Karpenter — node/nodepool capacity gauges, provisioning and
# disruption counters, cloudprovider error counters, controller-runtime
# internals — from the chart's "karpenter" Service, port "http-metrics"
# (:8080, standard /metrics, plain HTTP; verified by rendering chart 1.14.0,
# apps/karpenter's pin). Mirrors the ServiceMonitor the chart's
# serviceMonitor.enabled would create, which is unusable here for the
# CRD-ownership reason in cnpg-vmpodscrape.yaml.
#
# A service scrape, not a pod scrape, on purpose: the job label defaults to
# the Service name, and job="karpenter" is what karpenter-vmrule.yaml's
# upstream exprs and the vendored Karpenter Performance dashboard's
# $controller variable filter on (a VMPodScrape would yield
# job="victoria-metrics/karpenter", and those anchored matchers would go
# dark).
#
# EKS-only, like apps/karpenter itself — this file is referenced from
# kustomization.yaml inside an eks marker block, so deploy.sh enables it
# exactly when it enables the app.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: karpenter
spec:
  namespaceSelector:
    matchNames:
      # apps/karpenter deploys into kube-system (its kustomization.yaml),
      # matching the Karpenter getting-started layout.
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter
      app.kubernetes.io/instance: karpenter
  endpoints:
    - port: http-metrics
