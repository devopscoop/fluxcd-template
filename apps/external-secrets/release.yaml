# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: external-secrets-values
    - kind: Secret
      name: external-secrets-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.11.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
