apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: registry-mirrors

  # The DaemonSet mounts /etc/containerd/certs.d from the host, which the
  # baseline Pod Security level rejects. Talos enforces baseline by default
  # (https://docs.siderolabs.com/kubernetes-guides/security/pod-security).
  labels:
    pod-security.kubernetes.io/enforce: privileged
