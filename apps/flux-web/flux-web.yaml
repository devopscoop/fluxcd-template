# https://fluxoperator.dev/docs/web-ui/ingress/
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
  namespace: flux-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg-private
      namespace: envoy-gateway-system
      # HTTPS only; plain HTTP on :80 is 301'd by httproute-redirect-private.yaml.
      sectionName: https
  hostnames:
    - "flux.project1-dev.devops.coop"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: flux-operator
          namespace: flux-system
          port: 9080
