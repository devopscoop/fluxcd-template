# Scrape the RabbitMQ cluster-operator's controller-runtime metrics
# (reconcile rates/errors, workqueue depth, client-go internals) — it
# installs no Service, so this is a pod scrape. Port verified against the
# pinned release manifest this app's kustomization pulls: cluster-operator
# v2.19.0 declares container port "metrics" (:9782) upstream. Plain HTTP
# /metrics, no auth. The messaging-topology-operator's scrape lives in that
# app (apps/rabbitmq-messaging-topology-operator/vm.yaml): it can be left
# out, and a scrape here for it would leave an empty scrape pool.
#
# Note this covers the OPERATORS only. RabbitMQ *instances* (RabbitmqCluster
# CRs — none ship in this repo; apps/templates/rabbitmq is the scaffold)
# expose the real broker metrics on their :15692 "prometheus" port, always
# on. When the first RabbitmqCluster lands, enable the
# rabbitmq-instances marker block at the bottom of this file
# (./toggle_blocks.sh --enable rabbitmq-instances) — the cnpg-style
# fleet-wide scrape — and vendor the RabbitMQ-Overview dashboard
# (grafana.com/dashboards/10991) plus the rabbitmq alert set from
# rabbitmq/cluster-operator's observability/ dir into apps/victoria-metrics.
#
# Ships with the app: this file is in the app's own kustomization, so it
# applies exactly when the operator does. The kustomization sets no
# namespace (the upstream manifest carries its own), so every object here
# names rabbitmq-system itself.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: rabbitmq-cluster-operator
  namespace: rabbitmq-system
spec:
  namespaceSelector:
    matchNames:
      - rabbitmq-system
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq-cluster-operator
  podMetricsEndpoints:
    - port: metrics
---
# Alerting rule for the RabbitMQ operators, evaluated by this stack's
# vmalert. Generalised from the one operator rule upstream ships
# (rabbitmq/cluster-operator v2.19.0
# observability/prometheus/rules/rabbitmq-cluster-operator/unavailable-replicas.yml)
# to cover the messaging-topology-operator too — it lives here because that
# operator depends on this one, and the deployment matcher simply finds no
# series when the topology operator isn't deployed. It deliberately
# duplicates the bundled KubeDeploymentReplicasMismatch for these two
# Deployments — kept because it names the operator in the page title,
# which the generic rule does not.
#
# The rest of upstream's observability/prometheus/rules tree (cluster
# alarms, FD limits, disk-watermark prediction, ...) alerts on rabbitmq_*
# broker series that no pod in this repo produces — a VMRule full of
# permanently-absent exprs is dead weight, so adopt those alongside
# the rabbitmq-instances block below when the first RabbitmqCluster ships
# (two of them, no-majority-of-nodes-ready and persistent-volume-missing,
# additionally need kube-state-metrics metricLabelsAllowlist config this
# stack doesn't set; the rest port cleanly).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: rabbitmq-operators
  namespace: rabbitmq-system
spec:
  groups:
    - name: rabbitmq-operators
      rules:
        - alert: RabbitMQOperatorUnavailableReplicas
          annotations:
            summary: A RabbitMQ operator has unavailable replicas.
            description: >-
              {{ $labels.deployment }} has had
              {{ printf "%.0f" $value }} unavailable replica(s) for 5m —
              RabbitmqCluster and messaging-topology reconciliation is
              stopped (running brokers keep serving; changes and repairs
              don't happen).
          expr: |-
            kube_deployment_status_replicas_unavailable{
              namespace="rabbitmq-system",
              deployment=~"rabbitmq-cluster-operator|messaging-topology-operator"
            } > 0
          for: 5m
          labels:
            severity: warning
# >>> rabbitmq-instances: ./toggle_blocks.sh --enable rabbitmq-instances when the first RabbitmqCluster ships
# ---
## Scrape every RabbitMQ broker instance — queue/connection/channel gauges,
## message rates, alarm flags — fleet-wide: the cluster-operator stamps
## app.kubernetes.io/component=rabbitmq + part-of=rabbitmq on every
## RabbitmqCluster pod in any namespace, and the rabbitmq_prometheus plugin
## (:15692, the container port named "prometheus") is an always-on essential
## plugin. Same fleet-wide pattern as apps/cnpg/vm.yaml: one scrape covers
## every broker ever scaffolded from apps/templates/rabbitmq with no per-app
## config. Selector and port verified against cluster-operator v2.19.0
## (internal/metadata/label.go, internal/resource/statefulset.go).
##
## Commented out by default (this marker block): no RabbitmqCluster ships in
## this repo, and an empty scrape pool trips the bundled
## ScrapePoolHasNoTargets alert. Enable it when the first broker lands. If
## per-queue detail is ever needed, upstream's ServiceMonitor adds a second
## scrape of the same port at /metrics/detailed with params
## {family: [queue_coarse_metrics, queue_metrics]} — deliberate opt-in, its
## cardinality scales with queue count.
