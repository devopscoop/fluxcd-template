# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: openbao-values
    - kind: Secret
      name: openbao-secrets
  chart:
    spec:
      chart: openbao
      version: 0.30.0
      sourceRef:
        kind: HelmRepository
        name: openbao
