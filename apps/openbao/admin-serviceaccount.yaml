# The identity OpenBao's "admin" Kubernetes-auth role is bound to (see
# configure.sh). It runs nothing; humans mint short-lived tokens for it:
#
#   kubectl -n openbao create token openbao-admin --audience openbao
#
# so being an OpenBao admin means being allowed to create
# serviceaccounts/token for it in this namespace. See README.md ->
# "Administering OpenBao".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-admin
