# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: victoria-logs-values
    - kind: Secret
      name: victoria-logs-secrets
  chart:
    spec:
      chart: victoria-logs-single
      version: 0.13.9
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
