# https://fluxcd.io/flux/guides/helmreleases/#refer-to-values-in-configmaps-generated-with-kustomize
# https://fluxcd.io/flux/guides/helmreleases/#refer-to-values-in-secret-generated-with-kustomize-and-sops

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Setting namespace here will ensure that all objects managed by this Kustomization will explicitly be deployed to this namespace. You don't need to put specify `namespace:` anywhere else if you do this.
namespace: victoria-logs

resources:
  - namespace.yaml
  - helmrepo.yaml
  - release.yaml
  - vmui-httproute.yaml
  # VictoriaLogs self-monitoring: the official vlogs alerts and dashboard,
  # which the sibling victoria-metrics stack does NOT bundle for a
  # separate victoria-logs release like this one (see vmrule.yaml).
  - vmrule.yaml
  - dashboard.yaml
configMapGenerator:
  - name: victoria-logs-values
    files:
      - values.yaml=values.yaml
secretGenerator:
  - name: victoria-logs-secrets
    files:
      - values.yaml=helm_secrets.yaml
configurations:
  - kustomizeconfig.yaml
