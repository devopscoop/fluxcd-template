apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmui
spec:
  # The private Gateway: monitoring UIs stay off the internet-facing LB — same
  # placement as the metrics vmui (apps/victoria-metrics/vmui-httproute.yaml).
  # Note VictoriaLogs has no built-in auth, and routing / (not just the UI
  # path) also exposes the query and ingest APIs on this hostname — the same
  # tradeoff the metrics vmui route accepts on the private Gateway.
  parentRefs:
    - name: eg-private
      namespace: envoy-gateway-system
      # HTTPS only; plain HTTP on :80 is 301'd by httproute-redirect-private.yaml.
      sectionName: https
  hostnames:
    - vlogs.project1-dev.devops.coop
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # The server Service name is pinned via server.fullnameOverride in
        # values.yaml. The query UI lives under /select/vmui on the same port
        # that serves the query and write APIs.
        - name: victoria-logs-server
          port: 9428
