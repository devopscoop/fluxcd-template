# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: spegel-values
    - kind: Secret
      name: spegel-secrets
  chartRef:
    kind: OCIRepository
    name: spegel-org-spegel
