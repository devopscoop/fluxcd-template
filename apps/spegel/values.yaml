# Run only on Karpenter-launched nodes. Spegel needs containerd to keep
# unpacked layers and to read mirror config from /etc/containerd/certs.d
# alone; on EKS only Karpenter nodes get that, from the spegel block in
# apps/karpenter-custom-resources/ec2nodeclass.yaml. aws-eks-template's
# managed node groups boot the AMI's stock containerd config. The chart
# tolerates every taint, so their taint alone doesn't keep it off them. See
# README.md -> "Why only Karpenter nodes".
# >>> karpenter: deploy.sh uncomments this block when k8s_platform=eks
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#         - matchExpressions:
#             - key: karpenter.sh/nodepool
#               operator: Exists
