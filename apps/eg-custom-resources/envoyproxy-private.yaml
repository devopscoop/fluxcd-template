# eg-private EnvoyProxy — the DEFAULT for Gateways on the `eg` GatewayClass:
# gatewayclass.yaml sets it as the class parametersRef, so any Gateway that
# doesn't attach a different EnvoyProxy stays on this one. On AWS this is the
# internal-scheme NLB (the eks block below); eg-public (envoyproxy-public.yaml)
# is the internet-facing counterpart. On non-AWS platforms the two are
# identical until you express the split with your LB provider's equivalent.
#
# High availability (both schemes): put one Envoy per AZ/node and keep every NLB
# AZ node's IP live in DNS.
#   - replicas: 3 with soft zone + hostname topology spread (maxSkew 1). Envoy
#     Gateway sets no spread by default, and declaring our own DISABLES the
#     kube-scheduler cluster defaults (which cover both zone AND hostname), so
#     both keys are restated here, tightened to maxSkew 1. ScheduleAnyway keeps
#     pods placeable during a zone/node capacity crunch.
#   - matchLabelKeys (owning-gateway-name): scope each constraint to a SINGLE
#     Gateway's pods. Every Gateway on this class runs its own Envoy fleet;
#     without this key the managed-by/name selector spans ALL fleets, so the
#     scheduler accepts a layout that stacks two pods of one fleet on a node,
#     and (where a descheduler runs) RemoveDuplicates evicts and the scheduler
#     re-stacks it every cycle — an endless LB target flap. No-op with a
#     single Gateway, so it is safe to set always. GA on k8s 1.34+.
#   - envoyPDB caps voluntary disruptions (node drains/updates) at one Envoy at
#     a time so a drain can't take the ingress below two replicas.
#   - envoyDeployment.patch repoints the envoy container's probes (startup,
#     readiness, liveness) from Envoy's admin readiness (/ready on 19003) to
#     GET /healthz on 10080 — the same through-the-full-filter-chain check
#     the LB health-check annotations below use. /ready only proves xDS
#     config arrived and listeners are up; it stays green while the filter
#     chain rejects every request — e.g. a fail-closed wasm filter (coraza)
#     whose module fetch from the controller failed, a state that otherwise
#     persists until a pod delete or a config re-push happens to retrigger
#     the fetch. Probing /healthz instead makes such a replica go NotReady
#     (dropping it from endpoints, which also deregisters it from ip-target
#     LBs) and then restarts it via liveness — self-healing instead of an
#     operator page. Only each probe's path/port are patched; counts and
#     timings keep Envoy Gateway's defaults, whose startup probe allows
#     30×10s for the first config and wasm fetch to land before liveness
#     arms. This makes the port-80 listener + healthz route a requirement on
#     EVERY platform, not just EKS where the health-check annotations apply.
#
# The aws-load-balancer-* annotations below are EKS-specific (AWS Load Balancer
# Controller), so they live in eks marker blocks that deploy.sh uncomments only
# when k8s_platform=eks. Non-AWS platforms (k0s/talos + MetalLB) leave them
# commented and get their provider's default LoadBalancer Service.
#   - cross-zone-load-balancing-enabled: an AWS NLB withdraws an AZ node's IP
#     from DNS when that AZ has no healthy target; with a single replica that
#     leaves the NLB publishing one IP and effectively single-AZ. Cross-zone
#     lets every AZ node route to targets in any AZ, so all node IPs stay active
#     and routable regardless of pod placement (bills inter-AZ data transfer).
#   - healthcheck-protocol/port/path: the controller's default NLB health
#     check is a TCP connect on traffic-port, which can't tell "listening"
#     from "serving" — a replica that accepts connections but fails every
#     request (e.g. a wasm filter stuck fail-closed) stays in rotation
#     indefinitely. Probe GET /healthz instead (answered by
#     httproute-healthz-private.yaml through the listener's full filter chain)
#     on 10080, the container port Envoy Gateway maps the port-80 listener to
#     (privileged listener ports get +10000). Health-check annotations apply
#     to every target group of the Service, so the 443 targets are probed on
#     10080 too: one health verdict per replica, exactly what we want for
#     ejecting a broken pod. Every Gateway using an EnvoyProxy with these
#     annotations needs a port-80 http listener and a healthz route — the two
#     shipped Gateways have theirs (httproute-healthz-public.yaml /
#     httproute-healthz-private.yaml); give any Gateway you add its own copy
#     reusing the shared eg-healthz HTTPRouteFilter — otherwise every one of
#     its targets goes unhealthy.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-private
spec:
  ipFamily: IPv6
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 3
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              matchLabelKeys:
                - gateway.envoyproxy.io/owning-gateway-name
              labelSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: envoy-gateway
                  app.kubernetes.io/name: envoy
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              matchLabelKeys:
                - gateway.envoyproxy.io/owning-gateway-name
              labelSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: envoy-gateway
                  app.kubernetes.io/name: envoy
        # Probes through the filter chain instead of admin /ready — rationale
        # in the header. StrategicMerge matches containers by name and merges
        # per-field, so only each probe's httpGet path/port change; every
        # other probe field keeps Envoy Gateway's default.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: envoy
                      startupProbe:
                        httpGet:
                          path: /healthz
                          port: 10080
                      readinessProbe:
                        httpGet:
                          path: /healthz
                          port: 10080
                      livenessProbe:
                        httpGet:
                          path: /healthz
                          port: 10080
      envoyPDB:
        maxUnavailable: 1
