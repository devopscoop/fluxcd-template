# eg-public EnvoyProxy — the internet-facing counterpart to eg-private
# (envoyproxy-private.yaml). It is a STUB: defined and HA-ready, but the
# starting eg-public Gateway (gateway-public.yaml) deliberately does NOT
# reference it, so a fresh cluster comes up private-only. When ready to expose
# it, attach this stub in gateway-public.yaml:
#   spec:
#     infrastructure:
#       parametersRef:
#         group: gateway.envoyproxy.io
#         kind: EnvoyProxy
#         name: eg-public
#
# The HA config (replicas + topology spread + PDB + the probes-through-the-
# filter-chain patch) and the health-check annotations are identical to
# eg-private — see the rationale in envoyproxy-private.yaml. The only
# difference is the load-balancer scheme: internet-facing (the eks block
# below).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-public
spec:
  ipFamily: IPv6
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 3
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              matchLabelKeys:
                - gateway.envoyproxy.io/owning-gateway-name
              labelSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: envoy-gateway
                  app.kubernetes.io/name: envoy
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              matchLabelKeys:
                - gateway.envoyproxy.io/owning-gateway-name
              labelSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: envoy-gateway
                  app.kubernetes.io/name: envoy
        # Probes through the filter chain instead of admin /ready — rationale
        # in envoyproxy-private.yaml. StrategicMerge matches containers by
        # name and merges per-field, so only each probe's httpGet path/port
        # change; every other probe field keeps Envoy Gateway's default.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: envoy
                      startupProbe:
                        httpGet:
                          path: /healthz
                          port: 10080
                      readinessProbe:
                        httpGet:
                          path: /healthz
                          port: 10080
                      livenessProbe:
                        httpGet:
                          path: /healthz
                          port: 10080
      envoyPDB:
        maxUnavailable: 1
