# The class-level parametersRef is the DEFAULT EnvoyProxy for Gateways on
# this class: eg-private, so a Gateway is internal unless it explicitly
# attaches eg-public via spec.infrastructure.parametersRef (which overrides
# this default per Gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: eg-private
    namespace: envoy-gateway-system
