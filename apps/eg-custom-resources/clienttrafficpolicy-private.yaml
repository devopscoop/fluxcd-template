# Same request-body buffer headroom as eg-public (see the rationale in
# clienttrafficpolicy-public.yaml — and its caveat: this is a prerequisite for
# WAF body inspection, not the whole fix; coraza-proxy-wasm 0.6.0 still
# truncates >~16KiB bodies, see the request-body note in
# apps/coraza/README.md). The coraza WAF attaches to eg-private too, which is
# how it broke every Grafana dashboard panel: the browser's /api/ds/query
# bodies exceed the threshold, arrived truncated, and Grafana answered 400
# "unexpected EOF", which reads as "no data" in the UI (ENG-1613).
# A gateway can only carry one ClientTrafficPolicy, so if eg-private ever needs
# more client-facing settings they go in this policy.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: eg-private-buffer-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg-private
  connection:
    bufferLimit: 256Ki

  # Same client-IP detection as eg-public — rationale, and how to refresh the
  # pinned Cloudflare list, in clienttrafficpolicy-public.yaml; keep the two
  # lists identical. Cloudflare can't reach this Gateway's internal NLB, so
  # the trust only matters if it is ever exposed or put behind Cloudflare by
  # mistake; that's the point. Proxy protocol matters here today: without it,
  # every request appears to come from the NLB, not the user.
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32

  # EKS-only and optional for the same reasons as eg-public — see
  # clienttrafficpolicy-public.yaml, including the rollout order (this before
  # the NLB's proxy-protocol annotation).
