# PRIVATE Gateway: supporting/ops services (grafana, prometheus, alertmanager,
# and the like) live here so they never ride an internet-facing LB. It stays
# private via the GatewayClass default EnvoyProxy (eg-private) — unlike
# eg-public (gateway-public.yaml), nothing should ever attach the eg-public
# EnvoyProxy to this Gateway. Like the starting public Gateway it ships with
# just the http listener; add HTTPS listeners per cluster (hostname + TLS,
# typically issued by cert-manager) and restrict allowedRoutes to suit.
#
# The port-80 listener also answers the LB health check via
# httproute-healthz-private.yaml (see the healthcheck notes in envoyproxy-private.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  name: eg-private
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: alertmanager-project1-dev-devops-coop
      hostname: "alertmanager.project1-dev.devops.coop"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: alertmanager-project1-dev-devops-coop-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: prometheus-project1-dev-devops-coop
      hostname: "prometheus.project1-dev.devops.coop"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: prometheus-project1-dev-devops-coop-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: grafana-project1-dev-devops-coop
      hostname: "grafana.project1-dev.devops.coop"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: grafana-project1-dev-devops-coop-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: vmui-project1-dev-devops-coop
      hostname: "vmui.project1-dev.devops.coop"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: vmui-project1-dev-devops-coop-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: vlogs-project1-dev-devops-coop
      hostname: "vlogs.project1-dev.devops.coop"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: vlogs-project1-dev-devops-coop-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: flux-project1-dev-devops-coop
      hostname: "flux.project1-dev.devops.coop"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: flux-project1-dev-devops-coop-tls
      allowedRoutes:
        namespaces:
          from: All
