# PRIVATE Gateway: supporting/ops services (grafana, prometheus, alertmanager,
# and the like) live here so they never ride an internet-facing LB. It stays
# internal via the GatewayClass default EnvoyProxy (eg-private) — unlike
# eg-public (gateway-public.yaml), nothing should ever attach the eg-public
# EnvoyProxy to this Gateway. Like the starting public Gateway it ships with
# just the http listener; add HTTPS listeners per cluster (hostname + TLS,
# typically issued by cert-manager) and restrict allowedRoutes to suit.
#
# The port-80 listener also answers the LB health check via
# httproute-healthz-private.yaml (see the healthcheck notes in envoyproxy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg-private
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
