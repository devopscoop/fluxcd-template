# Catch-all 301 from plain HTTP to HTTPS on the public Gateway's port-80
# listener. App HTTPRoutes must bind to their HTTPS listeners via sectionName
# (see the apps' values.yaml) — a route without sectionName also attaches to
# the http listener and wins over this catch-all on hostname specificity,
# serving the app in cleartext.
#
# Port 80 is otherwise unused: the letsencrypt ClusterIssuer solves via DNS-01
# (Route53), so ACME never depends on inbound HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eg-redirect-http-to-https
spec:
  parentRefs:
    - name: eg-public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
