# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: dragonfly-values
    - kind: Secret
      name: dragonfly-secrets
  chart:
    spec:
      chart: dragonfly
      version: 1.8.7
      sourceRef:
        kind: HelmRepository
        name: dragonfly
