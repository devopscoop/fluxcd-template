# A CloudNativePG PostgreSQL database with barman backups to S3, in three
# documents: the Cluster, the ObjectStore its backups land in, and the daily
# ScheduledBackup. Copied (not scaffolded by a script — copy it by hand) from
# apps/goalert's db-cluster.yaml, the live example of this pattern.
#
# To give an app a database:
#
# 1. Copy this file into apps/<app>/ and replace every "app-template" with
#    the app's name, e.g.:
#      sed -i "s/app-template/myapp/g" apps/myapp/db-cluster.yaml
# 2. Add the file to that app's kustomization.yaml resources, and give the
#    app's Kustomization in flux/flux-system/ dependsOn entries for cnpg and
#    cnpg-barman-plugin.
# 3. Add the database to local.cnpg_databases in aws-eks-template
#    cluster/cnpg-backups.tf ({ <app> = "<app>-db" }); the apply stamps out
#    the S3 bucket and IRSA role, and its outputs carry the bucket name for
#    the ObjectStore's destinationPath and the role ARN for the ACCOUNT_ID
#    placeholder below.
# 4. Review the sizing and comments marked "per app" below: instances,
#    postgres major version, initdb extensions, and resources.
# 5. The eks marker blocks ship commented; the next deploy.sh run opens them
#    when k8s_platform=eks.
#
# Connecting a psql or GUI client: runbooks/connect-cnpg-database.md.
# Restoring from backup: runbooks/restore-cnpg-database.md.
#
# CNPG auto-creates an `app-template-db-app` Secret (`<cluster>-app`) for the
# owner of the database below; its `uri` key is a ready-made libpq connection
# string pointing at the read-write Service (app-template-db-rw) — feed that
# key to the app instead of hand-assembling credentials.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-template-db
spec:
  # One primary + two streaming replicas, CNPG's standard HA shape. Three
  # matters, not just two: CNPG always creates a PDB requiring the primary to
  # stay available, so a single-instance cluster blocks node drains outright
  # ("Cannot evict pod as it would violate the pod's disruption budget",
  # retrying forever). With replicas the operator instead switches the
  # primary over ahead of the drain, and at 3+ instances the replica PDB
  # (minAvailable: instances - 2) releases one replica at a time — a standby
  # exists to fail over to even mid-drain, which 2 instances can't guarantee.
  # Replication is async (CNPG default); clients connect through the -rw
  # Service, so switchovers are invisible to them.
  instances: 3
  # A database must not ride Karpenter capacity: consolidation and drift
  # drains force a switchover whenever the bin-packer rearranges nodes (the
  # operator switches the primary over as soon as its node is cordoned, so
  # the primary PDB never gets to object). The affinity pins the instances to
  # managed-node-group nodes — `Exists` on the label survives node-group
  # renames and blue/green rotations — and the toleration matches the
  # CriticalAddonsOnly taint that reserves those nodes for scheduling-critical
  # workloads (see the managed node group in aws-eks-template).
# >>> karpenter: deploy.sh uncomments this block when k8s_platform=eks
#   affinity:
#     nodeAffinity:
#       requiredDuringSchedulingIgnoredDuringExecution:
#         nodeSelectorTerms:
#           - matchExpressions:
#               - key: eks.amazonaws.com/nodegroup
#                 operator: Exists
#     tolerations:
#       - key: CriticalAddonsOnly
#         operator: Exists
# <<< karpenter
  # Per app: pin the postgres major deliberately to one your app supports,
  # and bump it alongside app upgrades. The template tracks PostgreSQL 18 —
  # what this repo's CNPG operator (1.28) defaults new clusters to, and the
  # first major with native OAuth support — but drop to an older major when
  # the app's test matrix demands it (goalert stays on 17: its v0.34 tested
  # against 13-17 only).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: app-template
      owner: app-template
      # Per app: extensions. Trusted extensions (pgcrypto, uuid-ossp, ...)
      # can be created by the non-superuser owner above — apps that run
      # CREATE EXTENSION IF NOT EXISTS in their own migrations need nothing
      # here. Anything untrusted needs postInitSQL.
  storage:
    size: 1Gi
  # On EKS these volumes opt out of the DLM snapshot policy: barman owns this
  # database's backups (the ObjectStore below), so daily EBS snapshots would
  # be redundant spend — and a crash-consistent snapshot of one replica's
  # volume is a restore footgun next to barman's point-in-time recovery.
  # The DLM policy in aws-eks-template (cluster/dlm.tf) only snapshots
  # volumes tagged Backup=dlm (applied by the default gp3 class);
  # gp3-dangerous (apps/eks-storage-classes) tags them Backup=none instead.
  # Tags apply at provision time only, so volumes that predate the Backup
  # tag are already out of the policy — hand-tag them Backup=none anyway so
  # they read as deliberate, not unaccounted for.
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#     storageClass: gp3-dangerous
# <<< eks
  # Separate WAL volume, so a WAL burst fills this volume instead of the data
  # volume, and WAL I/O is isolated from table I/O. The failure mode is real
  # (a fork's production database, 2026-09-05): a nightly batch job wrote WAL
  # faster than the archiver shipped segments to S3, and WAL that isn't
  # archived can't be recycled — the WAL volume filled, Postgres PANICked,
  # and the cluster failed over. Per app: size for the largest plausible
  # burst as backlog (see also wal.maxParallel on the ObjectStore below,
  # which attacks the same problem from the throughput side); ships at the
  # template-minimal 1Gi. walStorage is one-way: it can be added to a running
  # cluster, but never removed.
  walStorage:
    size: 1Gi
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#     storageClass: gp3-dangerous
# <<< eks
  # Continuous WAL archiving + base backups through the Barman Cloud Plugin
  # (apps/cnpg-barman-plugin). The bucket, retention, and sidecar tuning live
  # in the ObjectStore below; the daily cadence in the ScheduledBackup at the
  # bottom of this file.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: app-template-db
  # Per app: memory req=limit, no CPU limit, then resize with krr after some
  # real usage. 512Mi is the floor goalert-db landed on after 256Mi was
  # OOMKilled repeatedly in its first half hour.
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      memory: 512Mi
  # Deliberately no monitoring block. On the victoria-metrics stack, the
  # fleet-wide cnpg-instances VMPodScrape in
  # apps/victoria-metrics-custom-resources scrapes every pod labeled
  # cnpg.io/podRole=instance, so databases are collected with no per-app
  # config. Don't set monitoring.enablePodMonitor: it would duplicate that
  # scrape (every cnpg_* series stored twice under a second job label), and
  # the field is deprecated upstream ("will be removed in a future version of
  # the operator"). On the kube-prometheus-stack alternative, create a
  # PodMonitor manually — the deprecation notice recommends exactly that.
  # IRSA: the instance pods run as the app-template-db ServiceAccount (CNPG
  # names it after the Cluster), and this annotation lets their barman-cloud
  # sidecars reach the backup bucket. Role and bucket come from
  # aws-eks-template cluster/cnpg-backups.tf (see the cnpg_db_role_arns
  # output).
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#   serviceAccountTemplate:
#     metadata:
#       annotations:
#         eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/app-template-db"
# <<< eks
  # Developer SSO straight into Postgres: PostgreSQL 18's native OAuth
  # (SASL OAUTHBEARER) against the optional dex app (apps/dex). psql runs
  # dex's device flow — the public `psql` staticClient in
  # apps/dex/helm_secrets.yaml — and the server validates the resulting JWT
  # through a validator library, mapping the email claim to a per-developer
  # role: no passwords, no shared credentials, and offboarding rides the
  # upstream IdP. Deliberately a separate marker from `dex` (web SSO),
  # because this side has hard prerequisites:
  #   - Postgres ships NO validator. The reference below is devopscoop's
  #     build of Percona-Lab's pg_oidc_validator (JWT/JWKS-based), from
  #     github.com/devopscoop/pg-oidc-validator-image (which also documents
  #     building your own). When enabling, pin it to one of that repo's
  #     dated tags so upgrades stay deliberate git changes.
  #   - Image-volume extensions need Kubernetes 1.35+ (1.33/1.34 only with
  #     the ImageVolume feature gate) and a containerd 2.1+ runtime.
  #   - Clients need psql 18 with libpq built against libcurl: Debian/Ubuntu
  #     PGDG ship it as the libpq-oauth package; Homebrew's builds lack it.
  #   - Validator libraries are young. The oauth hba rule below is scoped to
  #     the developers group, so apps and break-glass access stay on CNPG's
  #     default scram catch-all (appended after these rules).
  # The issuer must equal config.issuer in apps/dex/values.yaml byte-for-byte
  # and be reachable from the instance pods (discovery + JWKS fetch). Then:
  #   psql "host=<endpoint> dbname=app-template user=alice \
  #     oauth_issuer=https://dex.project1-dev.devops.coop oauth_client_id=psql"
  # prints a URL and code; the developer approves in the browser via the
  # upstream IdP and lands in their own audited role.
# >>> pg-oauth: NOT auto-enabled — enable per adoption after building a validator image (see apps/dex/README.md)
#   postgresql:
#     extensions:
#       - name: pg-oidc-validator
#         image:
#           reference: ghcr.io/devopscoop/pg-oidc-validator:18-trixie
#         # system/ in the image carries libcurl and its dependency chain:
#         # the validator links libcurl, and the postgres image ships none.
#         ld_library_path:
#           - system
#     parameters:
#       oauth_validator_libraries: "pg_oidc_validator"
#       pg_oidc_validator.authn_field: "email"
#     pg_hba:
#       # scope="" disables pg_oidc_validator's scope check — dex doesn't
#       # write a scope claim into its tokens (validator README, Dex
#       # section); the hba option is mandatory but may be empty.
#       - hostssl all +developers all oauth issuer="https://dex.project1-dev.devops.coop" scope="" map=oidc
#     pg_ident:
#       # Workspace email -> the role named after its local part
#       # (alice@example.com logs in as alice; the role must exist below).
#       - oidc /^(.*)@example\.com$ \1
#   managed:
#     roles:
#       # The group the oauth hba rule matches. Grant it what developers may
#       # do — pg_read_all_data is read-only everywhere; note tables behind
#       # row-level security additionally need bypassrls on the login roles
#       # to be readable, a per-app data-access decision.
#       - name: developers
#         ensure: present
#         login: false
#         inRoles:
#           - pg_read_all_data
#       # One login role per human, named after the email local part.
#       - name: alice
#         ensure: present
#         login: true
#         inRoles:
#           - developers
# <<< pg-oauth
---
# Where app-template-db's backups live. The Barman Cloud Plugin (apps/
# cnpg-barman-plugin — this app's flux Kustomization dependsOn it) reads this
# ObjectStore and runs a barman-cloud sidecar in each instance pod that ships
# WAL segments continuously and base backups on the ScheduledBackup's cadence
# (next document).
#
# Bucket and IAM role come from aws-eks-template (cluster/cnpg-backups.tf,
# keyed by app under local.cnpg_databases — adding a database there stamps
# out its bucket and role, with optional cross-region replication);
# authentication is IRSA (inheritFromIAMRole) via the serviceAccountTemplate
# annotation on the Cluster above, so no credentials Secret is needed. On a
# non-AWS platform, point destinationPath at an S3-compatible store and
# supply credentials via a Secret referenced from s3Credentials instead.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: app-template-db
spec:
  configuration:
    destinationPath: s3://devopscoop-project1-dev-app-template-db-backups/
    s3Credentials:
      inheritFromIAMRole: true
    wal:
      compression: gzip
      # Ship up to 8 WAL segments per archiver invocation. Archive throughput
      # is what keeps the WAL volume's backlog bounded (WAL that isn't
      # archived can't be recycled), and single-segment uploads have already
      # lost that race once — see the walStorage comment on the Cluster
      # above.
      maxParallel: 8
    data:
      compression: gzip
  # Recovery-window retention: barman keeps enough base backups and WAL to
  # restore to any point in the last 30 days, and deletes obsolete objects
  # itself after each successful backup — which is why the bucket has no
  # object-expiration lifecycle rule of its own.
  retentionPolicy: "30d"
  instanceSidecarConfiguration:
    # Memory req=limit, no CPU limit, same as the postgres containers in the
    # Cluster above. The sidecar only streams compressed WAL and backup data,
    # so 128Mi suits a small dataset — but base backups of a multi-GB
    # database OOMKill it mid-stream at this size (the Backup fails with
    # "rpc error ... EOF"); the first fork database with real data needed
    # 512Mi. Per app: raise it with the dataset.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
---
# Daily base backup of app-template-db, on top of the continuous WAL
# archiving the Barman Cloud Plugin does regardless (the ObjectStore above) —
# together they give point-in-time recovery anywhere inside the retention
# window, not just nightly snapshots.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: app-template-db-daily
spec:
  cluster:
    name: app-template-db
  # CNPG's cron format has a leading seconds field: daily at 04:00 UTC.
  schedule: "0 0 4 * * *"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # Take the first backup as soon as this resource lands instead of waiting
  # up to a day — it's what seeds the object store on a fresh bootstrap.
  immediate: true
  # Backup objects get an ownerReference to this ScheduledBackup, so deleting
  # it garbage-collects the Backup resources (the S3 data stays; barman's
  # retention policy owns that).
  backupOwnerReference: self
