# Developer access for psql-oauth.sh (runbooks/connect-cnpg-database.md,
# option 4). Copy this file alongside db-cluster.yaml when enabling the
# pg-oauth block and add it to the app's kustomization.yaml resources.
#
# The OAuth login path needs two things read-only SSO roles (the
# cluster-viewers group, bound to the aggregated `view` ClusterRole in
# apps/cluster-viewers) don't have:
#   - get on the Cluster CR: psql-oauth.sh reads the oauth issuer from
#     .spec.postgresql.pg_hba and validates the role name against
#     .spec.managed.roles — no secrets in either;
#   - a port-forward to the database: `view` has no create on
#     pods/portforward (it's a write verb by design), and kubectl resolves
#     svc/<app>-db-rw to a pod first, which takes get on services and
#     get/list on pods.
# Namespace-scoped on purpose: this only opens a network path to THIS
# namespace's pods — i.e. the database — and Postgres still authenticates
# every connection (oauth for developers, scram for the apps). Bound to the
# cluster-viewers group like apps/cluster-viewers, so access rides the same
# SSO permission sets and offboards with them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-developer-access
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-developer-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: db-developer-access
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: cluster-viewers
