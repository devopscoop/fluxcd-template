# The private Gateway, deliberately: Dex fronts workforce SSO for cluster
# services, so like the rest of the ops plane it never rides an
# internet-facing LB — users log in from inside the network (or VPN), and
# the upstream IdP's browser hop happens on the user's machine, not here.
# The issuer must still be reachable from cluster pods at this same
# hostname: token validators fetch the OIDC discovery document and JWKS
# from config.issuer verbatim.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
spec:
  parentRefs:
    - name: eg-private
      namespace: envoy-gateway-system
      # Bind to the HTTPS listener only. Without sectionName this route also
      # attaches to the port-80 listener and beats the catch-all redirect in
      # httproute-redirect-private.yaml on hostname specificity, serving
      # tokens in cleartext.
      sectionName: https
  hostnames:
    - dex.project1-dev.devops.coop
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dex
          port: 5556
