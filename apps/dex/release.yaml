# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: dex-values
    - kind: Secret
      name: dex-secrets
  chart:
    spec:
      chart: dex
      version: 0.24.1
      sourceRef:
        kind: HelmRepository
        name: dex
