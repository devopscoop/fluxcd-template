# Enforcing Coraza WAF for the eg-private Gateway — the supporting/ops services
# (grafana, prometheus, alertmanager, ...) that never ride an internet-facing
# LB. Same enforcing engine as the public policy (SecRuleEngine On → 403, in
# envoyextensionpolicy-public.yaml); a separate policy because it targets a
# different Gateway and, deliberately, fails OPEN:
#   - failOpen TRUE (public is failOpen:false). If the coraza wasm fails to load
#     or crashes, eg-private passes traffic rather than 5xx-ing, so a WAF glitch
#     cannot take down the internal ops/alerting UIs — the tools you need MOST
#     during an incident. This is VPN-only, defense-in-depth traffic, so
#     availability wins over failing closed here; the internet-facing public
#     policy makes the opposite trade.
#   - Enforcing at CRS paranoia level 1 will 403 real requests that trip a rule.
#     Ops UIs are the most false-positive-prone surface (Grafana dashboard JSON,
#     Prometheus/Flux query strings), so watch the logs after enabling and add
#     per-rule/per-host exclusions as needed (see README.md).
#
# Everything else (pinned wasm image, SecResponseBodyAccess Off, the /healthz
# 920350 exclusion) matches the public policy — see the comments there.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: coraza-private
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg-private
  wasm:
    - name: coraza
      # failOpen true: keep the internal ops UIs up if the wasm fails. See header.
      failOpen: true
      code:
        type: Image
        image:
          url: ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
      config:
        directives_map:
          default:
            - Include @recommended-conf
            - SecResponseBodyAccess Off
            - SecRuleEngine On
            - Include @crs-setup-conf
            # /healthz is health-checked by IP, tripping CRS 920350 on every
            # probe — dropped here exactly as in the public policy.
            - 'SecRule REQUEST_URI "@beginsWith /healthz" "id:10001,phase:1,pass,nolog,ctl:ruleRemoveById=920350"'
            - Include @owasp_crs/*.conf
        default_directives: default
