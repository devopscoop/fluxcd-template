# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: tempo-values
    - kind: Secret
      name: tempo-secrets
  chart:
    spec:
      chart: tempo
      version: 2.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
