# "Tempo (single binary)" — ingest rate, API latency by route, S3 backend
# latency, blocklist/compaction/flush health, and the metrics-generator's
# remote-write into vmsingle — fed by vmservicescrape.yaml next to this file.
# Provisioned by the stack's Grafana sidecar (grafana_dashboard=1, any
# namespace).
#
# Hand-built for this repo's monolithic deployment rather than vendored: the
# tempo-mixin dashboards (tempo-operational.json and friends at the chart's
# appVersion tag) hardcode Grafana Labs' distributed-mode job naming
# (job="<namespace>/ingester" etc.) and a multi-cluster "cluster" label,
# neither of which exists here — every panel would need rewriting, which is
# worse provenance than owning a small dashboard outright. Panels use only
# metric names verified against tempo v2.10.8 and this config; the alert-side
# counterparts live in vmrule.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-dashboard
  labels:
    grafana_dashboard: "1"
data:
  tempo.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Spans received /s",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(tempo_distributor_spans_received_total[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "received"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(tempo_receiver_refused_spans[$__rate_interval]))",
              "refId": "B",
              "legendFormat": "refused at receiver"
            }
          ],
          "description": "Refused at the OTLP receiver means the collector was told no and will retry or drop."
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Bytes received /s",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(tempo_distributor_bytes_received_total[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "ingest"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "API request rate by route",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (route) (rate(tempo_request_duration_seconds_count[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "API p99 latency by route",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (route, le) (rate(tempo_request_duration_seconds_bucket[$__rate_interval])))",
              "refId": "A",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "API 5xx ratio",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(tempo_request_duration_seconds_count{status_code=~\"5..\"}[$__rate_interval])) / sum(rate(tempo_request_duration_seconds_count[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "5xx ratio"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Backend (S3) p99 latency by operation",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (operation, le) (rate(tempodb_backend_request_duration_seconds_bucket[$__rate_interval])))",
              "refId": "A",
              "legendFormat": "{{operation}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Blocklist length / outstanding compactions",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(tempodb_blocklist_length)",
              "refId": "A",
              "legendFormat": "blocklist length"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(tempodb_compaction_outstanding_blocks)",
              "refId": "B",
              "legendFormat": "outstanding compaction blocks"
            }
          ],
          "description": "Outstanding blocks growing without bound means compaction is not keeping up \u2014 see TempoCompactionsFailing in vmrule.yaml."
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Flush / compaction errors (1h increase)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "increase(tempo_ingester_failed_flushes_total[1h])",
              "refId": "A",
              "legendFormat": "failed flushes"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "increase(tempo_ingester_flush_failed_retries_total[1h])",
              "refId": "B",
              "legendFormat": "failed flush retries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "increase(tempodb_compaction_errors_total[1h])",
              "refId": "C",
              "legendFormat": "compaction errors"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "increase(tempodb_blocklist_poll_errors_total[1h])",
              "refId": "D",
              "legendFormat": "blocklist poll errors"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Metrics generator: spans in / discarded /s",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(tempo_metrics_generator_spans_received_total[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "received"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(tempo_metrics_generator_spans_discarded_total[$__rate_interval]))",
              "refId": "B",
              "legendFormat": "discarded"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(tempo_distributor_metrics_generator_pushes_failures_total[$__rate_interval]))",
              "refId": "C",
              "legendFormat": "push failures"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Generator remote-write to vmsingle /s",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(prometheus_remote_storage_samples_total{namespace=\"tempo\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "sent"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(prometheus_remote_storage_samples_failed_total{namespace=\"tempo\"}[$__rate_interval]))",
              "refId": "B",
              "legendFormat": "failed (lost)"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(prometheus_remote_storage_samples_retried_total{namespace=\"tempo\"}[$__rate_interval]))",
              "refId": "C",
              "legendFormat": "retried"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Generator remote-write lag",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(prometheus_remote_storage_highest_timestamp_in_seconds{namespace=\"tempo\"} - ignoring (remote_name, url) prometheus_remote_storage_queue_highest_sent_timestamp_seconds{namespace=\"tempo\"})",
              "refId": "A",
              "legendFormat": "ingest-to-sent lag"
            }
          ],
          "description": "Over ~120s sustained pages via TempoGeneratorRemoteWriteLagging."
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Process CPU / memory",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 40
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(process_cpu_seconds_total{namespace=\"tempo\", pod=~\"tempo-.*\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "CPU cores"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(process_resident_memory_bytes{namespace=\"tempo\", pod=~\"tempo-.*\"})",
              "refId": "B",
              "legendFormat": "RSS bytes"
            }
          ]
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "tempo",
        "tracing"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Data source",
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "",
      "title": "Tempo (single binary)",
      "uid": "tempo-single-binary",
      "version": 1
    }
