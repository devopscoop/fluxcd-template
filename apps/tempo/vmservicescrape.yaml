# Scrape Tempo's own metrics (ingest rate, generator remote-write health,
# query latency, ...) from the tempo-prom-metrics port (:3200 — Tempo serves
# /metrics on the same port as its query API).
#
# The chart only offers a prometheus-operator ServiceMonitor, but this stack
# deliberately does not install the monitoring.coreos.com CRDs (see
# apps/victoria-metrics/README.md → "CRD ownership"), so
# enabling it would fail to apply on a pure VictoriaMetrics cluster. Instead,
# scrape natively with the VictoriaMetrics operator's own CRD. The selector
# uses only the stable instance labels — the chart's own ServiceMonitor
# selects on helm.sh/chart: tempo-<version>, which silently stops matching on
# every chart bump. VMServiceScrape is an operator.victoriametrics.com CRD,
# so victoria-metrics must land first — the flux Kustomization's dependsOn
# enforces that ordering.
#
# Since chart 2.4.0 the StatefulSet's tempo-headless Service carries the same
# instance labels and the same tempo-prom-metrics port; matching it too
# would scrape the pod twice (job=tempo and job=tempo-headless) and double
# every sum() in vmrule.yaml and dashboard.yaml. The chart labels it
# prometheus.io/service-monitor: "false" and its own ServiceMonitor excludes
# that label, so mirror the exclusion.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tempo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/instance: tempo
    matchExpressions:
      - key: prometheus.io/service-monitor
        operator: NotIn
        values:
          - "false"
  endpoints:
    - port: tempo-prom-metrics
