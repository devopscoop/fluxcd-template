# Only the chart values this app overrides. See README.md for setup.

cronjob:
  # Hourly, on the hour. The chart's default is once a day at 01:00 UTC. A box
  # ticked on a repo's dependency dashboard is acted on by the next run.
  # README.md shows how to start a run by hand.
  schedule: "0 * * * *"
  # Scheduled runs never overlap because of activeDeadlineSeconds. This
  # skips the scheduled run when a run started by hand is still going.
  concurrencyPolicy: Forbid
  # The installation token below expires after one hour, so a run must end
  # before it does. The deadline also covers the Job's retries.
  activeDeadlineSeconds: 3300
  # Renovate authenticates with a GitHub App installation token, which it
  # cannot mint from the app's private key. This container mints one per run,
  # so the private key never reaches the Renovate container, which runs
  # package-manager commands from the repos it updates.
  initContainers:
    - name: github-app-token
      # Keep at the chart's appVersion.
      image: ghcr.io/renovatebot/renovate:44.138.0
      # Signs a short-lived JWT with the app's private key and exchanges it
      # for an installation token. Any GitHub error fails the Job.
      command:
        - node
        - --input-type=module
        - -e
        - |
          import { sign } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const jwt = b64({ alg: "RS256", typ: "JWT" }) + "." +
            b64({ iat: now - 60, exp: now + 540, iss: process.env.GITHUB_APP_ID });
          const sig = sign("sha256", Buffer.from(jwt), readFileSync("/github-app/private-key"));
          const url = `https://api.github.com/app/installations/${process.env.GITHUB_APP_INSTALLATION_ID}/access_tokens`;
          const res = await fetch(url, {
            method: "POST",
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${jwt}.${sig.toString("base64url")}`,
              "X-GitHub-Api-Version": "2022-11-28",
            },
          });
          if (!res.ok) {
            console.error(`GitHub returned ${res.status} minting the installation token: ${await res.text()}`);
            process.exit(1);
          }
          writeFileSync("/run/renovate/token", (await res.json()).token, { mode: 0o600 });
      env:
        # The App ID is on the GitHub App's General settings page.
        - name: GITHUB_APP_ID
          value: "000000"
        # The number at the end of the app's installation URL:
        # https://github.com/organizations/<org>/settings/installations/<id>
        - name: GITHUB_APP_INSTALLATION_ID
          value: "00000000"
      # Reads the private key and writes the token where Renovate reads it.
      volumeMounts:
        - name: github-app
          mountPath: /github-app
          readOnly: true
        - name: token
          mountPath: /run/renovate
      # One HTTPS request needs little.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
  # Hands the minted token to Renovate.
  preCommand: |
    RENOVATE_TOKEN="$(cat /run/renovate/token)"
    export RENOVATE_TOKEN

renovate:
  # Global config. Repo-level options belong in each repo's renovate.json.
  # autodiscover covers every repo the GitHub App is installed on, so the
  # app's installation settings choose the repos. repositoryCache and
  # persistRepoData keep each repo's cache and clone on the cache volume, so
  # later runs fetch less. onboardingConfig gives each new repo a
  # dashboard-only renovate.json that assigns each PR to the CODEOWNERS of
  # the files it changes. config:recommended already turns on the dashboard.
  # lockFileMaintenance offers a weekly refresh of every lock file, by
  # default before 04:00 UTC on Mondays. minimumReleaseAge holds each update
  # until the release is 3 days old, as Renovate's security presets do, so a
  # malicious or pulled release is likely caught first. An update whose
  # registry gives no release date is held until the option is removed.
  # Security fixes skip the wait and dashboard approval. Besides GitHub's
  # alerts, osvVulnerabilityAlerts (experimental) finds them in osv.dev's
  # database, kept on the cache volume (see env below). pinDigests pins
  # container images and GitHub Actions to digests, so a moved tag can't
  # change what runs.
  config: |
    {
      "platform": "github",
      "autodiscover": true,
      "repositoryCache": "enabled",
      "persistRepoData": true,
      "onboardingConfig": {
        "$schema": "https://docs.renovatebot.com/renovate-schema.json",
        "extends": ["config:recommended"],
        "dependencyDashboardApproval": true,
        "assigneesFromCodeOwners": true,
        "lockFileMaintenance": { "enabled": true },
        "minimumReleaseAge": "3 days",
        "osvVulnerabilityAlerts": true,
        "pinDigests": true
      }
    }
  persistence:
    cache:
      # Keeps Renovate's cache and repo clones between runs.
      enabled: true
      # Go module and package caches for a large repo outgrow the chart's
      # 512Mi, and the osv.dev database below takes about 640Mi more.
      storageSize: 2Gi

# osvVulnerabilityAlerts downloads osv.dev's database (75 MiB, 561 MiB
# unpacked) to /tmp/osv-offline by default, outside the cache volume, so every
# run would download it again. On the volume, a run downloads it only when the
# kept copy is a day old.
env:
  OSV_OFFLINE_ROOT_DIR: /tmp/renovate/osv-offline

# The image runs as uid 12021. fsGroup makes the cache volume writable for it.
securityContext:
  fsGroup: 12021

extraVolumes:
  # The app's private key. Only the init container mounts it.
  - name: github-app
    secret:
      secretName: renovate-github-app # pragma: allowlist secret — the Secret's name, not a value
      items:
        - key: private-key
          path: private-key
  # In memory, so the token never reaches disk. The init container writes it.
  - name: token
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi

# Renovate only reads the token.
extraVolumeMounts:
  - name: token
    mountPath: /run/renovate
    readOnly: true

# Renovate's memory grows with the size of the repos it scans. No CPU limit,
# so a run is never throttled.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi
