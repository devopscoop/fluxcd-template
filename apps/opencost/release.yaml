# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencost
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: opencost-values
    - kind: Secret
      name: opencost-secrets
  chart:
    spec:
      chart: opencost
      version: 2.5.30
      sourceRef:
        kind: HelmRepository
        name: opencost
