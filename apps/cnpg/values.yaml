# dyff between <(yq . <(helm show values cnpg/cloudnative-pg --version 0.27.1)) <(yq eval '. * load("values.yaml")' <(helm show values cnpg/cloudnative-pg --version 0.27.1))
# vim -O <(helm show values cnpg/cloudnative-pg --version 0.27.1) values.yaml

resources:
  limits:
    memory: 129Mi
  requests:
    cpu: 10m
    memory: 129Mi

# No monitoring.grafanaDashboard.create here: it drops the dashboard
# ConfigMap into this namespace, where no Grafana sidecar looks (each stack's
# sidecar only loads ConfigMaps from its own namespace). The dashboard is
# vendored with the stack instead — apps/victoria-metrics/cnpg-dashboard.yaml,
# which also explains why it isn't chart-managed — and scraping is the
# cnpg-*vmpodscrape.yaml pair in apps/victoria-metrics-custom-resources.
