# dyff between <(yq . <(helm show values cnpg/cloudnative-pg --version 0.27.1)) <(yq eval '. * load("values.yaml")' <(helm show values cnpg/cloudnative-pg --version 0.27.1))
# vim -O <(helm show values cnpg/cloudnative-pg --version 0.27.1) values.yaml

resources:
  limits:
    memory: 129Mi
  requests:
    cpu: 10m
    memory: 129Mi

monitoring:
  # Package the official Grafana dashboard as a grafana_dashboard=1 ConfigMap
  # in this namespace; the Grafana dashboard sidecar in apps/victoria-metrics
  # runs with searchNamespace: ALL, so it's loaded from here and tracks this
  # chart's pin. The metrics behind it come from the cnpg-instances
  # VMPodScrape in apps/victoria-metrics-custom-resources — not the chart's
  # podMonitorEnabled, whose monitoring.coreos.com CRDs are not installed
  # here (see the CRD-ownership note in apps/victoria-metrics/README.md).
  grafanaDashboard:
    create: true
