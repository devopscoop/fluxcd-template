# dyff between <(yq . <(helm show values harbor --repo https://helm.goharbor.io --version 1.19.4)) <(yq eval '. * load("values.yaml")' <(helm show values harbor --repo https://helm.goharbor.io --version 1.19.4))
# vim -O <(helm show values harbor --repo https://helm.goharbor.io --version 1.19.4) values.yaml

# Gateway API, natively: expose.type "route" renders one HTTPRoute
# (harbor-route) that sends /api/, /service/, /v2/, and /c/ to harbor-core and
# everything else to harbor-portal — the same path split the chart's Ingress
# makes, with no nginx Deployment in front (the chart only adds nginx for the
# clusterIP/nodePort/loadBalancer types). TLS terminates at eg-private's
# wildcard listener, so expose.tls is off; externalURL still says https,
# because it is what Harbor hands clients as the token-service realm and
# prints in the UI's pull commands.
#
# eg-private, not eg-public: pushes come from CI and humans on the VPN, pulls
# from the nodes inside the VPC, and nothing outside needs the registry.
# Large blobs outlive Envoy's default 15s route timeout, which
# backendtrafficpolicy.yaml lifts for this route.
expose:
  type: route
  tls:
    enabled: false
  route:
    parentRefs:
      - name: eg-private
        namespace: envoy-gateway-system
        # Bind to the HTTPS listener only. Without sectionName the route also
        # attaches to the port-80 listener and beats the catch-all redirect
        # in httproute-redirect-private.yaml on hostname specificity, serving
        # the registry in cleartext.
        sectionName: https
    hosts:
      - harbor.project1-dev.devops.coop
externalURL: https://harbor.project1-dev.devops.coop

# Image blobs live in object storage, never on a volume: shared storage is
# what lets the registry run two replicas (below) in different zones and
# replace them with rolling updates (the chart's default, so no
# updateStrategy here), with no volume to detach, reattach, or fill. With
# redirects on (the chart default, disableredirect: false), a pull's blob GET
# is answered with a presigned URL and the node downloads the bytes from the
# bucket directly; pushes still stream through the registry.
#
# On EKS the bucket is S3, from aws-eks-template's cluster/harbor.tf
# (enable_harbor = true); replace_placeholders.sh fills in its org and
# cluster names and the region from variables.sh. There are no access keys
# here: the registry reads short-lived ones from a file that the
# aws-credentials sidecar (registry below) refreshes from the pod's IRSA
# role. Other platforms have no object
# store wired in yet, so Harbor runs on EKS only (README.md → "Storage and
# availability").
persistence:
  imageChartStorage:
    type: s3
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#     s3:
#       region: us-east-2
#       bucket: devopscoop-project1-dev-harbor-registry
# <<< eks
  persistentVolumeClaim:
    # The Redis-protocol cache and jobservice queue (redis below). Losing it
    # loses queued jobs and cached manifests, nothing that isn't rebuilt, so
    # it stays out of the DLM policy.
    redis:
      size: 1Gi
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#       storageClass: gp3-dangerous
# <<< eks
    # Trivy's vulnerability database cache, re-downloaded on demand — same
    # reasoning as redis. The chart's 5Gi default: the Trivy DB plus the
    # Java index together run a little over 1Gi and grow.
    trivy:
      size: 5Gi
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#       storageClass: gp3-dangerous
# <<< eks

# Serves core's, registry's, and jobservice's own metrics on :8001 and runs
# harbor-exporter (component health, project and quota stats, job queues).
# vm.yaml scrapes them all; the chart's ServiceMonitor stays off because the
# monitoring.coreos.com CRDs are deliberately absent here
# (apps/victoria-metrics/README.md → "CRD ownership").
metrics:
  enabled: true

# The CloudNativePG cluster in db-cluster.yaml. Harbor logs in as its owner
# role with the password CNPG generates into the harbor-db-app Secret, under
# the key "password" that existingSecret expects. It's the one app database
# in this repo that uses a password: the template's client-certificate
# login would need the cert files mounted into core, jobservice, and
# exporter, and the chart has no setting for extra volumes. That would take
# postRenderers patches, and this repo configures charts through values
# only. db-cluster.yaml's pg_hba accepts the password only over TLS.
#
# require encrypts the connection but doesn't verify the server:
# verify-full needs the operator's CA as a file (PGSSLROOTCERT), which has
# the same mounting problem. The connection stays inside the cluster, to
# the -rw Service. Harbor splices the password unquoted into a
# keyword/value connection string, so a hand-rotated password must contain
# no spaces or quotes.
database:
  type: external
  external:
    host: harbor-db-rw.harbor.svc.cluster.local
    port: "5432"
    username: harbor
    coreDatabase: harbor
    existingSecret: harbor-db-app # pragma: allowlist secret — the Secret's name, not a value
    sslmode: require
  # Connection pools per pod, and four pods hold them (core's two replicas,
  # jobservice, exporter). The chart's 900/100 assume Harbor's bundled
  # Postgres at max_connections 1024; CNPG's default is 100, so 4 × 20 stays
  # under it with room for replication and the operator. Revisit before
  # adding replicas.
  maxOpenConns: 20
  maxIdleConns: 5

# The chart's own single-pod Redis (a Valkey build, goharbor/valkey-photon),
# not this repo's valkey-operator: its ValkeyCluster is Redis Cluster mode,
# and Harbor speaks standalone or Sentinel only. Harbor uses Redis as a
# cache, for UI sessions, and as jobservice's queue — nothing durable. It
# stays a single pod while core, portal, and the registry run two: README.md
# → "Storage and availability" has what an outage of it stops (new
# harbor-core pods, chiefly) and what keeps working.
redis:
  internal:
    # Memory req=limit, no CPU limit (as for every component below); resize
    # with krr after some real usage.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
# >>> karpenter: deploy.sh uncomments this block when k8s_platform=eks
#     nodeSelector:
#       karpenter.sh/capacity-type: on-demand
# <<< karpenter

# core, portal, and the registry, which every push and pull goes through,
# run two replicas each: one per node and spread across zones, with a
# PodDisruptionBudget so a node drain can't take both. The spread follows
# the eg EnvoyProxy rules (apps/eg-custom-resources/envoyproxy-private.yaml
# has the reasoning). hostname is DoNotSchedule, so Karpenter consolidation
# can't stack both replicas on one node; zone is ScheduleAnyway, so a zone
# without capacity doesn't block scheduling. The chart adds each
# component's labelSelector, and pod-template-hash scopes the spread to one
# ReplicaSet, so a rolling update spreads the new pods instead of counting
# the old ones. jobservice, Trivy, and the exporter stay single: none is on
# the pull path, and their work waits out a restart.
#
# On EKS every component is pinned to on-demand capacity (the karpenter
# blocks), per the NodePool contract in
# apps/karpenter-custom-resources/nodepool.yaml, the replicated ones
# included.
core:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 256Mi
# >>> karpenter: deploy.sh uncomments this block when k8s_platform=eks
#   nodeSelector:
#     karpenter.sh/capacity-type: on-demand
# <<< karpenter
# >>> ecr-proxy: ./toggle_blocks.sh --enable ecr-proxy to cache this account's private ECR (EKS only; README.md)
## harbor-core makes the pull-through cache's upstream fetches, so it runs
## as serviceaccount-core.yaml's ServiceAccount, whose IRSA role can pull
## this account's private ECR images. Harbor's aws-ecr adapter finds the
## role through the AWS SDK's default credential chain, so unlike the
## registry below, core needs no credentials sidecar.
#   serviceAccountName: harbor-core
# <<< ecr-proxy

portal:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi
# >>> karpenter: deploy.sh uncomments this block when k8s_platform=eks
#   nodeSelector:
#     karpenter.sh/capacity-type: on-demand
# <<< karpenter

jobservice:
  # stdout instead of the chart's file default: job logs (garbage
  # collection, replication, retention, scans) go to the pod log, where
  # VictoriaLogs collects them like every other pod's, and jobservice needs
  # no PVC of its own. The trade-off: the UI's per-job "Logs" links show
  # nothing. The database logger would keep those, but writes every job
  # log line into the CNPG database above.
  jobLoggers:
    - stdout
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 256Mi
# >>> karpenter: deploy.sh uncomments this block when k8s_platform=eks
#   nodeSelector:
#     karpenter.sh/capacity-type: on-demand
# <<< karpenter

registry:
