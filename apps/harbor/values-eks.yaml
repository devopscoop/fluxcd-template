# High availability on EKS. Flux merges this over values.yaml (valuesFrom in
# release.yaml, enabled by the eks marker in kustomization.yaml), so it only
# holds what changes when the registry moves from its ReadWriteOnce volume to
# S3. README.md → "Storage and availability" has the whole picture, including
# what stays single (Redis, jobservice, Trivy, the exporter).
#
# Needs aws-eks-template's cluster/harbor.tf (enable_harbor = true) applied
# first: the bucket below and the harbor-registry IRSA role in
# serviceaccount-registry.yaml. replace_placeholders.sh fills in the bucket's
# org and cluster names and the region from variables.sh.

# Image blobs in S3: shared, regional storage, so registry pods hold no state,
# run in any AZ, and replace each other without a volume to move. With
# redirects on (the chart default, disableredirect: false), a pull's blob GET
# is answered with a presigned S3 URL, and the node fetches the bytes from S3
# directly. They bypass the registry pods, the gateway, and the WAF.
# Pushes still stream through the registry.
#
# No access keys here: the registry reads short-lived ones from a file that
# the aws-credentials sidecar refreshes from the pod's IRSA role (release.yaml
# explains why it can't use IRSA itself).
persistence:
  imageChartStorage:
    type: s3
    s3:
      region: us-east-2
      bucket: devopscoop-project1-dev-harbor-registry

# The registry no longer has a volume to hand over, so no Recreate: rolling
# updates replace one pod at a time (this applies to jobservice too, which
# keeps its logs on stdout and has no volume either).
updateStrategy:
  type: RollingUpdate

# Two replicas each of the components every pull and push goes through, one
# per node and spread across zones. The spread follows the eg EnvoyProxy
# rules (apps/eg-custom-resources/envoyproxy-private.yaml has the reasoning).
# hostname is DoNotSchedule, so Karpenter consolidation can't stack both
# replicas on one node. zone is ScheduleAnyway, so a zone without capacity
# doesn't block scheduling. The chart adds the labelSelector for each
# component. pod-template-hash scopes the spread to one ReplicaSet, so a
# rolling update spreads the new pods instead of counting the old ones.
# A PDB per component keeps a node drain from taking both replicas.
#
# The other components stay single: jobservice runs background work
# (garbage collection, replication, retention, scans) that waits out a
# restart, and Trivy and the exporter aren't on the pull path.
core:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash

portal:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash

registry:
  # serviceaccount-registry.yaml: the chart creates no ServiceAccounts, and
  # this one carries the IRSA role that can read and write the bucket. Only
  # the registry pod runs as it.
  serviceAccountName: harbor-registry
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      matchLabelKeys:
        - pod-template-hash
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      matchLabelKeys:
        - pod-template-hash
