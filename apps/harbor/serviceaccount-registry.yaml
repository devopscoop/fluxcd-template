# The registry pod's identity on EKS (an eks block in values.yaml sets
# registry.serviceAccountName): the IRSA role that can read and write the
# blob bucket, both from aws-eks-template cluster/harbor.tf. The chart
# creates no ServiceAccounts, and the other components run as the
# namespace's default, so only the registry pod (registry, registryctl,
# and the aws-credentials sidecar from values.yaml) gets the bucket.
# Listed in kustomization.yaml's eks block, so the whole file is EKS-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-registry
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/harbor-registry"
