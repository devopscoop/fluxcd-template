# harbor-core's identity on EKS with the ecr-proxy marker enabled (its block
# in values.yaml sets core.serviceAccountName): the IRSA role from
# aws-eks-template cluster/harbor.tf (enable_harbor_ecr_proxy) that can pull
# this account's private ECR images. harbor-core makes the pull-through
# cache's upstream fetches, and Harbor's aws-ecr adapter finds the role
# through the AWS SDK's default credential chain. The chart creates no
# ServiceAccounts, so only core gets the role. Listed in kustomization.yaml's
# ecr-proxy block; README.md → "Caching this account's private ECR".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-core
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/harbor-core"
