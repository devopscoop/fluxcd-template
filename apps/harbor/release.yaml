# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: harbor-values
    - kind: Secret
      name: harbor-secrets
  chart:
    spec:
      chart: harbor
      version: 1.19.4
      sourceRef:
        kind: HelmRepository
        name: harbor
