## High availability on EKS: S3 credentials for the registry (values-eks.yaml
## moves its blobs to S3). Harbor 2.15's registry is goharbor/distribution
## v2.8.3, whose S3 driver builds a fixed credential chain (static keys,
## environment, shared credentials file, EC2 instance role) without the
## web-identity provider IRSA needs, so it ignores the pod's role
## (goharbor/harbor#12888). The aws-credentials sidecar bridges that: a
## native sidecar (an init container with restartPolicy Always) that
## exchanges the pod's IRSA token for one-hour keys every 30 minutes and
## writes them to a shared credentials file on an in-memory volume. The
## registry and registryctl read that file (AWS_SHARED_CREDENTIALS_FILE).
## The SDK keeps the keys it read until S3 answers ExpiredToken, then
## expires them, re-reads the file, and retries, so rotation needs no
## restart. The startup probe holds the registry back until the first keys
## exist; without them its chain would fall through to the node's instance
## role. Drop all of this once Harbor ships a registry on distribution v3,
## which reads IRSA natively, and set registry.serviceAccountName alone.
