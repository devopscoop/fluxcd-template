# https://fluxcd.io/flux/guides/helmreleases/#refer-to-values-in-configmaps-generated-with-kustomize
# https://fluxcd.io/flux/guides/helmreleases/#refer-to-values-in-secret-generated-with-kustomize-and-sops

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Setting namespace here will ensure that all objects managed by this Kustomization will explicitly be deployed to this namespace. You don't need to put specify `namespace:` anywhere else if you do this.
namespace: harbor

resources:
  - namespace.yaml
  - helmrepo.yaml
  - release.yaml
  # The chart renders the HTTPRoute itself (expose.type: route in
  # values.yaml); this lifts Envoy's 15s route timeout on it, which large
  # blobs outlive.
  - backendtrafficpolicy.yaml
  # Harbor's PostgreSQL — the CloudNativePG Cluster plus its barman backup
  # wiring (ObjectStore, daily ScheduledBackup) in one file, from the
  # reusable copy in apps/templates/cnpg-database.
  - db-cluster.yaml
  # The scrape and alert rules; they ship with the app, so no marker.
  - vm.yaml
  # The registry's IRSA identity for its S3 bucket, on EKS (values.yaml's
  # eks blocks hold the bucket and point the registry at this
  # ServiceAccount; README.md → "Storage and availability").
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#   - serviceaccount-registry.yaml
# <<< eks
configMapGenerator:
  - name: harbor-values
    files:
      - values.yaml=values.yaml
secretGenerator:
  - name: harbor-secrets
    files:
      - values.yaml=helm_secrets.yaml
configurations:
  - kustomizeconfig.yaml
