apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:

  # The RabbitMQ Messaging Topology Operator manages RabbitMQ messaging topologies within a RabbitMQ cluster deployed via the RabbitMQ Cluster Kubernetes Operator.
  # https://www.rabbitmq.com/kubernetes/operator/install-topology-operator
  # https://github.com/rabbitmq/messaging-topology-operator/releases
  #
  # Since 1.20 every user-provided Secret a topology object references
  # (importCredentialsSecret, connectionSecret, uriSecret, upstreamSecret)
  # must carry the label rabbitmq.com/topology-operator: "true" — the
  # operator only caches labeled Secrets, and its webhook rejects new or
  # changed objects pointing at an unlabeled one.
  - https://github.com/rabbitmq/messaging-topology-operator/releases/download/v1.20.5/messaging-topology-operator-with-certmanager.yaml
  - vm.yaml

patches:
  # Both upstream manifests carry the rabbitmq-system Namespace, with
  # different labels since 1.19, so two Flux Kustomizations applying it
  # would relabel it back and forth on every reconcile. The cluster-operator
  # app, which this one depends on, owns it (and annotates it
  # prune: disabled); drop this copy.
  - target:
      kind: Namespace
      name: rabbitmq-system
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: rabbitmq-system
