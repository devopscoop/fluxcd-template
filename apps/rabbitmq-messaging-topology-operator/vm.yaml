# Scrape the RabbitMQ messaging-topology-operator's controller-runtime
# metrics (reconcile rates/errors, workqueue depth, client-go internals)
# from the messaging-topology-controller-metrics-service Service's "https"
# port (:8443). Selector and endpoint mirror upstream's own ServiceMonitor
# (config/prometheus/monitor.yaml); verified against v1.20.5, this app's
# pin.
#
# Since 1.20 the endpoint is HTTPS with delegated auth — the same shape as
# apps/metrics-server/vm.yaml:
# - The serving cert comes from the manifest's self-signed cert-manager
#   Issuer, so the scrape skips verification (upstream's ServiceMonitor
#   does too).
# - /metrics sits behind TokenReview+SubjectAccessReview (--metrics-secure).
#   vmagent's operator-generated ClusterRole already carries
#   nonResourceURLs ["/metrics"] get, so its own ServiceAccount token
#   passes, and the manifest's messaging-topology-metrics-reader
#   ClusterRole needs no binding.
#
# A separate object from the cluster-operator's scrape
# (apps/rabbitmq-cluster-operator/vm.yaml), which is a plain-HTTP pod
# scrape. The operators' alert rule lives with the cluster-operator, which
# this app depends on.
#
# Ships with the app: this file is in the app's own kustomization, so it
# applies exactly when the operator does. The kustomization sets no
# namespace (the upstream manifest carries its own), so the object names
# rabbitmq-system itself.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: rabbitmq-messaging-topology-operator
  namespace: rabbitmq-system
spec:
  namespaceSelector:
    matchNames:
      - rabbitmq-system
  selector:
    matchLabels:
      app.kubernetes.io/name: messaging-topology-operator
      control-plane: controller-manager
  endpoints:
    - port: https
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
