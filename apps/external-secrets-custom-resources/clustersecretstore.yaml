# The one store every ExternalSecret in the cluster reads from: OpenBao's kv
# v2 mount "secret" (apps/openbao), through the active node, authenticating
# as the external-secrets controller's own ServiceAccount.
#
# serviceAccountRef makes ESO mint a fresh 10-minute token for that
# ServiceAccount through the TokenRequest API on each login, with the
# "openbao" audience that OpenBao's external-secrets role requires -- rather
# than reusing the pod's mounted token, which is long-lived and minted for
# the Kubernetes API.
#
# Cluster-wide by design: in this repo only Flux creates ExternalSecrets,
# from reviewed commits, so the store needs no per-namespace scoping. On a
# cluster where tenants can create their own ExternalSecrets, that would let
# any of them read any path; use namespaced SecretStores with per-namespace
# OpenBao roles there instead.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      # ca.crt from the cert-manager secret the OpenBao pods serve, i.e. the
      # private CA in apps/openbao/tls.yaml.
      caProvider:
        type: Secret
        namespace: openbao
        name: openbao-server-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences:
              - openbao
