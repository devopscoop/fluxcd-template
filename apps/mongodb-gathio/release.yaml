# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-gathio
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: mongodb-gathio-values
    - kind: Secret
      name: mongodb-gathio-secrets
  chart:
    spec:
      chart: mongodb
      version: 0.8.1
      sourceRef:
        kind: HelmRepository
        name: groundhog2k
