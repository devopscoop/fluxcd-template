# dyff between <(yq . <(helm show values grafana/loki --version 7.0.0)) <(yq eval '. * load("values.yaml")' <(helm show values grafana/loki --version 7.0.0))
# vim -O <(helm show values grafana/loki --version 7.0.0) values.yaml

# Single-process Loki backed by S3-compatible object storage. This is the
# simplest topology that still uses durable object storage (good for up to a
# few tens of GB/day). For higher throughput, switch to SimpleScalable.
deploymentMode: SingleBinary

loki:
  # Single tenant: clients don't need to send an X-Scope-OrgID header, and
  # Grafana can query without per-tenant config. Flip to true for multi-tenancy.
  auth_enabled: false

  commonConfig:
    # Only one instance runs in SingleBinary mode, so chunks are written once.
    # (Default is 3, which is meant for SimpleScalable/Distributed.)
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory

  # structuredConfig is merged OVER the chart-generated config (see
  # loki.calculatedConfig in _helpers.tpl). Use it to set fields the chart
  # template doesn't expose, like memberlist.bind_addr / advertise_addr.
  #
  # The cluster is IPv6-only. dskit's memberlist scans [eth0, en0, lo] for an
  # IPv4 address; en0 doesn't exist on Linux and eth0 has only an IPv6 address,
  # so the scan fails with "no useable address found". Two overrides are
  # needed:
  #   bind_addr: "::" — skip the interface scan for the listener socket
  #   advertise_addr: the pod IP — skip the interface scan for the advertise IP
  # POD_IP is injected by the downward API in singleBinary.extraEnv below.
  # Loki expands ${VAR} from the environment at startup.
  #
  # The '{{ "${POD_IP}" }}' wrapping is load-bearing. Loki's expand-env is a
  # textual substitution into config.yaml BEFORE YAML parsing, so the IP must
  # land inside quotes: a pod can draw the suffix-zero address of its ENI
  # prefix (e.g. 2600:aaaa:bbb:cccc:dddd::), and unquoted, that trailing "::"
  # before a newline is a YAML mapping indicator — Loki crashloops with
  # "mapping values are not allowed in this context". Writing "${POD_IP}" with
  # plain quotes here does NOT survive: loki.calculatedConfig round-trips
  # values through fromYaml|toYaml, and Helm's toYaml re-emits the string
  # unquoted. A string starting with {{ is the escape hatch — toYaml must
  # single-quote it, and the chart's final tpl pass then substitutes the
  # expression INSIDE those quotes, leaving instance_addr: '${POD_IP}' in the
  # ConfigMap.
  structuredConfig:
    memberlist:
      bind_addr:
        - "::"
      advertise_addr: '{{ "${POD_IP}" }}'
    # Each ring component (query-scheduler, ingester, distributor, etc.) has a
    # lifecycler that also calls GetFirstAddressOf when instance_addr is unset.
    # Setting it here in common propagates to all rings at once.
    common:
      instance_addr: '{{ "${POD_IP}" }}'

  # A real install requires an explicit schema. tsdb + v13 is the current
  # recommended combination.
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # Object storage (AWS S3). Bucket names and region are non-secret and live
  # here. Authentication is via IRSA (see serviceAccount.annotations below), so
  # there are NO static access keys — Loki's AWS SDK picks up credentials from
  # the projected web-identity token automatically.
  storage:
    type: s3
    bucketNames:
      chunks: devopscoop-project1-dev-loki-chunks
      ruler: devopscoop-project1-dev-loki-ruler
    s3:
      region: us-east-2
      # Leave endpoint unset to use the regional AWS S3 endpoint. AWS S3 uses
      # virtual-hosted-style addressing, so path-style stays off.
      s3ForcePathStyle: false
      # --- Static-key / non-AWS alternative (e.g. Rook-Ceph RGW, MinIO) -------
      # If you don't use IRSA, point at a custom endpoint and supply credentials
      # via helm_secrets.yaml instead of the serviceAccount annotation below.
      # For path-style backends, also set s3ForcePathStyle: true.
      # endpoint: CHANGEME-s3-endpoint
      # insecure: false

  # Keep logs from growing in the bucket forever. The compactor (which runs
  # in-process for SingleBinary) handles the actual deletion.
  limits_config:
    retention_period: 744h # 31 days
  compactor:
    retention_enabled: true
    delete_request_store: s3

# IRSA — annotate Loki's ServiceAccount with the IAM role that grants
# read/write to the buckets above. The EKS pod-identity webhook injects the
# web-identity token the AWS SDK uses, so no credentials live in this repo.
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
# serviceAccount:
#   annotations:
#     eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/loki"
# <<< eks

# Run as one Loki pod and turn off the SimpleScalable targets entirely.
singleBinary:
  replicas: 1
  # Sized from krr (2026-08-22, 14d dev usage); memory req=limit, no CPU limit.
  resources:
    requests:
      cpu: 15m
      memory: 320Mi
    limits:
      memory: 320Mi
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
  persistence:
    # Local PVC is only used for the WAL and tsdb/boltdb shipper cache, not for
    # log chunks (those go to S3).
    enabled: true
    size: 1Gi
  # Loki runs as a single replica with replication_factor 1 and its WAL on the
  # PVC above, so a spot reclaim stops log ingestion and risks unflushed WAL
  # data. Pin it to on-demand capacity, per the NodePool contract in
  # apps/karpenter-custom-resources/nodepool.yaml.
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#   nodeSelector:
#     karpenter.sh/capacity-type: on-demand
# <<< eks
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Memcached-backed caches. The chunk cache stays off: the chart default is
# allocatedMemory: 8192, and the chart requests floor(1.2 * allocatedMemory)
# of memory — nearly 10Gi, more than the cluster's remaining headroom. If
# query latency is still a problem with the results cache on, enable it with
# an explicit (smaller) allocatedMemory rather than the default.
chunksCache:
  enabled: false
# The results cache is the high-value, low-cost half: dashboards auto-refresh
# the same ranges over and over, and without it every refresh recomputes every
# query against S3.
resultsCache:
  enabled: true
  # Dev dashboards only warmed ~100Mi of the chart-default 1024 MB cache
  # (krr, 14d), so shrink it. The chart derives the container's memory
  # request/limit as floor(1.2 * allocatedMemory) ~= 307Mi; no CPU limit.
  allocatedMemory: 256
  allocatedCPU: 25m

# Scrape Loki's own metrics (ingest rate, stream count, query latency, cache
# hits, ...). The Prometheus CR only selects ServiceMonitors carrying its Helm
# release name as a label — without it, kube-prometheus-stack silently ignores
# the ServiceMonitor.
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

# Extra components we don't need for a basic logging store.
lokiCanary:
  enabled: false
test:
  enabled: false

# The nginx gateway is the single stable endpoint for both pushes and queries.
# Grafana and Alloy both point at http://loki-gateway.loki.svc.cluster.local.
gateway:
  enabled: true
  # Sized from krr (2026-08-22, 14d dev usage); memory req=limit, no CPU limit.
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

# The rules sidecar (loki-sc-rules) and memcached exporter are tiny fixed-size
# helpers.
sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi
memcachedExporter:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi
