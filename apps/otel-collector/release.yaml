# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: otel-collector-values
    - kind: Secret
      name: otel-collector-secrets
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.170.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
