# dyff between <(yq . <(helm show values open-telemetry/opentelemetry-collector --version 0.170.0)) <(yq eval '. * load("values.yaml")' <(helm show values open-telemetry/opentelemetry-collector --version 0.170.0))
# vim -O <(helm show values open-telemetry/opentelemetry-collector --version 0.170.0) values.yaml

# One collector per node, like the Alloy DaemonSet this replaces: each pod
# tails its own node's log files AND receives OTLP pushed by that node's
# workloads through the Service below. If app-pushed OTLP volume ever
# outgrows per-node agents, split the roles: keep this DaemonSet for log
# collection and add a second release of this chart as a gateway Deployment
# (mode: deployment, no logsCollection) behind the Service for OTLP traffic.
mode: daemonset

# The chart refuses to render without an explicit image choice — there is no
# default distribution. The metrics pipeline's prometheusremotewrite exporter
# forces the contrib distribution: the slimmer otelcol-k8s distribution ships
# everything else used here (file_log receiver, k8s_attributes processor,
# otlp/otlphttp exporters, file_storage extension) but not that exporter.
# ghcr.io is the canonical registry (also dodges Docker Hub pull limits); the
# tag defaults to the chart's appVersion (0.158.0), so it is pinned by the
# chart version in release.yaml.
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib

# The chart's default fullname is <release>-<chart>, i.e. the unwieldy
# otel-collector-opentelemetry-collector. Pin the name so the Service lands
# at the address workloads are told to push to:
# otel-collector.otel-collector.svc.cluster.local (:4317 gRPC / :4318 HTTP).
fullnameOverride: otel-collector

presets:
  # Tail pod stdout/stderr under /var/log/pods — the replacement for Alloy's
  # discovery.kubernetes + loki.source.file pipeline. The preset mounts the
  # hostPaths, appends the file_log receiver to the logs pipeline, and its
  # `container` operator does what Alloy's stage.cri did: real timestamp from
  # the CRI envelope, stream attribute, reassembly of runtime-split partial
  # lines, plus namespace/pod/container attributes parsed from the file path.
  logsCollection:
    enabled: true
    # Persist file_log read offsets on the host (/var/lib/otelcol) so a
    # collector restart resumes where it left off instead of re-reading
    # (duplicates) or starting at end (gaps). Chart-documented trade-off:
    # the container then runs as root to write that hostPath.
    storeCheckpoints: true
  # Enrich all three signals with k8s.namespace.name / k8s.pod.name /
  # k8s.container.name / owner-workload resource attributes — the parallel of
  # Alloy's discovery.relabel labels. The preset creates the read RBAC,
  # prepends the k8s_attributes processor to every pipeline, and in daemonset
  # mode scopes its informer to the local node (filter.node_from_env_var) —
  # the same watch-load fix as Alloy's spec.nodeName field selector, without
  # which API-server watch load grows quadratically with cluster size.
  kubernetesAttributes:
    enabled: true

config:
  # The cluster is IPv6-only (see the memberlist comment in
  # apps/loki/values.yaml for background). The chart's defaults render every
  # listen endpoint as ${env:MY_POD_IP}:<port>; the collector substitutes the
  # env var textually at startup, and with an IPv6 pod IP the result
  # (2600::5:4317) fails Go's host:port parsing — "too many colons in
  # address". Every listener actually used is re-declared here with the
  # address bracketed, so the substituted value parses ([2600::5]:4317).
  extensions:
    health_check:
      endpoint: "[${env:MY_POD_IP}]:13133"
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "[${env:MY_POD_IP}]:4317"
        http:
          endpoint: "[${env:MY_POD_IP}]:4318"
    # Drop the default receivers we don't route (null deletes them from the
    # generated config): jaeger/zipkin are legacy trace wire formats —
    # workloads here speak OTLP — and prometheus is the collector's :8888
    # self-scrape, which would push the same series vmagent already scrapes
    # via the VMServiceScrape (vmservicescrape.yaml), ingesting them twice.
    # Their defaults also carry the unbracketed-IPv6 endpoints described
    # above.
    jaeger: null
    prometheus: null
    zipkin: null
  processors:
    # Tailed container logs carry no OTLP severity: the file_log preset's
    # `container` operator parses only the CRI envelope, leaving the app's own
    # level inside the body, so everything lands in VictoriaLogs with
    # severity_text "Unspecified" (and shows as level "unknown"/"other" in
    # Grafana and vmui). Lift the level out of the common body formats -- JSON
    # ({"level":..., also severity/lvl keys), JSON and plain-text access logs
    # by HTTP status, timestamp-then-level lines, envoy's own bracketed
    # [ts][thread][level][logger] format, logfmt (level=info), klog (leading
    # I/W/E/F), and leading uppercase LEVEL: prefixes -- into severity_text.
    # Guards on severity_text == "" keep app-pushed OTLP severities untouched,
    # and error_mode: ignore means a statement erroring on an odd body (e.g.
    # non-string, malformed JSON) just skips that statement, never drops the
    # log. Plain-text lines with no recognizable level stay "unknown", which
    # is honest. The Grafana side of this mapping lives in the VictoriaLogs
    # datasource's logLevelRules (apps/victoria-metrics/values.yaml); vmui
    # detects severity_text natively.
    transform/severity:
      error_mode: ignore
      log_statements:
        - statements:
            # JSON bodies: lift the level/severity/lvl key into severity_text.
            - set(log.cache, ParseJSON(log.body)) where log.severity_text == "" and IsMatch(log.body, "^\\s*\\{")
            - set(log.severity_text, String(log.cache["level"])) where log.severity_text == "" and log.cache["level"] != nil
            - set(log.severity_text, String(log.cache["severity"])) where log.severity_text == "" and log.cache["severity"] != nil
            - set(log.severity_text, String(log.cache["lvl"])) where log.severity_text == "" and log.cache["lvl"] != nil
            # JSON access logs with no level key (the envoy gateways emit one
            # per request -- 90%+ of level-less volume): derive the level from
            # the HTTP status instead. Opinionated on purpose: it makes 5xx
            # spikes stand out in vmui/Grafana. Must stay before the logfmt
            # extract below, which overwrites the cached JSON.
            - set(log.severity_text, "error") where log.severity_text == "" and log.cache["response_code"] != nil and log.cache["response_code"] >= 500
            - set(log.severity_text, "warning") where log.severity_text == "" and log.cache["response_code"] != nil and log.cache["response_code"] >= 400
            - set(log.severity_text, "info") where log.severity_text == "" and log.cache["response_code"] != nil
            # Plain-text access logs, which no branch here matched: morgan's
            # tiny format, e.g. "GET /sign-in?redirect_url=
            # %2Fdashboard 200 - - 4.948 ms". Status-derived like the JSON
            # access logs above, and for the same reason. Anchoring on a
            # leading HTTP method keeps it off prose containing a 3-digit
            # number, and Int() makes the thresholds numeric rather than
            # lexicographic. The capture group is named access_status, not
            # status: a failed ExtractPatterns leaves log.cache holding
            # whatever the previous statement put there (error_mode: ignore
            # skips the statement, it does not clear the cache), so a JSON
            # body carrying a "status" key would otherwise be read as an
            # access log here. Same reason the klog branch below uses "klog".
            - 'set(log.cache, ExtractPatterns(log.body, "^(?:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS|CONNECT|TRACE) \\S+ (?P<access_status>[1-5][0-9]{2})\\b")) where log.severity_text == ""'
            - set(log.severity_text, "error") where log.severity_text == "" and log.cache["access_status"] != nil and Int(log.cache["access_status"]) >= 500
            - set(log.severity_text, "warning") where log.severity_text == "" and log.cache["access_status"] != nil and Int(log.cache["access_status"]) >= 400
            - set(log.severity_text, "info") where log.severity_text == "" and log.cache["access_status"] != nil
            # Timestamp-then-level lines, which no branch above matches:
            # "<RFC3339>\t<level>\t<caller>\t<message>" -- the format every
            # VictoriaMetrics component and the collector's own zap logger
            # use. vmagent was the only unclassified emitter left in the
            # victoria-metrics namespace: "2026-08-27T19:01:18.915Z\twarn\t
            # VictoriaMetrics/lib/promscrape/scrapework.go:401\tcannot scrape
            # target ...". The separator is a TAB, not the spaces it looks
            # like when pasted, so \s is what matches both. Case-insensitive
            # because dev carries lowercase warn/info from VictoriaMetrics and
            # uppercase ERROR from zap; ToLowerCase below normalizes them.
            # Requiring a full RFC3339 timestamp AND a known level word AND
            # trailing whitespace keeps this off prose and off "error=..."
            # style text. Placed before the logfmt branch deliberately: a
            # leading timestamp+level is a stronger signal than a "level="
            # substring appearing anywhere later in a message. Distinct cache
            # key (ts_level) for the reason given in the access-log branch.
            - 'set(log.cache, ExtractPatterns(log.body, "(?i)^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z?\\s+(?P<ts_level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|DPANIC|PANIC|FATAL)\\s")) where log.severity_text == ""'
            - set(log.severity_text, log.cache["ts_level"]) where log.severity_text == "" and log.cache["ts_level"] != nil
            # Envoy's own (non-access) log format, which no branch above
            # matches: "[2026-08-27 19:48:16.101][14][critical][wasm]
            # [source/.../context.cc:1159] wasm log coraza ...". Emitted by
            # the data-plane envoy pods -- the proxy Deployments Envoy Gateway
            # runs in envoy-gateway-system, one fleet per Gateway; the eg
            # controller sitting alongside them logs zap JSON, already covered
            # above. This is the only place Coraza WAF blocks (apps/coraza)
            # surface, so until this branch existed every block sat at
            # "unknown". The bracketed level is envoy's own spdlog level, not
            # the ModSecurity rule severity the Coraza message carries inline
            # as [severity "emergency"]; envoy's is the one to use, since it
            # grades the log line rather than the rule that fired. Anchored on
            # timestamp + numeric thread id + level + logger, a strong enough
            # signal to sit ahead of the logfmt branch below -- that one would
            # otherwise latch onto a stray "level=" appearing inside a wasm
            # message. "warning" precedes "warn" in the alternation so the
            # longer spelling wins. Distinct cache key (envoy_level) for the
            # reason given in the access-log branch.
            - 'set(log.cache, ExtractPatterns(log.body, "^\\[[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:.]+\\]\\[[0-9]+\\]\\[(?P<envoy_level>trace|debug|info|warning|warn|error|critical)\\]\\[")) where log.severity_text == ""'
            - set(log.severity_text, log.cache["envoy_level"]) where log.severity_text == "" and log.cache["envoy_level"] != nil
            # logfmt bodies: level=info / lvl=warn / severity="error".
            - set(log.cache, ExtractPatterns(log.body, "(?i)\\b(?:level|lvl|severity)=\"?(?P<level>[A-Za-z]+)")) where log.severity_text == ""
            - set(log.severity_text, log.cache["level"]) where log.severity_text == "" and log.cache["level"] != nil
            # klog (kubernetes components: descheduler, kube-proxy, ...): the
            # level is the leading char of "I0826 23:06:02.864467 1 x.go:42] m".
            - set(log.cache, ExtractPatterns(log.body, "^(?P<klog>[IWEF])[0-9]{4} ")) where log.severity_text == ""
            - set(log.severity_text, "info") where log.severity_text == "" and log.cache["klog"] == "I"
            - set(log.severity_text, "warning") where log.severity_text == "" and log.cache["klog"] == "W"
            - set(log.severity_text, "error") where log.severity_text == "" and log.cache["klog"] == "E"
            - set(log.severity_text, "fatal") where log.severity_text == "" and log.cache["klog"] == "F"
            # Leading uppercase level prefix: uvicorn's "INFO:     msg",
            # bracket-style "[ERROR] msg", and bare "WARNING msg".
            - 'set(log.cache, ExtractPatterns(log.body, "^\\[?(?P<level>TRACE|DEBUG|INFO|NOTICE|WARN|WARNING|ERROR|CRITICAL|FATAL|PANIC)\\]?[: ]")) where log.severity_text == ""'
            - set(log.severity_text, log.cache["level"]) where log.severity_text == "" and log.cache["level"] != nil
            # Normalize to lowercase -- covers app-pushed OTLP severities too
            # (INFO/Info/info all become info), so LogsQL filters and the
            # Grafana logLevelRules only ever deal with one spelling.
            - set(log.severity_text, ToLowerCase(log.severity_text)) where log.severity_text != ""
  exporters:
    # All three pipelines are rerouted below, so the chart's default debug
    # exporter has no remaining consumer.
    debug: null
    # Logs → VictoriaLogs (apps/victoria-logs). The otlphttp exporter treats
    # `endpoint` as a base URL and appends the standard /v1/logs to it, but
    # VictoriaLogs serves OTLP ingestion under its own prefix, so the full
    # path goes in `logs_endpoint`, which is used verbatim.
    otlphttp/victoria-logs:
      logs_endpoint: http://victoria-logs-server.victoria-logs.svc.cluster.local:9428/insert/opentelemetry/v1/logs
    # Traces → Tempo (apps/tempo) over OTLP gRPC. The exporter defaults to
    # TLS; in-cluster traffic here is plaintext, so opt out explicitly.
    otlp/tempo:
      endpoint: tempo.tempo.svc.cluster.local:4317
      tls:
        insecure: true
    # Metrics → VictoriaMetrics (apps/victoria-metrics) via Prometheus
    # remote write. Division of labor: vmagent SCRAPES infrastructure and
    # exporter metrics itself; this pipeline only carries metrics that
    # applications PUSH over OTLP.
    prometheusremotewrite/victoria-metrics:
      endpoint: http://vmsingle-victoria-metrics.victoria-metrics.svc.cluster.local:8428/api/v1/write
  service:
    pipelines:
      # Helm replaces lists instead of merging them, so each pipeline
      # restates its receiver list minus the receivers dropped above and
      # swaps the debug exporter for the real backend. The presets inject
      # their pieces after this merge (file_log into the logs receivers,
      # k8s_attributes ahead of every processor list); the chart-default
      # memory_limiter + batch processors are maps, not lists, so they
      # survive the merge untouched.
      logs:
        # Restating the processors list (chart default: memory_limiter, batch)
        # to slot transform/severity in; the kubernetesAttributes preset still
        # prepends k8s_attributes to the final rendered list. memory_limiter
        # must stay first among these, batch last.
        processors:
          - memory_limiter
          - transform/severity
          - batch
        exporters:
          - otlphttp/victoria-logs
      metrics:
        receivers:
          - otlp
        exporters:
          - prometheusremotewrite/victoria-metrics
      traces:
        receivers:
          - otlp
        exporters:
          - otlp/tempo
    telemetry:
      metrics:
        # Same IPv6 bracket fix as the receivers above: the self-telemetry
        # reader joins host and port with a bare "%s:%d", so an unbracketed
        # IPv6 host fails to listen.
        readers:
          - pull:
              exporter:
                prometheus:
                  host: "[${env:MY_POD_IP}]"
                  port: 8888

# In daemonset mode the chart also opens a hostPort for every enabled port by
# default. Workloads reach the collector through the Service, not node IPs,
# so drop the hostPorts (null deletes the key): they are forbidden by the
# "baseline" Pod Security level and invite node port conflicts — this keeps
# the pod's security footprint at hostPath-mounts-only, same as apps/alloy.
# The jaeger/zipkin ports follow their receivers out.
ports:
  otlp:
    enabled: true
    hostPort: null
  otlp-http:
    enabled: true
    hostPort: null
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  # The :8888 self-telemetry port must be on the Service for the
  # VMServiceScrape (vmservicescrape.yaml) to have an endpoint to point at.
  # The chart's own serviceMonitor option stays off: it renders a
  # prometheus-operator CRD this stack doesn't install — see the comment in
  # vmservicescrape.yaml.
  metrics:
    enabled: true

# A daemonset gets no Service unless explicitly enabled. Enable it as the
# stable OTLP endpoint for workloads. The chart defaults a daemonset Service
# to internalTrafficPolicy: Local, so each pod's pushes land on its own
# node's collector — no cross-node hop, and per-node backpressure stays local.
service:
  enabled: true

# Initial guesses — no usage data yet; resize with krr after ~14d of dev
# usage. Memory req=limit, no CPU limit. The chart derives GOMEMLIMIT and the
# memory_limiter processor's ceiling from the memory limit (80% each), so the
# limit is load-bearing beyond eviction protection.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 256Mi
