apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs
  namespace: flux-system
spec:
  # values.yaml enables the chart's VMServiceScrape, an
  # operator.victoriametrics.com CR the chart renders unconditionally — the
  # apply fails on the missing CRD unless the VictoriaMetrics operator from
  # victoria-metrics has landed first.
  dependsOn:
    - name: victoria-metrics
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: apps/victoria-logs
  prune: true
  wait: true
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  suspend: false
