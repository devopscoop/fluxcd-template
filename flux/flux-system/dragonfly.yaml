apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dragonfly
  namespace: flux-system
spec:
  # vm.yaml's VMServiceScrape and VMRule need the VictoriaMetrics CRDs:
  # victoria-metrics-crds, not the whole victoria-metrics stack, so a broken
  # Grafana upgrade can't hold this app. No dependsOn harbor: dfinit only
  # writes containerd config naming Harbor's hostname, which is harmless
  # before Harbor exists (containerd falls back to the server, which then
  # fails exactly as it would without Dragonfly), and Harbor needs nothing
  # from Dragonfly to start.
  dependsOn:
    - name: victoria-metrics-crds
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: apps/dragonfly
  prune: true
  wait: true
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  suspend: false
