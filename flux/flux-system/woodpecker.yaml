apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: woodpecker
  namespace: flux-system
spec:
  # db-cluster.yaml is a CloudNativePG Cluster CR, so applying it needs the
  # CRD and the operator's admission webhook to be serving, and on a fresh
  # bootstrap cnpg must land first. The ObjectStore in db-cluster.yaml is
  # likewise a CR whose CRD ships with the barman plugin, and the plugin must
  # be registered with the operator before the Cluster references it for WAL
  # archiving. db-client-cert.yaml's Issuers and Certificates need
  # cert-manager's CRDs. vm.yaml's VMPodScrape and VMRule need the
  # VictoriaMetrics CRDs: victoria-metrics-crds, not the whole
  # victoria-metrics stack, so a broken Grafana upgrade can't hold this app.
  dependsOn:
    - name: cert-manager
    - name: cnpg
    - name: cnpg-barman-plugin
    - name: victoria-metrics-crds
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: apps/woodpecker
  prune: true
  wait: true
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  suspend: false
