apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tempo
  namespace: flux-system
spec:
  # vmservicescrape.yaml scrapes Tempo's self-metrics with a VMServiceScrape,
  # an operator.victoriametrics.com CRD — the apply fails on the missing CRD
  # unless victoria-metrics, which installs the VictoriaMetrics operator and
  # its CRDs, has landed first. (The metrics-generator also remote-writes
  # into vmsingle over there, but that's a runtime dependency, not an
  # apply-time one.)
  dependsOn:
    - name: victoria-metrics
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: apps/tempo
  prune: true
  wait: true
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  suspend: false
