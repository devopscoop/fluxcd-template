apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma
  namespace: flux-system
spec:
  # vmservicescrape.yaml/vmrule.yaml are operator.victoriametrics.com CRs —
  # the apply fails on the missing CRDs unless victoria-metrics has landed
  # first (the tempo/otel-collector pattern; the scrape lives in-app because
  # its basicAuth secret must share the scrape object's namespace).
  dependsOn:
    - name: victoria-metrics
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: apps/uptime-kuma
  prune: true
  wait: true
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  suspend: false
