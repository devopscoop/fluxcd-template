apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  # vmservicescrape.yaml scrapes the collector's self-metrics with a
  # VMServiceScrape, an operator.victoriametrics.com CRD — the apply fails on
  # the missing CRD unless victoria-metrics, which installs the
  # VictoriaMetrics operator and its CRDs, has landed first.
  dependsOn:
    - name: victoria-metrics
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: apps/otel-collector
  prune: true
  wait: true
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  suspend: false
