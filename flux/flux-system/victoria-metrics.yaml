apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  # The operator's CRDs come from victoria-metrics-crds (this app's chart has
  # its own CRD install turned off), and this app's VM* objects (VMSingle,
  # VMAgent, VMAlert, flux-vm.yaml, the chart's bundled rules) need them
  # first. Apps that need the running stack, not just its CRDs (goalert,
  # tempo, otel-collector, opencost, ...) depend on this app in turn.
  dependsOn:
    - name: victoria-metrics-crds
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: apps/victoria-metrics
  prune: true
  wait: true
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  suspend: false
