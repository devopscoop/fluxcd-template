# https://fluxoperator.dev/get-started/
# https://fluxoperator.dev/docs/instance/customization/#cluster-sync-sops-decryption
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    # Exact version pin — disables the operator's automatic Flux updates.
    # Run ./update_flux-instance.sh to bump this together with the
    # digest-pinned controller images in kustomize.patches below.
    version: "2.10.0"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  components:
    - source-controller
    - source-watcher
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    type: kubernetes
    size: medium
    multitenant: false
    networkPolicy: true
    domain: "cluster.local"
  sync:
    kind: GitRepository
    url: https://github.com/devopscoop/project1-dev
    ref: refs/heads/main
    path: fluxcd/flux
    pullSecret: flux-system
    provider: github
  kustomize:
    patches:
      - patch: |
          - op: add
            path: /spec/decryption
            value:
              provider: sops
              secretRef:
                name: sops-age
        target:
          kind: Kustomization
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#       # IRSA annotation so the image-reflector-controller can authenticate to AWS ECR to poll image tags
#       - patch: |
#           - op: add
#             path: /metadata/annotations
#             value:
#               eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/flux-image-reflector-controller"
#         target:
#           kind: ServiceAccount
#           name: image-reflector-controller
# <<< eks
      # Pin controller images by digest (belt-and-braces on top of the exact
      # distribution.version pin above). These digests correspond to the
      # distribution.version above — run ./update_flux-instance.sh to refresh both.
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/source-controller:v1.10.1@sha256:611b6bca3eae95bcff471414d1fb14a4ab83d7f14e609cccef2bd389c121f37e"
        target:
          kind: Deployment
          name: source-controller
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/source-watcher:v2.3.1@sha256:cb94a51b0f7a433fd5610b5f3cd8eb06ba7d70c656a3594dfe19f656ee996d96"
        target:
          kind: Deployment
          name: source-watcher
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/kustomize-controller:v1.10.1@sha256:37db29b25dae35b881a5e064acedb0cc954442da453a39eaa0eab7a90dbecc4e"
        target:
          kind: Deployment
          name: kustomize-controller
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/helm-controller:v1.7.1@sha256:54526cc6ed1202d71d44c310676448065664f3255ad671d9a69ac26f904e617a"
        target:
          kind: Deployment
          name: helm-controller
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/notification-controller:v1.10.0@sha256:9f58b9532ec9d3ccf539cd3ccdf283477a5dcb7777b922db5477d8bbd4d3767c"
        target:
          kind: Deployment
          name: notification-controller
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/image-reflector-controller:v1.3.0@sha256:b4d2cbdc1b7a046c53786628fe900b72b31a95c4cec219478777e3f97c453635"
        target:
          kind: Deployment
          name: image-reflector-controller
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/image-automation-controller:v1.3.0@sha256:6ec488320def72fecfd01ab1289cc6c881d76b984fbbcf69b174e1e10886029e"
        target:
          kind: Deployment
          name: image-automation-controller
      # Controller resource requests/limits (operator-rendered Deployments, so
      # these must be set here rather than via a kustomize patch in the repo).
      # `cpu: null` strips the CPU limit the distribution's size profile bakes
      # in — CPU limits only cause CFS throttling; the request already
      # guarantees fair share under contention.
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: helm-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 209Mi
                      limits:
                        cpu: null
                        memory: 209Mi
        target:
          kind: Deployment
          name: helm-controller
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: image-automation-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 100Mi
                      limits:
                        cpu: null
                        memory: 100Mi
        target:
          kind: Deployment
          name: image-automation-controller
      # image-reflector was sized at 1069Mi from an earlier peak, right-sized
      # to 256Mi off 14d krr usage (2026-08-22), then OOMKilled at 256Mi on
      # 2026-08-26 — its badger cache spikes above steady-state usage, so
      # doubled to 512Mi.
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: image-reflector-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 512Mi
                      limits:
                        cpu: null
                        memory: 512Mi
        target:
          kind: Deployment
          name: image-reflector-controller
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: kustomize-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 23m
                        memory: 234Mi
                      limits:
                        cpu: null
                        memory: 234Mi
        target:
          kind: Deployment
          name: kustomize-controller
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: notification-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 100Mi
                      limits:
                        cpu: null
                        memory: 100Mi
        target:
          kind: Deployment
          name: notification-controller
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: source-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 328Mi
                      limits:
                        cpu: null
                        memory: 328Mi
        target:
          kind: Deployment
          name: source-controller
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: source-watcher
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 128Mi
                      limits:
                        cpu: null
                        memory: 128Mi
        target:
          kind: Deployment
          name: source-watcher
