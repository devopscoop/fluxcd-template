apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opencost
  namespace: flux-system
spec:
  # OpenCost queries vmsingle at runtime (see apps/opencost/values.yaml);
  # victoria-metrics has wait: true, so depending on it keeps a fresh
  # bootstrap from crashlooping the exporter while the TSDB is still coming
  # up. Its scrape object and dashboard live with the VictoriaMetrics stack:
  # apps/victoria-metrics-custom-resources and apps/victoria-metrics.
  dependsOn:
    - name: victoria-metrics
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: apps/opencost
  prune: true
  wait: true
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  suspend: false
